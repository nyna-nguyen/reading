 Volcanoes","labeled":true,"paras":["A volcano is a mountain with a hole at the top. The hole is called a crater. Most of the time, a volcano is quiet.","Deep under the ground, it is very hot. Some of the rock there melts. This hot, liquid rock is called magma.","Sometimes the magma pushes up and comes out of the crater. This is an eruption. When the liquid rock is outside the volcano, it is called lava. Lava is red and very hot. Clouds of grey ash go up into the sky.","Later, the lava gets cold and changes into hard, black rock. After many eruptions, the volcano becomes taller."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"v","ev":[1,"Deep under the ground, it is very hot."],"ex":"The whole of paragraph B is about this idea: “Hot rock under the ground”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Hot rock under the ground”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iii","ev":[2,"Sometimes the magma pushes up and comes out of the crater."],"ex":"The whole of paragraph C is about this idea: “When a volcano erupts”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “When a volcano erupts”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"ii","ev":[3,"Later, the lava gets cold and changes into hard, black rock."],"ex":"The whole of paragraph D is about this idea: “What happens to lava later”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “What happens to lava later”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","The biggest volcano in the world"],["ii","What happens to lava later"],["iii","When a volcano erupts"],["iv","Animals that live on volcanoes"],["v","Hot rock under the ground"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What is the hole at the top of a volcano called?","opts":["an eruption","magma","a crater","ash"],"a":"C","ev":[0,"The hole is called a crater."],"ex":"The passage says: “The hole is called a crater.”","vi":"Trong bài: “The hole is called a crater.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"When liquid rock is outside the volcano, it is called ___.","a":["lava"],"ev":[2,"When the liquid rock is outside the volcano, it is called lava."],"ex":"Find it in the passage: “When the liquid rock is outside the volcano, it is called lava.”","vi":"Tìm trong bài: “When the liquid rock is outside the volcano, it is called lava.”","hint":"Look at paragraph C."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"The Town Under the Ash","topic":"Ancient Rome","labeled":true,"paras":["Two thousand years ago, Pompeii was a busy Roman town in Italy. It had shops, houses, a theatre and a market. About eleven thousand people lived there.","Pompeii was near a mountain called Vesuvius. People did not know that the mountain was a volcano. They grew fruit on its sides.","One day in the year 79, Vesuvius erupted. A huge cloud of ash went up into the sky. Then ash and small stones fell on the town like snow. Many people ran away, but some stayed.","The next day, Pompeii was under several metres of ash. Nobody could see the town. Slowly, people forgot about it."],"groups":[{"type":"para","items":[{"n":11,"q":"what people grew on the mountain","a":"B","ev":[1,"They grew fruit on its sides."],"ex":"Paragraph B says: “They grew fruit on its sides.”","vi":"Đoạn B viết: “They grew fruit on its sides.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"the number of people who lived in Pompeii","a":"A","ev":[0,"About eleven thousand people lived there."],"ex":"Paragraph A says: “About eleven thousand people lived there.”","vi":"Đoạn A viết: “About eleven thousand people lived there.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["vesuvius"],"ev":[2,"One day in the year 79, Vesuvius erupted."],"ex":"Find it in the passage: “One day in the year 79, Vesuvius erupted.”","vi":"Tìm trong bài: “One day in the year 79, Vesuvius erupted.”","hint":"Look at paragraph C."},{"n":14,"a":["stones"],"ev":[2,"Then ash and small stones fell on the town like snow."],"ex":"Find it in the passage: “Then ash and small stones fell on the town like snow.”","vi":"Tìm trong bài: “Then ash and small stones fell on the town like snow.”","hint":"Look at paragraph C."}],"text":"In the year 79, the volcano {13} erupted. Ash and small {14} fell on the town like snow.","title":"The eruption","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What happened to Pompeii after the eruption?","opts":["It was moved to a new place.","It was covered and forgotten.","It became a market.","It was built again."],"a":"B","ev":[3,"Slowly, people forgot about it."],"ex":"The passage says: “Slowly, people forgot about it.”","vi":"Trong bài: “Slowly, people forgot about it.”","hint":"Look at paragraph D."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s5-practice","set":5,"kind":"practice","title":"Bộ 5 · Luyện tập","minutes":20,"passages":[{"title":"Disaster Prevention Day","topic":"Places","labeled":false,"paras":["On 1 September every year, millions of people in Japan practise for an earthquake. It is called Disaster Prevention Day. The date was chosen because a terrible earthquake hit Tokyo on 1 September 1923.","In schools, the drill starts with a loud alarm. Pupils drop to the floor, get under their desks and hold on. After a minute, they put on padded hoods, line up and walk outside.","Teachers repeat four rules: do not push, do not run, do not talk and do not go back.","Families prepare too. Many keep an emergency bag near the front door. Inside there are bottles of water, dry food, a torch and a radio. They also agree on a place to meet if they cannot go home."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Disaster Prevention Day is on the date of an earthquake in the past.","a":"T","ev":[0,"The date was chosen because a terrible earthquake hit Tokyo on 1 September 1923."],"ex":"The passage says the same thing in different words. The passage says: “The date was chosen because a terrible earthquake hit Tokyo on 1 September 1923.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “The date was chosen because a terrible earthquake hit Tokyo on 1 September 1923.”","hint":"Look at paragraph 1."},{"n":2,"q":"Pupils leave the classroom as soon as the alarm starts.","a":"F","ev":[1,"Pupils drop to the floor, get under their desks and hold on."],"ex":"The passage says something different. The passage says: “Pupils drop to the floor, get under their desks and hold on.”","vi":"Bài nói khác với câu này. Trong bài: “Pupils drop to the floor, get under their desks and hold on.”","hint":"Look at paragraph 2."},{"n":3,"q":"The school drill lasts for one hour.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not say how long the whole drill takes.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nói cả buổi diễn tập kéo dài bao lâu.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"Before they walk outside, pupils put on padded ___.","a":["hoods"],"ev":[1,"After a minute, they put on padded hoods, line up and walk outside."],"ex":"Find it in the passage: “After a minute, they put on padded hoods, line up and walk outside.”","vi":"Tìm trong bài: “After a minute, they put on padded hoods, line up and walk outside.”","hint":"Look at paragraph 2."},{"n":5,"q":"Many families keep an emergency bag near the front ___.","a":["door"],"ev":[3,"Many keep an emergency bag near the front door."],"ex":"Find it in the passage: “Many keep an emergency bag near the front door.”","vi":"Tìm trong bài: “Many keep an emergency bag near the front door.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Sleeping Giants","topic":"Science · Volcanoes","labeled":true,"paras":["Not all volcanoes are the same. An active volcano has erupted not long ago and may erupt again soon. A dormant volcano is \"sleeping\": it has been quiet for a long time, but it can wake up. An extinct volcano will never erupt again.","Before an eruption, there are often warning signs. The ground shakes with small earthquakes. Gas and steam come out of the crater. Scientists measure these signs and tell people to leave if there is danger.","An eruption can be deadly. Rivers of lava burn everything in their way. However, lava usually moves slowly, and people can escape. Clouds of hot ash are more dangerous, because they travel very fast.","Why do people live near volcanoes? One reason is the soil. Volcanic ash is full of things that plants need, so farms near volcanoes grow excellent crops such as coffee and rice."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"ii","ev":[1,"Before an eruption, there are often warning signs."],"ex":"The whole of paragraph B is about this idea: “Signs that an eruption is coming”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Signs that an eruption is coming”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iv","ev":[2,"An eruption can be deadly."],"ex":"The whole of paragraph C is about this idea: “The dangers of an eruption”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “The dangers of an eruption”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"Why do people live near volcanoes?"],"ex":"The whole of paragraph D is about this idea: “A good thing about volcanoes”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “A good thing about volcanoes”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","How to climb a volcano safely"],["ii","Signs that an eruption is coming"],["iii","The hottest lava ever measured"],["iv","The dangers of an eruption"],["v","A good thing about volcanoes"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What is a dormant volcano?","opts":["one that erupts every day","one that will never erupt again","one that is quiet now but can erupt again","one that is under the sea"],"a":"C","ev":[0,"A dormant volcano is \"sleeping\": it has been quiet for a long time, but it can wake up."],"ex":"The passage says: “A dormant volcano is \"sleeping\": it has been quiet for a long time, but it can wake up.”","vi":"Trong bài: “A dormant volcano is \"sleeping\": it has been quiet for a long time, but it can wake up.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Farms near volcanoes grow excellent crops such as ___ and rice.","a":["coffee"],"ev":[3,"Volcanic ash is full of things that plants need, so farms near volcanoes grow excellent crops such as coffee and rice."],"ex":"Find it in the passage: “Volcanic ash is full of things that plants need, so farms near volcanoes grow excellent crops such as coffee and rice.”","vi":"Tìm trong bài: “Volcanic ash is full of things that plants need, so farms near volcanoes grow excellent crops such as coffee and rice.”","hint":"Look at paragraph D."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Digging Up Pompeii","topic":"Ancient Rome","labeled":true,"paras":["In the year 79, the Roman town of Pompeii disappeared in a single day. The volcano Vesuvius buried it under about five metres of ash and stones.","For almost 1,700 years, the town lay hidden under fields. Farmers grew grapes above it and did not know what was below their feet.","In 1748, workers began to dig. They were amazed. The ash had protected everything. They found streets, houses and shops, almost the same as on the day of the eruption.","In one bakery, there were eighty-one loaves of bread still in the oven. On the walls of houses, there were colourful paintings. People had even written messages on the walls, such as the names of their friends.","Today, Pompeii is like a window into the past. Millions of visitors walk along its streets every year and see how ordinary Romans lived."],"groups":[{"type":"para","items":[{"n":11,"q":"the year when the digging started","a":"C","ev":[2,"In 1748, workers began to dig."],"ex":"Paragraph C says: “In 1748, workers began to dig.”","vi":"Đoạn C viết: “In 1748, workers began to dig.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"what farmers did above the hidden town","a":"B","ev":[1,"Farmers grew grapes above it and did not know what was below their feet."],"ex":"Paragraph B says: “Farmers grew grapes above it and did not know what was below their feet.”","vi":"Đoạn B viết: “Farmers grew grapes above it and did not know what was below their feet.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["protected"],"ev":[2,"The ash had protected everything."],"ex":"Find it in the passage: “The ash had protected everything.”","vi":"Tìm trong bài: “The ash had protected everything.”","hint":"Look at paragraph C."},{"n":14,"a":["bread"],"ev":[3,"In one bakery, there were eighty-one loaves of bread still in the oven."],"ex":"Find it in the passage: “In one bakery, there were eighty-one loaves of bread still in the oven.”","vi":"Tìm trong bài: “In one bakery, there were eighty-one loaves of bread still in the oven.”","hint":"Look at paragraph D."}],"text":"The ash had {13} everything in the town. In one bakery, loaves of {14} were still in the oven.","title":"What the workers found","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Why is Pompeii \"like a window into the past\"?","opts":["It is a new museum.","It shows how ordinary Romans lived.","It was built by farmers.","It has many glass windows."],"a":"B","ev":[4,"Millions of visitors walk along its streets every year and see how ordinary Romans lived."],"ex":"The passage says: “Millions of visitors walk along its streets every year and see how ordinary Romans lived.”","vi":"Trong bài: “Millions of visitors walk along its streets every year and see how ordinary Romans lived.”","hint":"Look at paragraph E."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s5-exam","set":5,"kind":"exam","title":"Bộ 5 · Thi","minutes":20,"passages":[{"title":"Ready for the Shaking","topic":"Places","labeled":false,"paras":["Japan has more than a thousand earthquakes a year that people can feel. Most are small, but people know that a big one may come at any time, so they prepare from childhood.","Every school holds regular drills. Pupils learn to drop under a desk, cover their heads and hold on until the shaking stops. Many classrooms keep a padded hood on each chair; during lessons it is used as a cushion.","Technology helps as well. Machines in the ground feel the first, weak waves of an earthquake and send a warning to phones and televisions. People may get only a few seconds, but that is enough to stop a train or move away from a window.","Buildings are also designed to survive. Modern towers in Tokyo can bend like trees in the wind instead of breaking.","After a serious earthquake, pupils do not go home alone. They wait at school until an adult from the family comes for them."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Most earthquakes in Japan are big.","a":"F","ev":[0,"Most are small, but people know that a big one may come at any time, so they prepare from childhood."],"ex":"The passage says something different. The passage says: “Most are small, but people know that a big one may come at any time, so they prepare from childhood.”","vi":"Bài nói khác với câu này. Trong bài: “Most are small, but people know that a big one may come at any time, so they prepare from childhood.”","hint":"Look at paragraph 1."},{"n":2,"q":"The padded hood has another use during lessons.","a":"T","ev":[1,"Many classrooms keep a padded hood on each chair; during lessons it is used as a cushion."],"ex":"The passage says the same thing in different words. The passage says: “Many classrooms keep a padded hood on each chair; during lessons it is used as a cushion.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “Many classrooms keep a padded hood on each chair; during lessons it is used as a cushion.”","hint":"Look at paragraph 2."},{"n":3,"q":"The warning system was invented in Tokyo.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage explains how the warning works, but not where it was invented.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài giải thích hệ thống cảnh báo hoạt động thế nào, không nói nó được phát minh ở đâu.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"A warning may give people only a few ___.","a":["seconds"],"ev":[2,"People may get only a few seconds, but that is enough to stop a train or move away from a window."],"ex":"Find it in the passage: “People may get only a few seconds, but that is enough to stop a train or move away from a window.”","vi":"Tìm trong bài: “People may get only a few seconds, but that is enough to stop a train or move away from a window.”","hint":"Look at paragraph 3."},{"n":5,"q":"Modern towers in Tokyo can bend like ___ in the wind.","a":["trees"],"ev":[3,"Modern towers in Tokyo can bend like trees in the wind instead of breaking."],"ex":"Find it in the passage: “Modern towers in Tokyo can bend like trees in the wind instead of breaking.”","vi":"Tìm trong bài: “Modern towers in Tokyo can bend like trees in the wind instead of breaking.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Fire from Below","topic":"Science · Volcanoes","labeled":true,"paras":["The Earth is not solid all the way through. Its hard outer layer, the crust, is broken into huge pieces called plates. They move very slowly, about as fast as your fingernails grow. Most volcanoes are found along the edges of these plates.","Under a volcano, there is a space full of magma. Magma is lighter than the solid rock around it, so it rises. Gas inside the magma pushes too, like the bubbles in a bottle of lemonade when you shake it. When the pressure becomes too great, the volcano erupts.","The results can change the whole planet. In 1815, Mount Tambora in Indonesia threw so much ash into the sky that it blocked some of the Sun's light. The next year was called \"the year without a summer\". Crops failed in Europe and North America, far from the volcano.","Yet volcanoes also give. Many islands, including Hawaii and Iceland, were made by volcanoes. The heat under the ground can be used to make electricity and to warm houses. In Iceland, most homes are heated in this way."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iii","ev":[1,"Under a volcano, there is a space full of magma."],"ex":"The whole of paragraph B is about this idea: “Why magma comes up”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Why magma comes up”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"i","ev":[2,"The results can change the whole planet."],"ex":"The whole of paragraph C is about this idea: “An eruption that changed the weather”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “An eruption that changed the weather”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"Yet volcanoes also give."],"ex":"The whole of paragraph D is about this idea: “Gifts from volcanoes”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Gifts from volcanoes”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","An eruption that changed the weather"],["ii","The first map of the plates"],["iii","Why magma comes up"],["iv","How fast fingernails grow"],["v","Gifts from volcanoes"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Where are most volcanoes found?","opts":["in Europe and North America","along the edges of plates","only on islands","in the middle of plates"],"a":"B","ev":[0,"Most volcanoes are found along the edges of these plates."],"ex":"The passage says: “Most volcanoes are found along the edges of these plates.”","vi":"Trong bài: “Most volcanoes are found along the edges of these plates.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"The hard outer layer of the Earth is called the ___.","a":["crust"],"ev":[0,"Its hard outer layer, the crust, is broken into huge pieces called plates."],"ex":"Find it in the passage: “Its hard outer layer, the crust, is broken into huge pieces called plates.”","vi":"Tìm trong bài: “Its hard outer layer, the crust, is broken into huge pieces called plates.”","hint":"Look at paragraph A."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"The Last Day of Pompeii","topic":"Ancient Rome","labeled":true,"paras":["One morning in the year 79, the people of Pompeii were shopping, cooking and working as usual. Around midday, Mount Vesuvius exploded. A column of ash and gas rose more than thirty kilometres into the sky.","Ash and light stones rained down for hours. Roofs broke under the weight. Many people escaped along the roads, carrying what they could. About two thousand stayed in the town, perhaps hoping the danger would pass.","Early the next morning, a cloud of burning gas and ash rushed down the mountain, faster than a running horse. Nobody who was still in Pompeii survived.","We know these details because of a seventeen-year-old boy. Pliny watched the eruption from across the bay and later described it in two letters. They are the oldest detailed report of a volcanic eruption.","Archaeologists are still working at Pompeii; about a third of the town has not been uncovered. Vesuvius is still active too. It last erupted in 1944, and about 600,000 people live close to it today. Scientists watch the mountain day and night."],"groups":[{"type":"para","items":[{"n":11,"q":"a possible reason why some people did not leave","a":"B","ev":[1,"About two thousand stayed in the town, perhaps hoping the danger would pass."],"ex":"Paragraph B says: “About two thousand stayed in the town, perhaps hoping the danger would pass.”","vi":"Đoạn B viết: “About two thousand stayed in the town, perhaps hoping the danger would pass.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"a part of the town that nobody has seen yet","a":"E","ev":[4,"Archaeologists are still working at Pompeii; about a third of the town has not been uncovered."],"ex":"Paragraph E says: “Archaeologists are still working at Pompeii; about a third of the town has not been uncovered.”","vi":"Đoạn E viết: “Archaeologists are still working at Pompeii; about a third of the town has not been uncovered.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["pliny"],"ev":[3,"Pliny watched the eruption from across the bay and later described it in two letters."],"ex":"Find it in the passage: “Pliny watched the eruption from across the bay and later described it in two letters.”","vi":"Tìm trong bài: “Pliny watched the eruption from across the bay and later described it in two letters.”","hint":"Look at paragraph D."},{"n":14,"a":["letters"],"ev":[3,"Pliny watched the eruption from across the bay and later described it in two letters."],"ex":"Find it in the passage: “Pliny watched the eruption from across the bay and later described it in two letters.”","vi":"Tìm trong bài: “Pliny watched the eruption from across the bay and later described it in two letters.”","hint":"Look at paragraph D."}],"text":"A boy named {13} watched the eruption from across the bay. Later, he described it in two {14}.","title":"How we know","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What happened early the next morning?","opts":["Rain washed the ash away.","A cloud of burning gas and ash reached the town.","The eruption stopped.","People came back for their things."],"a":"B","ev":[2,"Early the next morning, a cloud of burning gas and ash rushed down the mountain, faster than a running horse."],"ex":"The passage says: “Early the next morning, a cloud of burning gas and ash rushed down the mountain, faster than a running horse.”","vi":"Trong bài: “Early the next morning, a cloud of burning gas and ash rushed down the mountain, faster than a running horse.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s6-try","set":6,"kind":"try","title":"Bộ 6 · Thử","minutes":20,"passages":[{"title":"William's Windmill","topic":"Talking about people","labeled":false,"paras":["William Kamkwamba grew up on a small farm in Malawi, a country in Africa. His village had no electricity. At night, it was completely dark.","When William was fourteen, there was very little rain, and the plants in the fields died. His family did not have enough money for school, so William had to leave.","But William still wanted to learn. He went to the village library. There he found a book with a picture of a windmill. The book said that a windmill can make electricity.","William decided to build one. He used old things: parts of a bicycle, pipes and pieces of wood. Finally, his windmill worked. It made enough electricity for four lights in his house."],"groups":[{"type":"tfng","items":[{"n":1,"q":"William's village had electricity when he was a child.","a":"F","ev":[0,"His village had no electricity."],"ex":"The passage says something different. The passage says: “His village had no electricity.”","vi":"Bài nói khác với câu này. Trong bài: “His village had no electricity.”","hint":"Look at paragraph 1."},{"n":2,"q":"William left school because his family was poor.","a":"T","ev":[1,"His family did not have enough money for school, so William had to leave."],"ex":"The passage says the same thing in different words. The passage says: “His family did not have enough money for school, so William had to leave.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “His family did not have enough money for school, so William had to leave.”","hint":"Look at paragraph 2."},{"n":3,"q":"William's father helped him to build the windmill.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage only says that William built it. It does not say who helped.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài chỉ nói William làm cối xay gió, không nói ai giúp.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"William found a book about windmills in the village ___.","a":["library"],"ev":[2,"He went to the village library."],"ex":"Find it in the passage: “He went to the village library.”","vi":"Tìm trong bài: “He went to the village library.”","hint":"Look at paragraph 3."},{"n":5,"q":"The windmill made enough electricity for four ___.","a":["lights"],"ev":[3,"It made enough electricity for four lights in his house."],"ex":"Find it in the passage: “It made enough electricity for four lights in his house.”","vi":"Tìm trong bài: “It made enough electricity for four lights in his house.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"A Path for Electricity","topic":"Science · Electricity","labeled":true,"paras":["We use electricity every day. It makes lamps shine and fans turn. But electricity needs a path to travel along. This path is called a circuit.","A simple circuit has three parts. A battery gives the power. Wires carry the electricity. A bulb uses the electricity to make light.","The circuit must be a complete circle. If there is a gap in the circle, the electricity stops, and the bulb goes off.","A switch is a part that opens and closes the gap. When you turn the switch on, the gap closes and the bulb shines. When you turn it off, the gap opens again."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"i","ev":[1,"A simple circuit has three parts."],"ex":"The whole of paragraph B is about this idea: “The parts of a circuit”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “The parts of a circuit”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"ii","ev":[2,"The circuit must be a complete circle."],"ex":"The whole of paragraph C is about this idea: “Why a circuit must have no gaps”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Why a circuit must have no gaps”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"A switch is a part that opens and closes the gap."],"ex":"The whole of paragraph D is about this idea: “What a switch does”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “What a switch does”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","The parts of a circuit"],["ii","Why a circuit must have no gaps"],["iii","How to make a battery"],["iv","Why bulbs get hot"],["v","What a switch does"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Which part gives the power in a circuit?","opts":["the switch","the battery","the wire","the bulb"],"a":"B","ev":[1,"A battery gives the power."],"ex":"The passage says: “A battery gives the power.”","vi":"Trong bài: “A battery gives the power.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"The path that electricity travels along is called a ___.","a":["circuit"],"ev":[0,"This path is called a circuit."],"ex":"Find it in the passage: “This path is called a circuit.”","vi":"Tìm trong bài: “This path is called a circuit.”","hint":"Look at paragraph A."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"A Light for Sailors","topic":"Places","labeled":true,"paras":["A lighthouse is a tall tower near the sea. At the top, there is a very bright light. The light turns round and round at night.","Lighthouses help sailors. In the dark, sailors cannot see rocks in the water. The light tells them, \"Be careful! There is danger here.\" It also shows them the way to the harbour.","Long ago, the light was a fire. Later, people used big oil lamps. A person called a lighthouse keeper lived in the tower. Every evening, he climbed the stairs and lit the lamp.","Today, lighthouses use electricity. The lights turn on by themselves, so keepers are not needed."],"groups":[{"type":"para","items":[{"n":11,"q":"who looked after the light in the past","a":"C","ev":[2,"A person called a lighthouse keeper lived in the tower."],"ex":"Paragraph C says: “A person called a lighthouse keeper lived in the tower.”","vi":"Đoạn C viết: “A person called a lighthouse keeper lived in the tower.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"why sailors need lighthouses","a":"B","ev":[1,"In the dark, sailors cannot see rocks in the water."],"ex":"Paragraph B says: “In the dark, sailors cannot see rocks in the water.”","vi":"Đoạn B viết: “In the dark, sailors cannot see rocks in the water.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["fire"],"ev":[2,"Long ago, the light was a fire."],"ex":"Find it in the passage: “Long ago, the light was a fire.”","vi":"Tìm trong bài: “Long ago, the light was a fire.”","hint":"Look at paragraph C."},{"n":14,"a":["electricity"],"ev":[3,"Today, lighthouses use electricity."],"ex":"Find it in the passage: “Today, lighthouses use electricity.”","vi":"Tìm trong bài: “Today, lighthouses use electricity.”","hint":"Look at paragraph D."}],"text":"Long ago, the light of a lighthouse was a {13}. Today, lighthouses use {14}.","title":"Lighthouses then and now","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Where is the light in a lighthouse?","opts":["next to the door","under the water","at the top of the tower","on the rocks"],"a":"C","ev":[0,"At the top, there is a very bright light."],"ex":"The passage says: “At the top, there is a very bright light.”","vi":"Trong bài: “At the top, there is a very bright light.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s6-practice","set":6,"kind":"practice","title":"Bộ 6 · Luyện tập","minutes":20,"passages":[{"title":"The Boy and the Wind","topic":"Talking about people","labeled":false,"paras":["In 2001, the rain did not come to Malawi. Farmers had almost no food to sell, and many families were hungry. Fourteen-year-old William Kamkwamba had to leave school because his parents could not pay.","William spent his days in a small library. His English was not good, so he studied the pictures in the science books. One book showed windmills, and it gave him an idea.","He collected things that other people had thrown away: a bicycle wheel, a fan from a tractor and some plastic pipes. His neighbours laughed at him. Some thought he was crazy.","After many weeks, William climbed his wooden tower and connected a small bulb. The wind turned the blades, and the bulb lit up. The neighbours stopped laughing. Soon they were queuing at his house to charge their phones."],"groups":[{"type":"tfng","items":[{"n":1,"q":"William could not understand all the words in the books.","a":"T","ev":[1,"His English was not good, so he studied the pictures in the science books."],"ex":"The passage says the same thing in different words. The passage says: “His English was not good, so he studied the pictures in the science books.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “His English was not good, so he studied the pictures in the science books.”","hint":"Look at paragraph 2."},{"n":2,"q":"William bought new parts for his windmill.","a":"F","ev":[2,"He collected things that other people had thrown away: a bicycle wheel, a fan from a tractor and some plastic pipes."],"ex":"The passage says something different. The passage says: “He collected things that other people had thrown away: a bicycle wheel, a fan from a tractor and some plastic pipes.”","vi":"Bài nói khác với câu này. Trong bài: “He collected things that other people had thrown away: a bicycle wheel, a fan from a tractor and some plastic pipes.”","hint":"Look at paragraph 3."},{"n":3,"q":"William's sisters helped him to collect the parts.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not say that anyone helped William.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nói có ai giúp William.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The fan for the windmill came from a ___.","a":["tractor"],"ev":[2,"He collected things that other people had thrown away: a bicycle wheel, a fan from a tractor and some plastic pipes."],"ex":"Find it in the passage: “He collected things that other people had thrown away: a bicycle wheel, a fan from a tractor and some plastic pipes.”","vi":"Tìm trong bài: “He collected things that other people had thrown away: a bicycle wheel, a fan from a tractor and some plastic pipes.”","hint":"Look at paragraph 3."},{"n":5,"q":"Neighbours came to William's house to charge their ___.","a":["phones"],"ev":[3,"Soon they were queuing at his house to charge their phones."],"ex":"Find it in the passage: “Soon they were queuing at his house to charge their phones.”","vi":"Tìm trong bài: “Soon they were queuing at his house to charge their phones.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"What Lets Electricity Through?","topic":"Science · Electricity","labeled":true,"paras":["Electricity cannot travel through everything. Materials that let electricity pass are called conductors. Metals, such as copper and iron, are good conductors.","Materials that stop electricity are called insulators. Plastic, rubber, glass and dry wood are insulators. They are just as useful as conductors, because they keep us safe.","Look at an electric wire. The inside is made of copper, so the electricity can flow. The outside is covered with plastic, so you can touch the wire without getting hurt.","Water is different from what many people think. The water from a tap can carry electricity. This is why you must never touch a switch or a plug with wet hands."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"v","ev":[1,"Materials that stop electricity are called insulators."],"ex":"The whole of paragraph B is about this idea: “Materials that block electricity”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Materials that block electricity”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"ii","ev":[2,"Look at an electric wire."],"ex":"The whole of paragraph C is about this idea: “Two materials in one wire”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Two materials in one wire”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"iii","ev":[3,"Water is different from what many people think."],"ex":"The whole of paragraph D is about this idea: “The danger of water”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “The danger of water”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","How glass is made"],["ii","Two materials in one wire"],["iii","The danger of water"],["iv","Why copper is expensive"],["v","Materials that block electricity"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Why is the outside of a wire covered with plastic?","opts":["to make it safe to touch","to keep it dry","to help the electricity flow","to make it look nice"],"a":"A","ev":[2,"The outside is covered with plastic, so you can touch the wire without getting hurt."],"ex":"The passage says: “The outside is covered with plastic, so you can touch the wire without getting hurt.”","vi":"Trong bài: “The outside is covered with plastic, so you can touch the wire without getting hurt.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Materials that let electricity pass are called ___.","a":["conductors"],"ev":[0,"Materials that let electricity pass are called conductors."],"ex":"Find it in the passage: “Materials that let electricity pass are called conductors.”","vi":"Tìm trong bài: “Materials that let electricity pass are called conductors.”","hint":"Look at paragraph A."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"The Light of Alexandria","topic":"Places","labeled":true,"paras":["The most famous lighthouse in history stood in Alexandria, in Egypt. It was built about 2,300 years ago and was more than 100 metres tall. For centuries it was one of the tallest buildings in the world.","At night, a fire burned at the top. During the day, people say that a huge mirror reflected the light of the sun. Sailors could see it from far out at sea.","The lighthouse stood for about 1,500 years. Then a number of earthquakes damaged it, and finally it fell into the sea.","In 1994, divers found hundreds of large stone blocks on the sea floor near Alexandria. Experts believe that they are pieces of the lighthouse.","Lighthouses today are much smaller, but they do the same job. They warn ships about rocks and guide them safely to the harbour."],"groups":[{"type":"para","items":[{"n":11,"q":"how the lighthouse was destroyed","a":"C","ev":[2,"Then a number of earthquakes damaged it, and finally it fell into the sea."],"ex":"Paragraph C says: “Then a number of earthquakes damaged it, and finally it fell into the sea.”","vi":"Đoạn C viết: “Then a number of earthquakes damaged it, and finally it fell into the sea.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"a discovery under the water","a":"D","ev":[3,"In 1994, divers found hundreds of large stone blocks on the sea floor near Alexandria."],"ex":"Paragraph D says: “In 1994, divers found hundreds of large stone blocks on the sea floor near Alexandria.”","vi":"Đoạn D viết: “In 1994, divers found hundreds of large stone blocks on the sea floor near Alexandria.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["mirror"],"ev":[1,"During the day, people say that a huge mirror reflected the light of the sun."],"ex":"Find it in the passage: “During the day, people say that a huge mirror reflected the light of the sun.”","vi":"Tìm trong bài: “During the day, people say that a huge mirror reflected the light of the sun.”","hint":"Look at paragraph B."},{"n":14,"a":["sailors"],"ev":[1,"Sailors could see it from far out at sea."],"ex":"Find it in the passage: “Sailors could see it from far out at sea.”","vi":"Tìm trong bài: “Sailors could see it from far out at sea.”","hint":"Look at paragraph B."}],"text":"At night, a fire burned at the top of the lighthouse. During the day, a huge {13} reflected the light of the sun, and {14} could see it from far away.","title":"Day and night","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What do lighthouses do today?","opts":["They help divers under the sea.","They reflect the sun with mirrors.","They show the time to sailors.","They warn ships about rocks."],"a":"D","ev":[4,"They warn ships about rocks and guide them safely to the harbour."],"ex":"The passage says: “They warn ships about rocks and guide them safely to the harbour.”","vi":"Trong bài: “They warn ships about rocks and guide them safely to the harbour.”","hint":"Look at paragraph E."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s6-exam","set":6,"kind":"exam","title":"Bộ 6 · Thi","minutes":20,"passages":[{"title":"Power from Rubbish","topic":"Talking about people","labeled":false,"paras":["William Kamkwamba was fourteen when hunger came to his village in Malawi. With no money for school fees, he had to stay at home. Instead of giving up, he borrowed books from a small library and taught himself how electricity works.","His first windmill was built from rubbish: bicycle parts, a tractor fan and a tower made from blue gum trees. It powered four lights and two radios in his family's house. A second, bigger windmill pumped water for the fields, so the family could grow food even in dry months.","News of the \"electric wind\" travelled. A journalist wrote about William, and in 2007 he was invited to speak at an international conference. He was nervous, and his English was simple, but the audience loved his story.","With help from people he met there, William went back to school and later finished university in the United States. He has since returned to Malawi many times to work on projects for clean water and solar power."],"groups":[{"type":"tfng","items":[{"n":1,"q":"William learned about electricity without a teacher.","a":"T","ev":[0,"Instead of giving up, he borrowed books from a small library and taught himself how electricity works."],"ex":"The passage says the same thing in different words. The passage says: “Instead of giving up, he borrowed books from a small library and taught himself how electricity works.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “Instead of giving up, he borrowed books from a small library and taught himself how electricity works.”","hint":"Look at paragraph 1."},{"n":2,"q":"The second windmill was used to power radios.","a":"F","ev":[1,"A second, bigger windmill pumped water for the fields, so the family could grow food even in dry months."],"ex":"The passage says something different. The passage says: “A second, bigger windmill pumped water for the fields, so the family could grow food even in dry months.”","vi":"Bài nói khác với câu này. Trong bài: “A second, bigger windmill pumped water for the fields, so the family could grow food even in dry months.”","hint":"Look at paragraph 2."},{"n":3,"q":"William's first windmill is now in a museum.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not say what happened to the first windmill later.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nói sau này chiếc cối xay gió đầu tiên ra sao.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The tower of the windmill was made from blue gum ___.","a":["trees"],"ev":[1,"His first windmill was built from rubbish: bicycle parts, a tractor fan and a tower made from blue gum trees."],"ex":"Find it in the passage: “His first windmill was built from rubbish: bicycle parts, a tractor fan and a tower made from blue gum trees.”","vi":"Tìm trong bài: “His first windmill was built from rubbish: bicycle parts, a tractor fan and a tower made from blue gum trees.”","hint":"Look at paragraph 2."},{"n":5,"q":"A ___ wrote about William and his windmill.","a":["journalist"],"ev":[2,"A journalist wrote about William, and in 2007 he was invited to speak at an international conference."],"ex":"Find it in the passage: “A journalist wrote about William, and in 2007 he was invited to speak at an international conference.”","vi":"Tìm trong bài: “A journalist wrote about William, and in 2007 he was invited to speak at an international conference.”","hint":"Look at paragraph 3."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Testing a Circuit","topic":"Science · Electricity","labeled":true,"paras":["Every time you turn on a torch, you complete a circuit. Electricity flows from the battery, along a wire, through the bulb and back to the battery. If the loop is broken at any point, the flow stops at once.","You can test materials with a simple circuit. Leave a gap between two wires and put an object across it. If the bulb lights, the object is a conductor. A metal spoon, a coin and a key will all light the bulb. A plastic ruler and a wooden pencil will not, because they are insulators. But the grey part inside a pencil, called graphite, is a surprise: it is not a metal, yet it conducts electricity.","Adding more parts changes a circuit. Two batteries make a bulb brighter than one. But if two bulbs share one battery in a single loop, both are dimmer.","The batteries in a torch are safe, but the electricity in the walls of your home is much stronger and can kill. Never push anything into a socket, and never use a phone that is charging while you are in the bath."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iii","ev":[1,"You can test materials with a simple circuit."],"ex":"The whole of paragraph B is about this idea: “Finding out what conducts”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Finding out what conducts”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"i","ev":[2,"Adding more parts changes a circuit."],"ex":"The whole of paragraph C is about this idea: “More batteries, more bulbs”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “More batteries, more bulbs”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"ii","ev":[3,"The batteries in a torch are safe, but the electricity in the walls of your home is much stronger and can kill."],"ex":"The whole of paragraph D is about this idea: “Staying safe at home”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Staying safe at home”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","More batteries, more bulbs"],["ii","Staying safe at home"],["iii","Finding out what conducts"],["iv","How batteries are recycled"],["v","Who invented the torch"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Why is graphite \"a surprise\"?","opts":["It conducts electricity although it is not a metal.","It is a metal that does not conduct.","It makes the bulb brighter than a coin does.","It is found inside plastic rulers."],"a":"A","ev":[1,"But the grey part inside a pencil, called graphite, is a surprise: it is not a metal, yet it conducts electricity."],"ex":"The passage says: “But the grey part inside a pencil, called graphite, is a surprise: it is not a metal, yet it conducts electricity.”","vi":"Trong bài: “But the grey part inside a pencil, called graphite, is a surprise: it is not a metal, yet it conducts electricity.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Two bulbs that share one battery in a single loop are both ___.","a":["dimmer"],"ev":[2,"But if two bulbs share one battery in a single loop, both are dimmer."],"ex":"Find it in the passage: “But if two bulbs share one battery in a single loop, both are dimmer.”","vi":"Tìm trong bài: “But if two bulbs share one battery in a single loop, both are dimmer.”","hint":"Look at paragraph C."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Keepers of the Light","topic":"Places","labeled":true,"paras":["For thousands of years, people lit fires on hills to guide ships home. The first great lighthouse was built in Alexandria about 2,300 years ago, with a fire at the top of a tower more than 100 metres high.","Fire has a weakness: its light spreads in all directions and soon becomes too weak to see. In 1822, a French scientist, Augustin Fresnel, solved this problem. He designed a lens made of rings of glass that collected the light of a lamp into one strong beam. Ships could now see a lighthouse from more than thirty kilometres away.","Someone still had to look after the lamp. Lighthouse keepers lived in the towers, often on lonely rocks far from any town. They carried oil up hundreds of stairs, cleaned the glass and stayed awake through storms. Some did not see their families for months.","In the twentieth century, electric lamps and automatic machines slowly replaced the keepers. Today, almost all lighthouses work by themselves.","Modern ships find their way with satellites, so do we still need lighthouses? Sailors say yes. Machines can fail, but a light on a rock is always there. Many old lighthouses have also found a new life as museums and small hotels."],"groups":[{"type":"para","items":[{"n":11,"q":"a description of a hard and lonely job","a":"C","ev":[2,"Lighthouse keepers lived in the towers, often on lonely rocks far from any town."],"ex":"Paragraph C says: “Lighthouse keepers lived in the towers, often on lonely rocks far from any town.”","vi":"Đoạn C viết: “Lighthouse keepers lived in the towers, often on lonely rocks far from any town.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"an argument for keeping lighthouses","a":"E","ev":[4,"Machines can fail, but a light on a rock is always there."],"ex":"Paragraph E says: “Machines can fail, but a light on a rock is always there.”","vi":"Đoạn E viết: “Machines can fail, but a light on a rock is always there.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["lens"],"ev":[1,"He designed a lens made of rings of glass that collected the light of a lamp into one strong beam."],"ex":"Find it in the passage: “He designed a lens made of rings of glass that collected the light of a lamp into one strong beam.”","vi":"Tìm trong bài: “He designed a lens made of rings of glass that collected the light of a lamp into one strong beam.”","hint d more than twenty thousand tops!","The factory took the tops and made a strong, blue bench. Now the bench stands under a tree in the playground. On the back, it says: \"Made from our rubbish\"."],"groups":[{"type":"tfng","items":[{"n":1,"q":"It was Mr Tan's idea to use bottle tops.","a":"T","ev":[1,"\"We can make one from plastic bottle tops,\" he said."],"ex":"The passage says the same thing in different words. The passage says: “\"We can make one from plastic bottle tops,\" he said.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “\"We can make one from plastic bottle tops,\" he said.”","hint":"Look at paragraph 2."},{"n":2,"q":"The children collected the bottle tops in one week.","a":"F","ev":[2,"After three months, the boxes were full."],"ex":"The passage says something different. The passage says: “After three months, the boxes were full.”","vi":"Bài nói khác với câu này. Trong bài: “After three months, the boxes were full.”","hint":"Look at paragraph 3."},{"n":3,"q":"The factory made the bench for free.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not say whether the school paid the factory.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nói trường có phải trả tiền cho nhà máy hay không.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The children put a big ___ in every classroom.","a":["box"],"ev":[2,"The children put a big box in every classroom."],"ex":"Find it in the passage: “The children put a big box in every classroom.”","vi":"Tìm trong bài: “The children put a big box in every classroom.”","hint":"Look at paragraph 3."},{"n":5,"q":"The factory made a strong, ___ bench.","a":["blue"],"ev":[3,"The factory took the tops and made a strong, blue bench."],"ex":"Find it in the passage: “The factory took the tops and made a strong, blue bench.”","vi":"Tìm trong bài: “The factory took the tops and made a strong, blue bench.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Solid, Liquid, Gas","topic":"Science · Materials","labeled":true,"paras":["Everything around you is a solid, a liquid or a gas. A solid keeps its shape. A stone, a spoon and a book are solids. You can hold them in your hand.","A liquid does not have its own shape. It takes the shape of its container. If you pour milk from a bottle into a glass, the milk changes shape. A liquid can flow.","A gas is often invisible. The air around you is a gas. A gas spreads out and fills all the space it can. When you blow up a balloon, the air fills every part of it.","Water can be all three. Ice is solid water. The water you drink is a liquid. When water boils, it becomes a gas called steam."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iii","ev":[1,"A liquid does not have its own shape."],"ex":"The whole of paragraph B is about this idea: “Things that flow”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Things that flow”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"i","ev":[2,"A gas is often invisible."],"ex":"The whole of paragraph C is about this idea: “Something you often cannot see”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Something you often cannot see”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"Water can be all three."],"ex":"The whole of paragraph D is about this idea: “One material, three forms”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “One material, three forms”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Something you often cannot see"],["ii","How balloons are made"],["iii","Things that flow"],["iv","Why stones are heavy"],["v","One material, three forms"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Which of these is a solid?","opts":["air","steam","milk","a spoon"],"a":"D","ev":[0,"A stone, a spoon and a book are solids."],"ex":"The passage says: “A stone, a spoon and a book are solids.”","vi":"Trong bài: “A stone, a spoon and a book are solids.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"A liquid takes the shape of its ___.","a":["container"],"ev":[1,"It takes the shape of its container."],"ex":"Find it in the passage: “It takes the shape of its container.”","vi":"Tìm trong bài: “It takes the shape of its container.”","hint":"Look at paragraph B."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Who Made the First Paper?","topic":"Ancient civilisations","labeled":true,"paras":["Today, paper is everywhere. We write on it, read from it and wrap presents in it. But long ago, there was no paper.","In ancient China, people wrote on thin pieces of bamboo. Bamboo books were very heavy. Rich people wrote on silk, but silk was expensive.","About 1,900 years ago, a Chinese man named Cai Lun found a better way. He mixed tree bark, old cloth and old fishing nets with water. He beat the mixture until it was soft.","Then he spread the wet mixture on a flat screen and left it in the sun. When it was dry, it was a thin, light sheet. It was paper!"],"groups":[{"type":"para","items":[{"n":11,"q":"the problem with bamboo books","a":"B","ev":[1,"Bamboo books were very heavy."],"ex":"Paragraph B says: “Bamboo books were very heavy.”","vi":"Đoạn B viết: “Bamboo books were very heavy.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"how the wet mixture became paper","a":"D","ev":[3,"Then he spread the wet mixture on a flat screen and left it in the sun."],"ex":"Paragraph D says: “Then he spread the wet mixture on a flat screen and left it in the sun.”","vi":"Đoạn D viết: “Then he spread the wet mixture on a flat screen and left it in the sun.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["bark"],"ev":[2,"He mixed tree bark, old cloth and old fishing nets with water."],"ex":"Find it in the passage: “He mixed tree bark, old cloth and old fishing nets with water.”","vi":"Tìm trong bài: “He mixed tree bark, old cloth and old fishing nets with water.”","hint":"Look at paragraph C."},{"n":14,"a":["sun"],"ev":[3,"Then he spread the wet mixture on a flat screen and left it in the sun."],"ex":"Find it in the passage: “Then he spread the wet mixture on a flat screen and left it in the sun.”","vi":"Tìm trong bài: “Then he spread the wet mixture on a flat screen and left it in the sun.”","hint":"Look at paragraph D."}],"text":"Cai Lun mixed tree {13}, old cloth and old fishing nets with water. Then he left the wet mixture in the {14}.","title":"Cai Lun's paper","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Who wrote on silk in ancient China?","opts":["farmers","fishermen","rich people","children"],"a":"C","ev":[1,"Rich people wrote on silk, but silk was expensive."],"ex":"The passage says: “Rich people wrote on silk, but silk was expensive.”","vi":"Trong bài: “Rich people wrote on silk, but silk was expensive.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s7-practice","set":7,"kind":"practice","title":"Bộ 7 · Luyện tập","minutes":20,"passages":[{"title":"Sorting It Out","topic":"Planet Earth","labeled":false,"paras":["After the success of their bottle-top bench, the pupils of Class 4B looked at the school's rubbish. They were shocked. Every day, the school filled six large bins, and everything went into the same bins.","The class decided to sort the rubbish. They painted three bins: blue for paper, yellow for plastic and green for food. They made posters to explain the colours.","At first, there were mistakes. Some younger children put banana skins in the paper bin. So two pupils from 4B stood next to the bins every lunchtime and helped.","The results were clear. The paper and plastic went to a recycling factory. The food went to the school garden and became compost for the vegetables. After one term, the school filled only two bins of real rubbish a day."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Before the project, all the rubbish was mixed together.","a":"T","ev":[0,"Every day, the school filled six large bins, and everything went into the same bins."],"ex":"The passage says the same thing in different words. The passage says: “Every day, the school filled six large bins, an
