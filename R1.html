 the vegetables.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Changing State","topic":"Science · Materials","labeled":true,"paras":["Materials can change from one state to another when they get hotter or colder. When a solid becomes a liquid, we say it melts. Ice melts at 0 degrees. Chocolate melts in your warm hand.","When a liquid gets cold enough, it becomes a solid. This is called freezing. Water freezes at 0 degrees, the same temperature at which ice melts.","A liquid can also change into a gas. A puddle on the playground slowly disappears on a sunny day. The water has not gone; it has evaporated into the air. If you heat water to 100 degrees, it boils and changes into gas very quickly.","These changes can be reversed. You can freeze water and melt it again as many times as you like. But some changes cannot go back. When you cook an egg or burn a piece of paper, you make something new."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"i","ev":[1,"When a liquid gets cold enough, it becomes a solid."],"ex":"The whole of paragraph B is about this idea: “From liquid to solid”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “From liquid to solid”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"ii","ev":[2,"A liquid can also change into a gas."],"ex":"The whole of paragraph C is about this idea: “Two ways for water to become a gas”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Two ways for water to become a gas”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"iii","ev":[3,"These changes can be reversed."],"ex":"The whole of paragraph D is about this idea: “Changes that can and cannot be undone”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Changes that can and cannot be undone”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","From liquid to solid"],["ii","Two ways for water to become a gas"],["iii","Changes that can and cannot be undone"],["iv","The coldest place on Earth"],["v","Why chocolate is sweet"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What happens to a puddle on a sunny day?","opts":["The water burns.","The water evaporates.","The water melts.","The water freezes."],"a":"B","ev":[2,"The water has not gone; it has evaporated into the air."],"ex":"The passage says: “The water has not gone; it has evaporated into the air.”","vi":"Trong bài: “The water has not gone; it has evaporated into the air.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"When a liquid becomes a solid, the change is called ___.","a":["freezing"],"ev":[1,"This is called freezing."],"ex":"Find it in the passage: “This is called freezing.”","vi":"Tìm trong bài: “This is called freezing.”","hint":"Look at paragraph B."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"A Present for the Emperor","topic":"Ancient civilisations","labeled":true,"paras":["Before paper, writing was difficult everywhere. In Egypt, people wrote on papyrus, made from a plant that grew beside the River Nile. In Europe, they used the skins of animals. One large book could need the skins of two hundred sheep.","In China, books were made from strips of bamboo tied together. A single long book could fill a cart.","In the year 105, Cai Lun, an official who worked for the emperor, showed the emperor a new material. He had made it from bark, old cloth and fishing nets. It was light, smooth and cheap.","The emperor was very pleased and gave Cai Lun a reward. Soon people all over China were using paper for books, letters and umbrellas.","The Chinese kept the method secret for hundreds of years. Paper-making did not reach Europe until about a thousand years after Cai Lun."],"groups":[{"type":"para","items":[{"n":11,"q":"the emperor's reaction to the new material","a":"D","ev":[3,"The emperor was very pleased and gave Cai Lun a reward."],"ex":"Paragraph D says: “The emperor was very pleased and gave Cai Lun a reward.”","vi":"Đoạn D viết: “The emperor was very pleased and gave Cai Lun a reward.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"a writing material that came from animals","a":"A","ev":[0,"In Europe, they used the skins of animals."],"ex":"Paragraph A says: “In Europe, they used the skins of animals.”","vi":"Đoạn A viết: “In Europe, they used the skins of animals.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["papyrus"],"ev":[0,"In Egypt, people wrote on papyrus, made from a plant that grew beside the River Nile."],"ex":"Find it in the passage: “In Egypt, people wrote on papyrus, made from a plant that grew beside the River Nile.”","vi":"Tìm trong bài: “In Egypt, people wrote on papyrus, made from a plant that grew beside the River Nile.”","hint":"Look at paragraph A."},{"n":14,"a":["bamboo"],"ev":[1,"In China, books were made from strips of bamboo tied together."],"ex":"Find it in the passage: “In China, books were made from strips of bamboo tied together.”","vi":"Tìm trong bài: “In China, books were made from strips of bamboo tied together.”","hint":"Look at paragraph B."}],"text":"In Egypt, people wrote on {13}, which was made from a plant. In China, books were made from strips of {14}.","title":"Writing before paper","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Why did paper-making reach Europe so late?","opts":["There were no trees in Europe.","Europeans did not like paper.","The Chinese kept the method secret.","The emperor did not allow books."],"a":"C","ev":[4,"The Chinese kept the method secret for hundreds of years."],"ex":"The passage says: “The Chinese kept the method secret for hundreds of years.”","vi":"Trong bài: “The Chinese kept the method secret for hundreds of years.”","hint":"Look at paragraph E."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s7-exam","set":7,"kind":"exam","title":"Bộ 7 · Thi","minutes":20,"passages":[{"title":"A Second Life for Plastic","topic":"Planet Earth","labeled":false,"paras":["Plastic is a wonderful material. It is light, strong and cheap, and it does not rot. But this is also its problem. A plastic bottle that is thrown away today may still be lying in the ground hundreds of years from now.","One answer is to recycle. First, used plastic is collected and sorted, because different kinds of plastic cannot be mixed. Next, machines wash it and cut it into small flakes. The flakes are melted and made into tiny balls. Finally, factories turn these into new things: benches, pipes, toys and even clothes. About twenty-five bottles can make one warm jacket.","However, recycling does not solve everything. Plastic becomes weaker each time it is melted, so it can only be recycled a few times. Experts say that the best idea is to use less plastic from the start. A water bottle that you fill again every day is better than a hundred bottles in the recycling bin."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Plastic stays in the ground for a very long time.","a":"T","ev":[0,"A plastic bottle that is thrown away today may still be lying in the ground hundreds of years from now."],"ex":"The passage says the same thing in different words. The passage says: “A plastic bottle that is thrown away today may still be lying in the ground hundreds of years from now.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “A plastic bottle that is thrown away today may still be lying in the ground hundreds of years from now.”","hint":"Look at paragraph 1."},{"n":2,"q":"Recycled plastic is cheaper than new plastic.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage says plastic is cheap, but it does not compare the price of new and recycled plastic.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài nói nhựa rẻ, nhưng không so sánh giá nhựa mới với nhựa tái chế.","hint":"Read the whole passage again. Is this information really there?"},{"n":3,"q":"Plastic can be recycled again and again for ever.","a":"F","ev":[2,"Plastic becomes weaker each time it is melted, so it can only be recycled a few times."],"ex":"The passage says something different. The passage says: “Plastic becomes weaker each time it is melted, so it can only be recycled a few times.”","vi":"Bài nói khác với câu này. Trong bài: “Plastic becomes weaker each time it is melted, so it can only be recycled a few times.”","hint":"Look at paragraph 3."}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"Machines wash the plastic and cut it into small ___.","a":["flakes"],"ev":[1,"Next, machines wash it and cut it into small flakes."],"ex":"Find it in the passage: “Next, machines wash it and cut it into small flakes.”","vi":"Tìm trong bài: “Next, machines wash it and cut it into small flakes.”","hint":"Look at paragraph 2."},{"n":5,"q":"About twenty-five bottles can make one warm ___.","a":["jacket"],"ev":[1,"About twenty-five bottles can make one warm jacket."],"ex":"Find it in the passage: “About twenty-five bottles can make one warm jacket.”","vi":"Tìm trong bài: “About twenty-five bottles can make one warm jacket.”","hint":"Look at paragraph 2."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"The Secret Life of Particles","topic":"Science · Materials","labeled":true,"paras":["Why does a rock keep its shape while water runs through your fingers? The answer is in the tiny particles that everything is made of. They are far too small to see, even with a school microscope.","In a solid, the particles are packed closely together in neat rows. They cannot change places; they can only shake a little. This is why a solid is hard and keeps its shape.","In a liquid, the particles are still close, but they can slide past each other. That is why a liquid flows and takes the shape of its container. In a gas, the particles are far apart and fly around at high speed in all directions, so a gas fills any space.","Heat gives particles more energy. When ice is warmed, its particles shake faster and faster until they break out of their rows, and the ice melts. With more heat, they move so fast that they escape into the air as gas. Cooling does the opposite: the particles slow down and move closer together again."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iv","ev":[1,"In a solid, the particles are packed closely together in neat rows."],"ex":"The whole of paragraph B is about this idea: “Particles that stay in their places”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Particles that stay in their places”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"v","ev":[2,"In a liquid, the particles are still close, but they can slide past each other."],"ex":"The whole of paragraph C is about this idea: “Particles that can move around”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Particles that can move around”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"ii","ev":[3,"Heat gives particles more energy."],"ex":"The whole of paragraph D is about this idea: “What heat does to particles”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “What heat does to particles”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Why rocks have different colours"],["ii","What heat does to particles"],["iii","How a microscope works"],["iv","Particles that stay in their places"],["v","Particles that can move around"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"How do the particles in a gas behave?","opts":["They are packed in neat rows.","They are far apart and move fast.","They slide slowly past each other.","They do not move at all."],"a":"B","ev":[2,"In a gas, the particles are far apart and fly around at high speed in all directions, so a gas fills any space."],"ex":"The passage says: “In a gas, the particles are far apart and fly around at high speed in all directions, so a gas fills any space.”","vi":"Trong bài: “In a gas, the particles are far apart and fly around at high speed in all directions, so a gas fills any space.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"In a solid, the particles are packed closely together in neat ___.","a":["rows"],"ev":[1,"In a solid, the particles are packed closely together in neat rows."],"ex":"Find it in the passage: “In a solid, the particles are packed closely together in neat rows.”","vi":"Tìm trong bài: “In a solid, the particles are packed closely together in neat rows.”","hint":"Look at paragraph B."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"The Sheet That Changed the World","topic":"Ancient civilisations","labeled":true,"paras":["A sheet of paper looks simple, but it changed the world. Before it existed, books were made from bamboo, silk, papyrus or animal skin. All of these were either heavy or very expensive, so only a few people could own a book.","Paper as we know it was first described in China in the year 105 by an official named Cai Lun. In fact, pieces of older paper have been found, so he probably improved the method and did not invent it. His recipe used bark, rags and old fishing nets, things that cost almost nothing.","Travellers and traders carried the secret west. It reached the Arab world in the eighth century and Europe about four hundred years later. At first, Europeans made paper by hand from old clothes.","The real change came in the fifteenth century, when the printing press was invented in Germany. Suddenly, books could be made quickly, and they needed huge amounts of paper. Paper mills opened across Europe, and ordinary people began to read.","Today the world uses about four hundred million tonnes of paper a year. Most of it is made from trees, so recycling matters. A sheet of paper can be recycled five to seven times before its fibres become too short."],"groups":[{"type":"para","items":[{"n":11,"q":"evidence that paper existed before Cai Lun","a":"B","ev":[1,"In fact, pieces of older paper have been found, so he probably improved the method and did not invent it."],"ex":"Paragraph B says: “In fact, pieces of older paper have been found, so he probably improved the method and did not invent it.”","vi":"Đoạn B viết: “In fact, pieces of older paper have been found, so he probably improved the method and did not invent it.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"an invention that increased the need for paper","a":"D","ev":[3,"The real change came in the fifteenth century, when the printing press was invented in Germany."],"ex":"Paragraph D says: “The real change came in the fifteenth century, when the printing press was invented in Germany.”","vi":"Đoạn D viết: “The real change came in the fifteenth century, when the printing press was invented in Germany.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["trees"],"ev":[4,"Most of it is made from trees, so recycling matters."],"ex":"Find it in the passage: “Most of it is made from trees, so recycling matters.”","vi":"Tìm trong bài: “Most of it is made from trees, so recycling matters.”","hint":"Look at paragraph E."},{"n":14,"a":["fibres"],"ev": the wind vane on the roof."],"ex":"Find it in the passage: “Last, they look at the wind vane on the roof.”","vi":"Tìm trong bài: “Last, they look at the wind vane on the roof.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"The Layers of a Rainforest","topic":"Science · Habitats","labeled":true,"paras":["Rainforests grow in hot, wet places near the middle of the Earth. It rains there almost every day. A rainforest has four layers, like the floors of a building.","The top layer has the tallest trees. They stand above all the others and get the most sun. Eagles make their nests there.","Below them is the canopy. Here the leaves and branches are very thick. They make a green roof over the forest. Most rainforest animals live in the canopy, because there is a lot of fruit to eat.","The lowest layer is the forest floor. It is dark and wet, because the leaves above block the sunlight. Ants, spiders and some large animals live there."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"v","ev":[1,"The top layer has the tallest trees."],"ex":"The whole of paragraph B is about this idea: “The highest trees”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “The highest trees”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"i","ev":[2,"Below them is the canopy."],"ex":"The whole of paragraph C is about this idea: “A green roof full of life”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “A green roof full of life”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"iii","ev":[3,"The lowest layer is the fore e Goodall was born in England in 1934. When she was a little girl, she loved animals. Her favourite toy was a toy chimpanzee.","In 1960, when Jane was twenty-six, she went to Africa to study wild chimpanzees. She lived in a tent in the forest in Tanzania.","At first, the chimpanzees were afraid of her. They ran away when she came near. So Jane sat quietly and watched them from far away, day after day. After many months, they stopped running away.","Jane did not give the chimpanzees numbers. She gave them names, like David and Flo. She learned that every chimpanzee is different, just like people."],"groups":[{"type":"para","items":[{"n":11,"q":"where Jane lived in Africa","a":"B","ev":[1,"She lived in a tent in the forest in Tanzania."],"ex":"Paragraph B says: “She lived in a tent in the forest in Tanzania.”","vi":"Đoạn B viết: “She lived in a tent in the forest in Tanzania.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"what Jane called the chimpanzees","a":"D","ev":[3,"She gave them names, like David and Flo."],"ex":"Paragraph D says: “She gave them names, like David and Flo.”","vi":"Đoạn D viết: “She gave them names, like David and Flo.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["afraid"],"ev":[2,"At first, the chimpanzees were afraid of her."],"ex":"Find it in the passage: “At first, the chimpanzees were afraid of her.”","vi":"Tìm trong bài: “At first, the chimpanzees were afraid of her.”","hint":"Look at paragraph C."},{"n":14,"a":["quietly"],"ev":[2,"So Jane sat quietly and watched them from far away, day after day."],"ex":"Find it in the passage: “So Jane sat quietly and watched them from far away, day after day.”","vi":"Tìm trong bài: “So Jane sat quietly and watched them from far away, day after day.”","hint":"Look at paragraph C."}],"text":"At first, the chimpanzees were {13} of Jane. So she sat {14} and watched them from far away.","title":"Making friends","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What was Jane's favourite toy?","opts":["a toy chimpanzee","a toy dog","a doll","a ball"],"a":"A","ev":[0,"Her favourite toy was a toy chimpanzee."],"ex":"The passage says: “Her favourite toy was a toy chimpanzee.”","vi":"Trong bài: “Her favourite toy was a toy chimpanzee.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s8-practice","set":8,"kind":"practice","title":"Bộ 8 · Luyện tập","minutes":20,"passages":[{"title":"The Rainy Month","topic":"Weather and climate","labeled":false,"paras":["In October, the pupils of Class 4A became weather reporters. Every morning at nine, they measured the temperature, the rain and the wind, and wrote the numbers on a chart.","The first week was hot and dry. The rain gauge was empty for five days. Then, on 9 October, a storm arrived. In one night, the gauge collected 85 millimetres of rain. The playground looked like a lake.","The pupils noticed something interesting. Before the storm, the wind vane pointed east. During the storm, it turned to the south, and the temperature fell by six degrees.","At the end of the month, the class made a bar chart of the rain. They sent it to the local newspaper, which printed it with a photo of the class."],"groups":[{"type":"tfng","items":[{"n":1,"q":"It rained every day in the first week.","a":"F","ev":[1,"The rain gauge was empty for five days."],"ex":"The passage says something different. The passage says: “The rain gauge was empty for five days.”","vi":"Bài nói khác với câu này. Trong bài: “The rain gauge was empty for five days.”","hint":"Look at paragraph 2."},{"n":2,"q":"The wind changed direction during the storm.","a":"T","ev":[2,"During the storm, it turned to the south, and the temperature fell by six degrees."],"ex":"The passage says the same thing in different words. The passage says: “During the storm, it turned to the south, and the temperature fell by six degrees.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “During the storm, it turned to the south, and the temperature fell by six degrees.”","hint":"Look at paragraph 3."},{"n":3,"q":"The storm damaged the weather station.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage describes the storm, but it does not say that anything was damaged.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài tả cơn bão nhưng không nói có gì bị hỏng.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"After the storm, the playground looked like a ___.","a":["lake"],"ev":[1,"The playground looked like a lake."],"ex":"Find it in the passage: “The playground looked like a lake.”","vi":"Tìm trong bài: “The playground looked like a lake.”","hint":"Look at paragraph 2."},{"n":5,"q":"The class sent their bar chart to the local ___.","a":["newspaper"],"ev":[3,"They sent it to the local newspaper, which printed it with a photo of the class."],"ex":"Find it in the passage: “They sent it to the local newspaper, which printed it with a photo of the class.”","vi":"Tìm trong bài: “They sent it to the local newspaper, which printed it with a photo of the class.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"A Race for Light","topic":"Science · Habitats","labeled":true,"paras":["Tropical rainforests cover only about six per cent of the Earth's land. However, more than half of the world's kinds of plants and animals live in them.","Life in a rainforest is a race for light. The tallest trees grow to 50 metres or more. In the canopy below, the leaves are so thick that rain can take ten minutes to reach the ground.","Under the canopy is the understory. It is shady and still. Young trees wait here for years. When an old tree falls and leaves a hole in the roof, they grow quickly towards the light. The plants here often have very large leaves, to catch as much light as they can.","Only about two per cent of the sunlight reaches the forest floor. Few plants can grow there. Dead leaves that fall to the ground disappear quickly, because insects and fungi break them down in the warm, wet air."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"v","ev":[1,"Life in a rainforest is a race for light."],"ex":"The whole of paragraph B is about this idea: “Tall trees and thick leaves”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Tall trees and thick leaves”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"ii","ev":[2,"Under the canopy is the understory."],"ex":"The whole of paragraph C is about this idea: “Waiting in the shade”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Waiting in the shade”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"i","ev":[3,"Only about two per cent of the sunlight reaches the forest floor."],"ex":"The whole of paragraph D is about this idea: “Life at the bottom”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Life at the bottom”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Life at the bottom"],["ii","Waiting in the shade"],["iii","How rain is measured"],["iv","Why trees fall in storms"],["v","Tall trees and thick leaves"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Why do plants in the understory often have very large leaves?","opts":["to hide from animals","to catch more light","to stay cool","to collect rain"],"a":"B","ev":[2,"The plants here often have very large leaves, to catch as much light as they can."],"ex":"The passage says: “The plants here often have very large leaves, to catch as much light as they can.”","vi":"Trong bài: “The plants here often have very large leaves, to catch as much light as they can.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"On the forest floor, dead leaves are broken down by insects and ___.","a":["fungi"],"ev":[3,"Dead leaves that fall to the ground disappear quickly, because insects and fungi break them down in the warm, wet air."],"ex":"Find it in the passage: “Dead leaves that fall to the ground disappear quickly, because insects and fungi break them down in the warm, wet air.”","vi":"Tìm trong bài: “Dead leaves that fall to the ground disappear quickly, because insects and fungi break them down in the warm, wet air.”","hint":"Look at paragraph D."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"A Piece of Grass","topic":"Talking about people","labeled":true,"paras":["As a child in England, Jane Goodall dreamed of living with animals in Africa. Her family had little money, so she could not go to university. She worked as a waitress to pay for a ticket to Kenya.","There she met a famous scientist, Louis Leakey. He needed someone patient to watch wild chimpanzees. In 1960, he sent Jane to Gombe, in Tanzania.","For months, the chimpanzees ran away from her. Then one old male, whom she called David Greybeard, let her come closer.","One day, Jane saw David push a long piece of grass into a termite nest. When he pulled it out, it was covered with insects, and he ate them. He was using a tool. At that time, scientists believed that only humans used tools.","Jane's discovery surprised the world. She stayed with the chimpanzees for many years and showed that they have feelings and families, as we do."],"groups":[{"type":"para","items":[{"n":11,"q":"how Jane paid for her journey","a":"A","ev":[0,"She worked as a waitress to pay for a ticket to Kenya."],"ex":"Paragraph A says: “She worked as a waitress to pay for a ticket to Kenya.”","vi":"Đoạn A viết: “She worked as a waitress to pay for a ticket to Kenya.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"the first chimpanzee that trusted Jane","a":"C","ev":[2,"Then one old male, whom she called David Greybeard, let her come closer."],"ex":"Paragraph C says: “Then one old male, whom she called David Greybeard, let her come closer.”","vi":"Đoạn C viết: “Then one old male, whom she called David Greybeard, let her come closer.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["grass"],"ev":[3,"One day, Jane saw David push a long piece of grass into a termite nest."],"ex":"Find it in the passage: “One day, Jane saw David push a long piece of grass into a termite nest.”","vi":"Tìm trong bài: “One day, Jane saw David push a long piece of grass into a termite nest.”","hint":"Look at paragraph D."},{"n":14,"a":["tool"],"ev":[3,"He was using a tool."],"ex":"Find it in the passage: “He was using a tool.”","vi":"Tìm trong bài: “He was using a tool.”","hint":"Look at paragraph D."}],"text":"David pushed a long piece of {13} into a termite nest to catch insects. He was using a {14}.","title":"A surprising discovery","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What did scientists believe before Jane's discovery?","opts":["Animals had no families.","Chimpanzees could talk.","Only humans used tools.","Chimpanzees ate only fruit."],"a":"C","ev":[3,"At that time, scientists believed that only humans used tools."],"ex":"The passage says: “At that time, scientists believed that only humans used tools.”","vi":"Trong bài: “At that time, scientists believed that only humans used tools.”","hint":"Look at paragraph D."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s8-exam","set":8,"kind":"exam","title":"Bộ 8 · Thi","minutes":20,"passages":[{"title":"Young Forecasters","topic":"Weather and climate","labeled":false,"paras":["For a whole school year, the pupils of Class 4A recorded the weather at nine o'clock every morning. By the end of May, their charts covered a classroom wall.","The numbers told a clear story. In the dry season, from November to April, almost no rain fell, and the garden had to be watered by hand. In May, the rain returned. That month alone had more rain than the six dry months together.","The class also tested an old saying: \"Red sky at night, the next day will be bright.\" For two months, they photographed the evening sky and compared it with the next day's weather. The saying was right about two times out of three.","Finally, the pupils tried to forecast. Each Friday, they guessed Monday's weather. Their guesses were often wrong. A real forecaster visited the class and explained why: she uses information from satellites and thousands of weather stations, not just one."],"groups":[{"type":"tfng","items":[{"n":1,"q":"May was wetter than the whole dry season.","a":"T","ev":[1,"That month alone had more rain than the six dry months together."],"ex":"The passage says the same thing in different words. The passage says: “That month alone had more rain than the six dry months together.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “That month alone had more rain than the six dry months together.”","hint":"Look at paragraph 2."},{"n":2,"q":"The old saying about a red sky was always correct.","a":"F","ev":[2,"The saying was right about two times out of three."],"ex":"The passage says something different. The passage says: “The saying was right about two times out of three.”","vi":"Bài nói khác với câu này. Trong bài: “The saying was right about two times out of three.”","hint":"Look at paragraph 3."},{"n":3,"q":"The forecaster invited the class to visit her office.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The forecaster visited the class. The passage does not say that she invited them anywhere.","vi":"Bài không nhắc tới điều này nên không thể biết. Cô dự báo viên đến thăm lớp. Bài không nói cô mời lớp đi đâu.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"In the dry season, the garden had to be watered by ___.","a":["hand"],"ev":[1,"In the dry season, from November to April, almost no rain fell, and the garden had to be watered by hand."],"ex":"Find it in the passage: “In the dry season, from November to April, almost no rain fell, and the garden had to be watered by hand.”","vi":"Tìm trong bài: “In the dry season, from November to April, almost no rain fell, and the garden had to be watered by hand.”","hint":"Look at paragraph 2."},{"n":5,"q":"A real forecaster uses information from ___ and thousands of weather stations.","a":["satellites"],"ev":[3,"A real forecaster visited the class and explained why: she uses information from satellites and thousands of weather stations, not just one."],"ex":"Find it in the passage: “A real forecaster visited the class and explained why: she uses information from satellites and thousands of weather stations, not just one.”","vi":"Tìm trong bài: “A real forecaster visited the class and explained why: she uses information from satellites and thousands of weather stations, not just one.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"The Forest That Makes Rain","topic":"Science · Habitats","labeled":true,"paras":["A tropical rainforest makes some of its own rain. Trees pull water from the ground and release it from their leaves as vapour. Above the Amazon, this vapour forms clouds, and the rain falls again on the forest. One large tree can put hundreds of litres of water into the air in a single day.","The forest is also a chemist's shop. About a quarter of modern medicines contain something that first came from rainforest plants. Scientists have tested only a small number of these plants, so many useful medicines may still be waiting.","Yet rainforests are disappearing. Trees are cut down for wood, and land is cleared for cattle and for crops such as soya and palm oil. Every minute, the world loses an area of forest as big as several football pitches.","Some people are trying to help. Some countries have made large national parks. Shoppers can choose wood and paper with a label showing that the trees were replaced. And in many places, local people now earn money by guiding visitors through the forest instead of cutting it down."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iv","ev":[1,"The forest is also a chemist's shop."],"ex":"The whole of paragraph B is about this idea: “Medicines from the forest”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Medicines from the forest”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iii","ev":[2,"Yet rainforests are disappearing."],"ex":"The whole of paragraph C is about this idea: “Why the forests are getting smaller”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Why the forests are getting smaller”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"ii","ev":[3,"Some people are trying to help."],"ex":"The whole of paragraph D is about this idea: “Ways to protect rainforests”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Ways to protect rainforests”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","The longest river in the Amazon"],["ii","Ways to protect rainforests"],["iii","Why the forests are getting smaller"],["iv","Medicines from the forest"],["v","How football pitches are measured"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"How does a rainforest make some of its own rain?","opts":["Leaves keep the rain for many days.","Clouds come from the sea.","Trees release water vapour that forms clouds.","Rivers flood the forest every day."],"a":"C","ev":[0,"Trees pull water from the ground and release it from their leaves as vapour."],"ex":"The passage says: “Trees pull water from the ground and release it from their leaves as vapour.”","vi":"Trong bài: “Trees pull water from the ground and release it from their leaves as vapour.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Land is cleared for ___ and for crops such as soya and palm oil.","a":["cattle"],"ev":[2,"Trees are cut down for wood, and land is cleared for cattle and for crops such as soya and palm oil."],"ex":"Find it in the passage: “Trees are cut down for wood, and land is cleared for cattle and for crops such as soya and palm oil.”","vi":"Tìm trong bài: “Trees are cut down for wood, and land is cleared for cattle and for crops such as soya and palm oil.”","hint":"Look at paragraph C."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"The Woman Who Watched","topic":"Talking about people","labeled":true,"paras":["When Jane Goodall arrived at Gombe in 1960, she had no degree and no training as a scientist. Some experts thought that sending a young secretary into the forest was a mistake.","Her lack of training was, in a way, an advantage. Scientists of that time gave animals numbers and tried not to have feelings about them. Jane gave the chimpanzees names and described their characters: brave, shy, clever or bad-tempered.","She also watched for longer than anyone before her. After months of patience, she saw chimpanzees making tools from grass and sticks to catch termites. Later she discovered that they hunt and eat meat, and that groups sometimes fight wars against each other. Chimpanzees were less gentle, and more like us, than people had believed.","Other scientists criticised her methods at first, but her careful notes, kept every day for years, changed their minds. Her study at Gombe has continued for more than sixty years, longer than any other study of wild animals.","In later life, Jane spent less time in the forest. She was shocked that the forests were disappearing, and she travelled around the world, about three hundred days a year, to ask people, especially children, to protect nature."],"groups":[{"type":"para","items":[{"n":11,"q":"a reason why some people doubted Jane at the beginning","a":"A","ev":[0,"When Jane Goodall arrived at Gombe in 1960, she had no degree and no training as a scientist."],"ex":"Paragraph A says: “When Jane Goodall arrived at Gombe in 1960, she had no degree and no training as a scientist.”","vi":"Đoạn A viết: “When Jane Goodall arrived at Gombe in 1960, she had no degree and no training as a scientist.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"discoveries that showed chimpanzees are not always gentle","a":"C","ev":[2,"Later she discovered that they hunt and eat meat, and that groups sometimes fight wars against each other."],"ex":"Paragraph C says: “Later she discovered that they hunt and eat meat, and that groups sometimes fight wars against each other.”","vi":"Đoạn C viết: “Later she discovered that they hunt and eat meat, and that groups sometimes fight wars against each other.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["numbers"],"ev":[1,"Scientists of that time gave animals numbers and tried not to have feelings about them."],"ex":"Find it in the passage: “Scientists of that time gave animals numbers and tried not to have feelings about them.”","vi":"Tìm trong bài: “Scientists of that time gave animals numbers and tried not to have feelings about them.”","hint":"Look at paragraph B."},{"n":14,"a":["notes"],"ev":[3,"Other scientists criticised her methods at first, but her careful notes, kept every day for years, changed their minds."],"ex":"Find it in the passage: “Other scientists criticised her methods at first, but her careful notes, kept every day for years, changed their minds.”","vi":"Tìm trong bài: “Other scientists criticised her methods at first, but her careful notes, kept every day for years, changed their minds.”","hint":"Look at paragraph D."}],"text":"Scientists of that time gave animals {13}, but Jane gave them names. Her careful {14}, kept every day for years, changed the minds of other scientists.","title":"Jane's method","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Why did Jane travel so much in later life?","opts":["to find new chimpanzees","to ask people to protect nature","to visit other scientists","to study at universities"],"a":"B","ev":[4,"She was shocked that the forests were disappearing, and she travelled around the world, about three hundred days a year, to ask people, especially children, to protect nature."],"ex":"The passage says: “She was shocked that the forests were disappearing, and she travelled around the world, about three hundred days a year, to ask people, especially children, to protect nature.”","vi":"Trong bài: “She was shocked that the forests were disappearing, and she travelled around the world, about three hundred days a year, to ask people, especially children, to protect nature.”","hint":"Look at paragraph E."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s9-try","set":9,"kind":"try","title":"Bộ 9 · Thử","minutes":20,"passages":[{"title":"Living in Space","topic":"Planet Earth","labeled":false,"paras":["The International Space Station is a big home in space. It flies around the Earth, about 400 kilometres above the ground. Six or seven astronauts usually live there.","In space, everything floats. The astronauts float, and so do their food and their pens. They cannot walk, so they push themselves along with their hands.","Sleeping is strange. There is no up or down. The astronauts sleep in sleeping bags that are tied to the wall.","Astronauts cannot have a shower, because the water would float away. They wash with a wet towel.","From the window, they can see the blue Earth. Many astronauts say this is the best part of the job."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Things float inside the space station.","a":"T","ev":[1,"In space, everything floats."],"ex":"The passage says the same thing in different words. The passage says: “In space, everything floats.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “In space, everything floats.”","hint":"Look at paragraph 2."},{"n":2,"q":"Astronauts have a shower every day.","a":"F","ev":[3,"Astronauts cannot have a shower, because the water would float away."],"ex":"The passage says something different. The passage says: “Astronauts cannot have a shower, because the water would float away.”","vi":"Bài nói khác với câu này. Trong bài: “Astronauts cannot have a shower, because the water would float away.”","hint":"Look at paragraph 4."},{"n":3,"q":"Astronauts feel cold on the space station.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not say anything about the temperature.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nói gì về nhiệt độ trên trạm.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The astronauts sleep in sleeping bags that are tied to the ___.","a":["wall"],"ev":[2,"The astronauts sleep in sleeping bags that are tied to the wall."],"ex":"Find it in the passage: “The astronauts sleep in sleeping bags that are tied to the wall.”","vi":"Tìm trong bài: “The astronauts sleep in sleeping bags that are tied to the wall.”","hint":"Look at paragraph 3."},{"n":5,"q":"Astronauts wash with a wet ___.","a":["towel"],"ev":[3,"They wash with a wet towel."],"ex":"Find it in the passage: “They wash with a wet towel.”","vi":"Tìm trong bài: “They wash with a wet towel.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Earth, Sun and Moon","topic":"Science · Earth and space","labeled":true,"paras":["The Earth is a planet. It is round, like a ball. It moves around the Sun, and the journey takes one year.","The Earth also spins. It turns round once every 24 hours. When your part of the Earth faces the Sun, it is day. When it turns away from the Sun, it is night.","The Sun is a star. It is much bigger than the Earth. It looks small because it is very far away. It gives us light and heat.","The Moon moves around the Earth. It has no light of its own. We can see it because the light of the Sun shines on it."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"ii","ev":[1,"The Earth also spins."],"ex":"The whole of paragraph B is about this idea: “Why we have day and night”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Why we have day and night”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iv","ev":[2,"The Sun is a star."],"ex":"The whole of paragraph C is about this idea: “Facts about the Sun”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Facts about the Sun”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"i","ev":[3,"The Moon moves around the Earth."],"ex":"The whole of paragraph D is about this idea: “Why we can see the Moon”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Why we can see the Moon”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Why we can see the Moon"],["ii","Why we have day and night"],["iii","How many planets there are"],["iv","Facts about the Sun"],["v","Why stars have colours"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"How long does the Earth take to go around the Sun?","opts":["24 hours","one day","one month","one year"],"a":"D","ev":[0,"It moves around the Sun, and the journey takes one year."],"ex":"The passage says: “It moves around the Sun, and the journey takes one year.”","vi":"Trong bài: “It moves around the Sun, and the journey takes one year.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"The Sun is not a planet. It is a ___.","a":["star"],"ev":[2,"The Sun is a star."],"ex":"Find it in the passage: “The Sun is a star.”","vi":"Tìm trong bài: “The Sun is a star.”","hint":"Look at paragraph C."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"The First Moon Walk","topic":"Talking about people","labeled":true,"paras":["In July 1969, three astronauts flew to the Moon. Their names were Neil Armstrong, Buzz Aldrin and Michael Collins. The journey took four days.","Armstrong and Aldrin landed on the Moon in a small spacecraft called the Eagle. Collins did not land. He stayed in the big spacecraft and flew around the Moon.","Neil Armstrong was the first person to walk on the Moon. Buzz Aldrin came out a few minutes later. They walked and jumped on the grey dust. They collected rocks to take home.","On Earth, hundreds of millions of people watched them on television. After that, the three astronauts flew home safely and landed in the sea."],"groups":[{"type":"para","items":[{"n":11,"q":"the astronaut who did not walk on the Moon","a":"B","ev":[1,"Collins did not land."],"ex":"Paragraph B says: “Collins did not land.”","vi":"Đoạn B viết: “Collins did not land.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"how people on Earth saw the Moon walk","a":"D","ev":[3,"On Earth, hundreds of millions of people watched them on television."],"ex":"Paragraph D says: “On Earth, hundreds of millions of people watched them on television.”","vi":"Đoạn D viết: “On Earth, hundreds of millions of people watched them on television.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["armstrong"],"ev":[2,"Neil Armstrong was the first person to walk on the Moon."],"ex":"Find it in the passage: “Neil Armstrong was the first person to walk on the Moon.”","vi":"Tìm trong bài: “Neil Armstrong was the first person to walk on the Moon.”","hint":"Look at paragraph C."},{"n":14,"a":["rocks"],"ev":[2,"They collected rocks to take home."],"ex":"Find it in the passage: “They collected rocks to take home.”","vi":"Tìm trong bài: “They collected rocks to take home.”","hint":"Look at paragraph C."}],"text":"Neil {13} was the first person to walk on the Moon. The astronauts collected {14} to take home.","title":"On the Moon","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What was the Eagle?","opts":["an astronaut","a small spacecraft","a television programme","a rock from the Moon"],"a":"B","ev":[1,"Armstrong and Aldrin landed on the Moon in a small spacecraft called the Eagle."],"ex":"The passage says: “Armstrong and Aldrin landed on the Moon in a small spacecraft called the Eagle.”","vi":"Trong bài: “Armstrong and Aldrin landed on the Moon in a small spacecraft called the Eagle.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s9-practice","set":9,"kind":"practice","title":"Bộ 9 · Luyện tập","minutes":20,"passages":[{"title":"A Day on the Space Station","topic":"Planet Earth","labeled":false,"paras":["An astronaut's day begins at six o'clock with a message from Earth. Breakfast comes in small bags: there are no plates, because food would float away. Even salt and pepper are liquids, so that they do not fly into the astronauts' eyes.","Most of the day is work. Astronauts do science experiments, repair machines and clean their home.","They also exercise for two hours every day. On Earth, your muscles and bones work all the time against gravity. In space, they have nothing to do and quickly become weak. So astronauts run on a machine, wearing straps that hold them down.","The station travels so fast that it goes around the Earth every ninety minutes. This means the crew sees sixteen sunrises every day."],"groups":[{"type":"tfng","items":[{"n":1,"q":"The salt on the space station is not a powder.","a":"T","ev":[0,"Even salt and pepper are liquids, so that they do not fly into the astronauts' eyes."],"ex":"The passage says the same thing in different words. The passage says: “Even salt and pepper are liquids, so that they do not fly into the astronauts' eyes.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “Even salt and pepper are liquids, so that they do not fly into the astronauts' eyes.”","hint":"Look at paragraph 1."},{"n":2,"q":"In space, muscles stay strong without exercise.","a":"F","ev":[2,"In space, they have nothing to do and quickly become weak."],"ex":"The passage says something different. The passage says: “In space, they have nothing to do and quickly become weak.”","vi":"Bài nói khác với câu này. Trong bài: “In space, they have nothing to do and quickly become weak.”","hint":"Look at paragraph 3."},{"n":3,"q":"Astronauts choose their own food before the trip.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage describes the food, but not who chooses it.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài tả đồ ăn, nhưng không nói ai chọn món.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"When astronauts run on the machine, they wear ___ that hold them down.","a":["straps"],"ev":[2,"So astronauts run on a machine, wearing straps that hold them down."],"ex":"Find it in the passage: “So astronauts run on a machine, wearing straps that hold them down.”","vi":"Tìm trong bài: “So astronauts run on a machine, wearing straps that hold them down.”","hint":"Look at paragraph 3."},{"n":5,"q":"The crew sees sixteen ___ every day.","a":["sunrises"],"ev":[3,"This means the crew sees sixteen sunrises every day."],"ex":"Find it in the passage: “This means the crew sees sixteen sunrises every day.”","vi":"Tìm trong bài: “This means the crew sees sixteen sunrises every day.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"The Spinning Earth","topic":"Science · Earth and space","labeled":true,"paras":["Every morning the Sun rises in the east, and every evening it sets in the west. It looks as if the Sun is moving. In fact, the Sun stays still, and the Earth is spinning.","While it is midday in Vietnam, it is night in Mexico. That is because the Earth is a ball, and the Sun can only light one half of it at a time.","The Moon goes around the Earth about once a month. Like the Earth, it is always half in sunlight. But from the Earth, we cannot always see all of the bright half. Sometimes we see a full circle, and sometimes only a thin curve.","Long ago, people used the Moon as a calendar. They counted the days from one full moon to the next. The word \"month\" comes from the word \"moon\"."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iii","ev":[1,"While it is midday in Vietnam, it is night in Mexico."],"ex":"The whole of paragraph B is about this idea: “Different times in different places”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Different times in different places”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"ii","ev":[2,"The Moon goes around the Earth about once a month."],"ex":"The whole of paragraph C is about this idea: “The changing shape of the Moon”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “The changing shape of the Moon”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"Long ago, people used the Moon as a calendar."],"ex":"The whole of paragraph D is about this idea: “Measuring time with the Moon”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Measuring time with the Moon”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","How to travel to Mexico"],["ii","The changing shape of the Moon"],["iii","Different times in different places"],["iv","Why the Sun is yellow"],["v","Measuring time with the Moon"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Why does the Sun seem to move across the sky?","opts":["because the Moon pushes it","because the Sun goes around the Earth","because the Earth is spinning","because the wind moves the clouds"],"a":"C","ev":[0,"In fact, the Sun stays still, and the Earth is spinning."],"ex":"The passage says: “In fact, the Sun stays still, and the Earth is spinning.”","vi":"Trong bài: “In fact, the Sun stays still, and the Earth is spinning.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Long ago, people used the Moon as a ___.","a":["calendar"],"ev":[3,"Long ago, people used the Moon as a calendar."],"ex":"Find it in the passage: “Long ago, people used the Moon as a calendar.”","vi":"Tìm trong bài: “Long ago, people used the Moon as a calendar.”","hint":"Look at paragraph D."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Landing the Eagle","topic":"Talking about people","labeled":true,"paras":["On 16 July 1969, a rocket as tall as a building of 36 floors left Florida. Inside were three men on their way to the Moon.","Four days later, Neil Armstrong and Buzz Aldrin flew down to the Moon in the Eagle. The landing was dangerous. The computer was taking them towards a field of big rocks, so Armstrong took control and flew the Eagle himself. When he landed, there was fuel for less than a minute.","Armstrong climbed down the ladder first. As his boot touched the dust, he spoke his famous words about one small step.","The two men stayed outside for about two and a half hours. They put up a flag, took photographs and collected more than 20 kilograms of rock.","Meanwhile, Michael Collins waited alone in the main spacecraft. Each time he flew behind the Moon, he could not talk to anyone by radio. Some people have called him the loneliest man in history, but he said he was not lonely at all."],"groups":[{"type":"para","items":[{"n":11,"q":"a problem during the landing","a":"B","ev":[1,"The landing was dangerous."],"ex":"Paragraph B says: “The landing was dangerous.”","vi":"Đoạn B viết: “The landing was dangerous.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"how one astronaut felt about being alone","a":"E","ev":[4,"Some people have called him the loneliest man in history, but he said he was not lonely at all."],"ex":"Paragraph E says: “Some people have called him the loneliest man in history, but he said he was not lonely at all.”","vi":"Đoạn E viết: “Some people have called him the loneliest man in history, but he said he was not lonely at all.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["flag"],"ev":[3,"They put up a flag, took photographs and collected more than 20 kilograms of rock."],"ex":"Find it in the passage: “They put up a flag, took photographs and collected more than 20 kilograms of rock.”","vi":"Tìm trong bài: “They put up a flag, took photographs and collected more than 20 kilograms of rock.”","hint":"Look at paragraph D."},{"n":14,"a":["rock"],"ev":[3,"They put up a flag, took photographs and collected more than 20 kilograms of rock."],"ex":"Find it in the passage: “They put up a flag, took photographs and collected more than 20 kilograms of rock.”","vi":"Tìm trong bài: “They put up a flag, took photographs and collected more than 20 kilograms of rock.”","hint":"Look at paragraph D."}],"text":"The two men put up a {13} and took photographs. They also collected more than 20 kilograms of {14}.","title":"Two and a half hours","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Why did Armstrong fly the Eagle himself?","opts":["Aldrin was ill.","The computer was heading for big rocks.","There was too much fuel.","The computer was broken."],"a":"B","ev":[1,"The computer was taking them towards a field of big rocks, so Armstrong took control and flew the Eagle himself."],"ex":"The passage says: “The computer was taking them towards a field of big rocks, so Armstrong took control and flew the Eagle himself.”","vi":"Trong bài: “The computer was taking them towards a field of big rocks, so Armstrong took control and flew the Eagle himself.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s9-exam","set":9,"kind":"exam","title":"Bộ 9 · Thi","minutes":20,"passages":[{"title":"Home, 400 Kilometres Up","topic":"Planet Earth","labeled":false,"paras":["The International Space Station is the largest object that humans have ever put into space. It is about as big as a football pitch, and it was built piece by piece between 1998 and 2011. People have lived on it without a break since November 2000.","Nothing is wasted on board. Water is too heavy to bring from Earth in large amounts, so the station recycles it. Machines collect the astronauts' sweat, their breath and even their urine and clean it until it is purer than most tap water.","Life without gravity changes the body. Astronauts grow up to five centimetres taller because their backs stretch. Their faces look round, as liquid moves up to the head. Without daily exercise, they would lose muscle and bone.","Coming home is not easy either. After six months in space, many astronauts cannot walk without help for the first few hours. Some say they kept dropping cups at home, because they expected them to float."],"groups":[{"type":"tfng","items":[{"n":1,"q":"The space station was sent into space in one piece.","a":"F","ev":[0,"It is about as big as a football pitch, and it was built piece by piece between 1998 and 2011."],"ex":"The passage says something different. The passage says: “It is about as big as a football pitch, and it was built piece by piece between 1998 and 2011.”","vi":"Bài nói khác với câu này. Trong bài: “It is about as big as a football pitch, and it was built piece by piece between 1998 and 2011.”","hint":"Look at paragraph 1."},{"n"
