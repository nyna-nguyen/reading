<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xuxu IELTS Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fredoka:wght@500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2740;--mut:#6b7488;--bg:#f5f2ea;--card:#fffdf8;--line:#e2dccd;--acc:#0e7c86;--acc2:#e6f3f3;--coin:#e09b00;--ok:#1f8a4c;--okbg:#e4f5ea;--bad:#c8402f;--badbg:#fbe9e5;--hl:#ffe680;--ev:#b9ecd0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Fredoka,"Be Vietnam Pro",sans-serif;font-weight:600;margin:0}
/* top bar */
#top{flex:none;background:var(--ink);color:#fff;padding:6px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#top .brand{font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;white-space:nowrap}
#top .brand small{font-family:"Be Vietnam Pro",sans-serif;font-weight:400;opacity:.7;font-size:12px;margin-left:6px}
#top .sp{flex:1}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;color:#fff;opacity:.45;padding:5px 12px;border-radius:999px;font-weight:600;font-size:14px}
.tab.on{opacity:1;background:rgba(255,255,255,.16)}
.coin{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.coin i{font-style:normal;color:var(--coin)}
.tbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:5px 11px;font-weight:600;font-size:14px;white-space:nowrap}
.tbtn.pri{background:#ffc93c;color:var(--ink)}
.tbtn.on{background:#fff;color:var(--ink)}
.tbtn.dim{opacity:.5}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:64px;text-align:center;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:8px}
.timer.over{background:var(--bad)}
.only-m{display:none}
#app{flex:1;min-height:0;overflow:auto}
/* home */
.wrap{max-width:860px;margin:0 auto;padding:16px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.tcard .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tcard h2{font-size:22px}
.meta{color:var(--mut);font-size:14px}
.plist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.plist li{display:flex;gap:10px;align-items:baseline;padding:8px 12px;background:var(--bg);border-radius:10px}
.plist b{font-family:Fredoka,sans-serif;color:var(--acc);white-space:nowrap}
.plist span{color:var(--mut);font-size:13px;margin-left:auto;white-space:nowrap}
.big{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:700}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.status{font-weight:600;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--acc2);color:var(--acc)}
.note{color:var(--mut);font-size:14px;margin:4px 2px 14px}
.tcard .head h2{white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tbox{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tbox b{font-family:Fredoka,sans-serif;font-size:17px;color:var(--acc)}
.tbox span{font-size:13px;color:var(--mut);font-weight:600}
.tbox.prog{border-color:var(--coin)}
.tbox.fin{background:var(--okbg);border-color:var(--ok)}
.tbox.fin b,.tbox.fin span{color:var(--ok)}
.hb{margin-top:8px;background:#fff6d6;border:1.5px solid #e8c93a;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600}
.hint{margin-top:8px;background:#fff6d6;border-radius:8px;padding:5px 10px;font-size:14px}
.hrow{display:flex;gap:6px;align-items:center;margin-top:6px}.hrow .hb,.hrow .hint{margin-top:0}
.dlg select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;margin-top:6px;background:#fff}
/* exam */
.exam{height:100%;display:flex;flex-direction:column;min-height:0}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
.pane{overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 40px;min-height:0}
.pane.pp{background:var(--card);border-right:1px solid var(--line)}
.ptools{display:flex;gap:8px;align-items:center;margin-bottom:8px;position:sticky;top:-14px;background:var(--card);padding:8px 0;z-index:2}
.ptools .ghost{padding:4px 10px;font-size:13px;white-space:nowrap}
.ptools .mk{background:var(--hl);border-color:#e8c93a}
.ptools small{color:var(--mut)}
.pp h2{font-size:22px;margin-bottom:2px}
.pp .sub{color:var(--mut);font-size:14px;margin-bottom:10px}
.para{font-family:Literata,Georgia,serif;font-size:17.5px;line-height:1.7;margin:0 0 14px;display:flex;gap:10px}
.para .lab{font-family:Fredoka,sans-serif;font-weight:600;color:var(--acc);flex:none;width:18px}
.hl{background:var(--hl);border-radius:2px;cursor:pointer}
.ev{background:var(--ev);box-shadow:0 0 0 2px var(--ev);border-radius:2px}
.grp{margin-bottom:22px}
.instr{background:var(--acc2);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-bottom:10px}
.instr b.r{font-family:Fredoka,sans-serif;display:block;font-size:16px;margin-bottom:2px}
.hlist{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px}
.hlist li{display:flex;gap:8px;padding:2px 0}
.hlist li b{width:26px;flex:none;text-align:right}
.q{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);scroll-margin-top:10px}
.qn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.q.ok .qn{background:var(--ok)}.q.bad .qn{background:var(--bad)}
.qb{flex:1;min-width:0}
.qt{margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.opt{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:6px 12px;font-weight:600;font-size:14px}
.seg button.on,.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opts{display:grid;gap:6px}
.opt{text-align:left;font-weight:500;display:flex;gap:8px}
.opt b{flex:none}
.opt.right,.seg button.right{outline:2.5px solid var(--ok);outline-offset:1px}
button:disabled{cursor:default;opacity:1}
.q.lock .seg button:not(.on):not(.right),.q.lock .opt:not(.on):not(.right){opacity:.5}
.gap{border:0;border-bottom:2px solid var(--ink);background:var(--card);width:130px;padding:2px 6px;font-weight:600;text-align:center;border-radius:4px 4px 0 0}
.gap.ok{border-color:var(--ok);background:var(--okbg)}.gap.bad{border-color:var(--bad);background:var(--badbg)}
.gap:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
select.sel{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;font-weight:600;min-width:90px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:2.2}
.sum h3{font-size:16px;line-height:1.4;margin-bottom:4px}
.sum .sn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;margin-right:4px}
.mark{display:inline-block;font-weight:700;font-size:13px;padding:2px 9px;border-radius:999px;margin-top:8px}
.mark.ok{background:var(--okbg);color:var(--ok)}.mark.bad{background:var(--badbg);color:var(--bad)}
.exp{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14.5px}
.exp .ans{font-weight:700;color:var(--ok)}
.exp .row{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.lang-stack{display:grid;flex:1;min-width:0}
.lang-stack>*{grid-area:1/1}
.lang-stack>.off{visibility:hidden}
.lt{flex:none;width:38px;border:1.5px solid var(--line);background:var(--bg);border-radius:7px;font-size:12px;font-weight:700;padding:2px 0}
.evb{margin-top:6px;background:var(--ev);border:0;border-radius:7px;padding:3px 10px;font-size:13px;font-weight:600}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:14px;background:var(--card);border:2px solid var(--acc)}
.banner h3{font-size:19px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.foot{flex:none;background:var(--card);border-top:1px solid var(--line);padding:6px 10px;display:flex;gap:4px;overflow-x:auto;align-items:center}
.foot .pl{font-size:12px;font-weight:700;color:var(--mut);margin:0 4px 0 8px;white-space:nowrap}
.chip{flex:none;width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:700;padding:0}
.chip.dim{opacity:.45}
.chip.a{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad{background:var(--bad);border-color:var(--bad);color:#fff}
/* tips */
.tip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.tip h3{font-size:17px;margin-bottom:4px}
.tip ol{margin:0;padding-left:20px}
/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(20,26,45,.55);display:none;place-items:center;z-index:50;padding:16px}
#modal.on{display:grid}
.dlg{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%}
.dlg h3{font-size:20px;margin-bottom:8px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.dlg table{width:100%;border-collapse:collapse;margin:6px 0 12px}
.dlg td{padding:5px 0;border-bottom:1px solid var(--line)}
.dlg td:last-child{text-align:right;font-weight:700}
.dlg input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;margin-top:6px;background:#fff}
.dlg label{font-size:13px;font-weight:600;color:var(--mut);display:block;margin-top:8px}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (max-width:699px){
  .only-m{display:inline-flex}
  .split{grid-template-columns:1fr}
  body.show-q .pane.pp{display:none}
  body.show-p .pane.qq{display:none}
  .pane{padding:12px 14px 40px}
  #top .brand small,#top .brand.ex,.tbtn .lg,.ptools small{display:none}
  .tbox b{font-size:14.5px;white-space:nowrap}.tbox{padding:8px}.tbox span{font-size:12px}#top .brand{font-size:16px}
  #top{gap:6px;padding:6px 8px}.tbtn{padding:5px 9px}.timer{min-width:54px}
  .para{font-size:17px}
}
</style>
</head>

<script>
(function(){
"use strict";
/* ===================== CONTENT ===================== */
var TFNG_INSTR='Do the following statements agree with the information in the passage? Choose<br><b>TRUE</b> if the statement agrees with the information,<br><b>FALSE</b> if the statement contradicts the information,<br><b>NOT GIVEN</b> if there is no information on this.';
var SETS=[{"n":1,"theme":"Gardens, shadows and caves","tests":["s1-try","s1-practice","s1-exam"]},{"n":2,"theme":"Sleep, bones and Braille","tests":["s2-try","s2-practice","s2-exam"]},{"n":3,"theme":"Full moon, water and Venice","tests":["s3-try","s3-practice","s3-exam"]},{"n":4,"theme":"Guide dogs, food chains and penguins","tests":["s4-try","s4-practice","s4-exam"]},{"n":5,"theme":"Earthquakes, volcanoes and Pompeii","tests":["s5-try","s5-practice","s5-exam"]},{"n":6,"theme":"Windmills, circuits and lighthouses","tests":["s6-try","s6-practice","s6-exam"]},{"n":7,"theme":"Plastic, materials and paper","tests":["s7-try","s7-practice","s7-exam"]},{"n":8,"theme":"Weather, rainforests and chimpanzees","tests":["s8-try","s8-practice","s8-exam"]},{"n":9,"theme":"Space, the Earth and the Moon","tests":["s9-try","s9-practice","s9-exam"]},{"n":10,"theme":"Fables, sound and pyramids","tests":["s10-try","s10-practice","s10-exam"]}];
var TESTS=[{"id":"s1-try","set":1,"kind":"try","title":"Bộ 1 · Thử","minutes":20,"passages":[{"title":"Our School Garden","topic":"Food and health","labeled":false,"paras":["Hillside Primary School has a vegetable garden behind the main building. Three years ago, this place was an old car park that nobody used.","The idea came from a pupil called Minh. He asked, \"Why can't we grow our own lunch?\" The head teacher liked his idea very much.","Parents and teachers worked together in the summer holiday. They removed the hard ground and brought in fresh soil.","Now every class looks after one part of the garden. The children water the plants before lessons start. On Fridays, they pick the vegetables and carry them to the kitchen.","The school cook is happy. She says children eat more vegetables when they grow them with their own hands."],"groups":[{"type":"tfng","items":[{"n":1,"q":"The garden is behind the main school building.","a":"T","ev":[0,"Hillside Primary School has a vegetable garden behind the main building."],"ex":"The passage says the same thing in different words. The passage says: “Hillside Primary School has a vegetable garden behind the main building.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “Hillside Primary School has a vegetable garden behind the main building.”","hint":"Look at paragraph 1."},{"n":2,"q":"A teacher had the idea for the garden.","a":"F","ev":[1,"The idea came from a pupil called Minh."],"ex":"The passage says something different. The passage says: “The idea came from a pupil called Minh.”","vi":"Bài nói khác với câu này. Trong bài: “The idea came from a pupil called Minh.”","hint":"Look at paragraph 2."},{"n":3,"q":"Minh is in the oldest class in the school.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. We know Minh is a pupil, but not which class he is in.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài chỉ nói Minh là học sinh, không nói bạn học lớp nào.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The children water the plants before ___ start.","a":["lessons"],"ev":[3,"The children water the plants before lessons start."],"ex":"Find it in the passage: “The children water the plants before lessons start.”","vi":"Tìm trong bài: “The children water the plants before lessons start.”","hint":"Look at paragraph 4."},{"n":5,"q":"On Fridays, the children carry the vegetables to the ___.","a":["kitchen"],"ev":[3,"On Fridays, they pick the vegetables and carry them to the kitchen."],"ex":"Find it in the passage: “On Fridays, they pick the vegetables and carry them to the kitchen.”","vi":"Tìm trong bài: “On Fridays, they pick the vegetables and carry them to the kitchen.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"How Shadows Work","topic":"Science · Light and shadows","labeled":true,"paras":["Long ago, people had no clocks. To know the time, they looked at the Sun and at the shadows on the ground.","A shadow forms when an object blocks light. Light travels in straight lines, so it cannot go around a tree or a person. The dark shape behind the object is its shadow.","Shadows change during the day. In the morning, the Sun is low and shadows are long. At midday, the Sun is high and shadows are short.","The ancient Egyptians used shadows to make the first shadow clocks. Later, people made sundials. A sundial has a stick, and the shadow of the stick points to the time."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"ii","ev":[1,"A shadow forms when an object blocks light."],"ex":"The whole of paragraph B is about this idea: “How a shadow is made”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “How a shadow is made”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iii","ev":[2,"Shadows change during the day."],"ex":"The whole of paragraph C is about this idea: “Why shadows are long or short”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Why shadows are long or short”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"The ancient Egyptians used shadows to make the first shadow clocks."],"ex":"The whole of paragraph D is about this idea: “Clocks that use shadows”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Clocks that use shadows”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Why the Sun is hot"],["ii","How a shadow is made"],["iii","Why shadows are long or short"],["iv","How to make a clock at home"],["v","Clocks that use shadows"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"When are shadows short?","opts":["at night","at midday","in the morning","in the evening"],"a":"B","ev":[2,"At midday, the Sun is high and shadows are short."],"ex":"The passage says: “At midday, the Sun is high and shadows are short.”","vi":"Trong bài: “At midday, the Sun is high and shadows are short.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Light travels in ___ lines.","a":["straight"],"ev":[1,"Light travels in straight lines, so it cannot go around a tree or a person."],"ex":"Find it in the passage: “Light travels in straight lines, so it cannot go around a tree or a person.”","vi":"Tìm trong bài: “Light travels in straight lines, so it cannot go around a tree or a person.”","hint":"Look at paragraph B."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"A Very Big Cave","topic":"Vietnam · Nature","labeled":true,"paras":["In 1990, a farmer named Ho Khanh was walking in the jungle in Quang Binh, Vietnam. It started to rain, so he looked for a dry place. He found a huge hole in a cliff.","He heard a river inside the hole, and a strong wind came out. He was afraid, so he did not go in. Later, he could not find the hole again.","In 2009, Ho Khanh showed the cave to a team of British explorers. They named it Son Doong. It is the largest known cave in the world. In some places, the roof is 200 metres high.","The mountains here are made of limestone. Water can slowly dissolve this rock. For millions of years, an underground river cut a long tunnel through the stone."],"groups":[{"type":"para","items":[{"n":11,"q":"the reason why Ho Khanh did not enter the cave","a":"B","ev":[1,"He was afraid, so he did not go in."],"ex":"Paragraph B says: “He was afraid, so he did not go in.”","vi":"Đoạn B viết: “He was afraid, so he did not go in.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"the height of the cave","a":"C","ev":[2,"In some places, the roof is 200 metres high."],"ex":"Paragraph C says: “In some places, the roof is 200 metres high.”","vi":"Đoạn C viết: “In some places, the roof is 200 metres high.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["limestone"],"ev":[3,"The mountains here are made of limestone."],"ex":"Find it in the passage: “The mountains here are made of limestone.”","vi":"Tìm trong bài: “The mountains here are made of limestone.”","hint":"Look at paragraph D."},{"n":14,"a":["river"],"ev":[3,"For millions of years, an underground river cut a long tunnel through the stone."],"ex":"Find it in the passage: “For millions of years, an underground river cut a long tunnel through the stone.”","vi":"Tìm trong bài: “For millions of years, an underground river cut a long tunnel through the stone.”","hint":"Look at paragraph D."}],"text":"The mountains are made of {13}. For millions of years, an underground {14} cut a tunnel through the rock.","title":"How the cave was made","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Why did Ho Khanh look for a dry place?","opts":["It was getting dark.","It started to rain.","He was hungry.","He was tired."],"a":"B","ev":[0,"It started to rain, so he looked for a dry place."],"ex":"The passage says: “It started to rain, so he looked for a dry place.”","vi":"Trong bài: “It started to rain, so he looked for a dry place.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s1-practice","set":1,"kind":"practice","title":"Bộ 1 · Luyện tập","minutes":20,"passages":[{"title":"The Snail Problem","topic":"Food and health","labeled":false,"paras":["The pupils at Hillside Primary School grow their own vegetables. The youngest pupils grow lettuce and radishes because these plants grow quickly. Older pupils grow tomatoes and pumpkins, which need more time.","In the first spring, there was a big problem. Snails ate nearly all the lettuce. Some pupils wanted to stop, but their teacher told them to look for an answer.","The pupils did not want to use chemicals. They went to the library and read about snails. They learned that some birds eat snails.","So the children built six small bird houses around the garden. Soon birds came to live there. By the next year, the snail problem was much smaller.","Every month, the pupils sell extra vegetables to parents. They use the money to buy seeds."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Lettuce is a plant that grows fast.","a":"T","ev":[0,"The youngest pupils grow lettuce and radishes because these plants grow quickly."],"ex":"The passage says the same thing in different words. The passage says: “The youngest pupils grow lettuce and radishes because these plants grow quickly.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “The youngest pupils grow lettuce and radishes because these plants grow quickly.”","hint":"Look at paragraph 1."},{"n":2,"q":"The pupils used chemicals to stop the snails.","a":"F","ev":[2,"The pupils did not want to use chemicals."],"ex":"The passage says something different. The passage says: “The pupils did not want to use chemicals.”","vi":"Bài nói khác với câu này. Trong bài: “The pupils did not want to use chemicals.”","hint":"Look at paragraph 3."},{"n":3,"q":"The birds also ate some of the vegetables.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage only says that birds came to live there. It does not say what else they ate.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài chỉ nói chim đến ở, không nói chim có ăn rau hay không.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The pupils read about snails in the ___.","a":["library"],"ev":[2,"They went to the library and read about snails."],"ex":"Find it in the passage: “They went to the library and read about snails.”","vi":"Tìm trong bài: “They went to the library and read about snails.”","hint":"Look at paragraph 3."},{"n":5,"q":"The children built ___ bird houses around the garden.","a":["six"],"ev":[3,"So the children built six small bird houses around the garden."],"ex":"Find it in the passage: “So the children built six small bird houses around the garden.”","vi":"Tìm trong bài: “So the children built six small bird houses around the garden.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"The Sun Clock","topic":"Science · Light and shadows","labeled":true,"paras":["A shadow forms when an object blocks light. Because light travels in straight lines, it cannot bend around the object. In the morning and evening shadows are long, and at midday they are at their shortest.","More than 3,000 years ago, the ancient Egyptians used this idea to tell the time. They built tall stone columns called obelisks. People watched the shadow of the obelisk move and divided the day into parts.","Later, the Greeks and Romans made sundials. A sundial has a flat plate with numbers on it. It also has a stick called a gnomon. The shadow of the gnomon falls on the numbers and shows the time.","Sundials had problems. They were useless at night and on cloudy days. So people invented water clocks, which measured time with dripping water."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"i","ev":[1,"More than 3,000 years ago, the ancient Egyptians used this idea to tell the time."],"ex":"The whole of paragraph B is about this idea: “Egyptian shadow clocks”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Egyptian shadow clocks”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iv","ev":[2,"Later, the Greeks and Romans made sundials."],"ex":"The whole of paragraph C is about this idea: “The parts of a sundial”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “The parts of a sundial”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"iii","ev":[3,"Sundials had problems."],"ex":"The whole of paragraph D is about this idea: “When sundials did not work”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “When sundials did not work”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Egyptian shadow clocks"],["ii","How water clocks were made"],["iii","When sundials did not work"],["iv","The parts of a sundial"],["v","Greek and Roman numbers"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What is an obelisk?","opts":["a flat plate with numbers","a stick on a sundial","a tall stone column","a kind of water clock"],"a":"C","ev":[1,"They built tall stone columns called obelisks."],"ex":"The passage says: “They built tall stone columns called obelisks.”","vi":"Trong bài: “They built tall stone columns called obelisks.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"The stick on a sundial is called a ___.","a":["gnomon"],"ev":[2,"The shadow of the gnomon falls on the numbers and shows the time."],"ex":"Find it in the passage: “The shadow of the gnomon falls on the numbers and shows the time.”","vi":"Tìm trong bài: “The shadow of the gnomon falls on the numbers and shows the time.”","hint":"Look at paragraph C."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Inside Son Doong","topic":"Vietnam · Nature","labeled":true,"paras":["Son Doong Cave is in Quang Binh Province in central Vietnam. A farmer named Ho Khanh found it in 1990, but he could not find the entrance again for almost twenty years.","In 2009, he led a team of British explorers to the cave. They measured it and were very surprised. The main passage is more than five kilometres long. In some places, the roof is 200 metres above the floor.","The cave formed in limestone. This kind of rock slowly dissolves in water. For millions of years, an underground river has been cutting through the stone.","In two places, the top of the cave fell in long ago. Sunlight comes through these openings. As a result, a jungle grows inside the cave, with trees as tall as 30 metres.","Tourists have visited Son Doong since 2013. Only about 1,000 visitors can go each year. This rule keeps the cave clean and safe."],"groups":[{"type":"para","items":[{"n":11,"q":"the length of the cave","a":"B","ev":[1,"The main passage is more than five kilometres long."],"ex":"Paragraph B says: “The main passage is more than five kilometres long.”","vi":"Đoạn B viết: “The main passage is more than five kilometres long.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"the year when tourists first came","a":"E","ev":[4,"Tourists have visited Son Doong since 2013."],"ex":"Paragraph E says: “Tourists have visited Son Doong since 2013.”","vi":"Đoạn E viết: “Tourists have visited Son Doong since 2013.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["sunlight"],"ev":[3,"Sunlight comes through these openings."],"ex":"Find it in the passage: “Sunlight comes through these openings.”","vi":"Tìm trong bài: “Sunlight comes through these openings.”","hint":"Look at paragraph D."},{"n":14,"a":["jungle"],"ev":[3,"As a result, a jungle grows inside the cave, with trees as tall as 30 metres."],"ex":"Find it in the passage: “As a result, a jungle grows inside the cave, with trees as tall as 30 metres.”","vi":"Tìm trong bài: “As a result, a jungle grows inside the cave, with trees as tall as 30 metres.”","hint":"Look at paragraph D."}],"text":"{13} enters the cave through two openings. As a result, a {14} grows inside.","title":"A jungle in a cave","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Why can only about 1,000 people visit each year?","opts":["because the trip is very expensive","to keep the cave clean and safe","because there are no guides","because the cave is too small"],"a":"B","ev":[4,"This rule keeps the cave clean and safe."],"ex":"The passage says: “This rule keeps the cave clean and safe.”","vi":"Trong bài: “This rule keeps the cave clean and safe.”","hint":"Look at paragraph E."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s1-exam","title":"Bộ 1 · Thi","minutes":20,"passages":[{"title":"The School That Grows Its Own Lunch","topic":"Food and health","labeled":false,"paras":["Three years ago, lunch at Hillside Primary School was not popular. Most children left the vegetables on their plates, and every day the kitchen threw away almost twenty kilograms of food.","The idea came from a ten-year-old pupil called Minh. In a science lesson, his class grew beans in paper cups. Minh asked his teacher a simple question: “Why can’t we grow our own lunch?” The head teacher, Mrs Oliveira, liked the idea. Behind the school there was an old car park that nobody used. During the summer holiday, parents and teachers removed the hard ground and brought in fresh soil.","Now every class looks after one part of the garden. The children water the plants before lessons start, and on Fridays they pick the vegetables and carry them to the kitchen.","The garden has not always been easy. In the first spring, snails ate nearly all the lettuce. The pupils did not want to use chemicals, so they searched for an answer in the library. They learned that some birds eat snails, and they built six small bird houses around the garden. By the next year, the snail problem was much smaller.","The results have surprised everyone. The kitchen now throws away less than five kilograms of food a day. Every month the pupils also sell extra vegetables to parents, and they use the money to buy seeds for the next year."],"groups":[{"type":"tfng","range":"Questions 1–3","instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","items":[{"n":1,"q":"The idea for the garden came from the head teacher.","a":"F","ev":[1,"The idea came from a ten-year-old pupil called Minh."],"ex":"The idea came from Minh, a pupil. The head teacher only liked the idea.","vi":"Ý tưởng là của bạn Minh (học sinh). Cô hiệu trưởng chỉ thích ý tưởng đó thôi."},{"n":2,"q":"The garden was built on land that was not being used.","a":"T","ev":[1,"an old car park that nobody used"],"ex":"“An old car park that nobody used” means the same as “land that was not being used”.","vi":"“Bãi đỗ xe cũ không ai dùng” có cùng nghĩa với “mảnh đất không được sử dụng”. Hai cách nói, một ý."},{"n":3,"q":"Minh’s parents helped to build the garden.","a":"NG","ev":[1,"parents and teachers removed the hard ground and brought in fresh soil"],"ex":"We know that parents helped, but the passage never says whether MINH’S parents were there. We cannot know, so the answer is NOT GIVEN.","vi":"Bài chỉ nói “phụ huynh” giúp, không nói bố mẹ CỦA MINH có tham gia hay không. Không đủ thông tin nên là NOT GIVEN."}]},{"type":"gap","range":"Questions 4–5","instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","items":[{"n":4,"q":"The pupils take the vegetables to the kitchen on ___.","a":["fridays","friday"],"ev":[2,"on Fridays they pick the vegetables and carry them to the kitchen"],"ex":"“Carry them to the kitchen” = “take the vegetables to the kitchen”. The day is Fridays.","vi":"“Carry them to the kitchen” = “take the vegetables to the kitchen”. Ngày đó là thứ Sáu."},{"n":5,"q":"The pupils found the answer to the snail problem in the ___.","a":["library"],"ev":[3,"they searched for an answer in the library"],"ex":"They searched for an answer in the library.","vi":"Các bạn tìm câu trả lời trong thư viện."}]}]},{"title":"Telling the Time with Shadows","topic":"Science · Light and shadows","labeled":true,"paras":["Long before clocks were invented, people still needed to know the time. Farmers had to know when to start work, and traders needed to know when the market opened. To find the answer, they looked up. They noticed that the Sun seems to move across the sky during the day, and that shadows on the ground change as it moves.","A shadow forms when an object blocks light. Light travels in straight lines, so it cannot bend around a tree or a person. The dark shape behind the object is its shadow. Early in the morning, the Sun is low in the sky and shadows are long. At midday, the Sun is high and shadows are at their shortest.","More than 3,000 years ago, the ancient Egyptians used this knowledge to make shadow clocks. One of the simplest was a tall stone column called an obelisk. People watched where its shadow fell and divided the day into parts. Later, the Greeks and Romans made smaller sundials. A sundial has a flat plate with numbers on it and a stick, called a gnomon, which makes the shadow.","Sundials had some serious problems. They were useless at night and on cloudy days. For these reasons, people invented other kinds of clock: water clocks, which measured time with dripping water, and, much later, mechanical clocks with wheels and springs."],"groups":[{"type":"heading","range":"Questions 6–8","instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","headings":[["i","The weaknesses of sundials"],["ii","How a shadow is made and why it changes"],["iii","The first shadow clocks"],["iv","Why mechanical clocks were expensive"],["v","How the Egyptians measured time at night"]],"items":[{"n":6,"q":"Paragraph B","a":"ii","ev":[1,"A shadow forms when an object blocks light."],"ex":"Paragraph B is all science: how a shadow forms, and how it gets longer and shorter during the day.","vi":"Đoạn B toàn là khoa học: bóng được tạo ra thế nào và dài ngắn thay đổi ra sao trong ngày."},{"n":7,"q":"Paragraph C","a":"iii","ev":[2,"the ancient Egyptians used this knowledge to make shadow clocks"],"ex":"Paragraph C is about the earliest shadow clocks: Egyptian obelisks, then Greek and Roman sundials. Heading v is wrong because nothing here is about the night.","vi":"Đoạn C nói về những đồng hồ bóng nắng đầu tiên (Ai Cập, rồi Hy Lạp, La Mã). Tiêu đề v sai vì đoạn này không nói gì về ban đêm."},{"n":8,"q":"Paragraph D","a":"i","ev":[3,"Sundials had some serious problems."],"ex":"“Serious problems” = “weaknesses”. Mechanical clocks are mentioned, but nothing is said about their price, so heading iv is wrong.","vi":"“Serious problems” = “weaknesses” (điểm yếu). Đoạn có nhắc đồng hồ cơ nhưng không nói gì về giá tiền nên iv sai."}]},{"type":"mcq","range":"Question 9","instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","items":[{"n":9,"q":"What is a gnomon?","opts":["a tall stone column in Egypt","the flat plate of a sundial","the part of a sundial that makes the shadow","a clock that uses dripping water"],"a":"C","ev":[2,"a stick, called a gnomon, which makes the shadow"],"ex":"The gnomon is the stick that makes the shadow. The tall stone column is called an obelisk, not a gnomon.","vi":"Gnomon là cái que tạo ra bóng. Cột đá cao gọi là obelisk, không phải gnomon."}]},{"type":"gap","range":"Question 10","instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage.","items":[{"n":10,"q":"Light travels in ___ lines.","a":["straight"],"ev":[1,"Light travels in straight lines"],"ex":"Paragraph B: light travels in straight lines.","vi":"Đoạn B: ánh sáng truyền theo đường thẳng."}]}]},{"title":"The Cave with Its Own Sky","topic":"Vietnam · Nature","labeled":true,"paras":["In 1990, a farmer named Ho Khanh was walking through the jungle of Quang Binh Province in central Vietnam. When heavy rain began, he looked for a place to shelter and found a huge hole in a cliff. He could hear a river roaring inside, and a strong wind blew out of the darkness. He did not go in, and afterwards he could not find the path to the entrance again.","For almost twenty years, the cave stayed hidden. Then, in 2009, Ho Khanh led a team of British cave explorers to the entrance. They measured the cave and could hardly believe the numbers. The main passage was more than five kilometres long, and in some places the roof was 200 metres above the floor, high enough to cover a building of forty floors. They named the cave Son Doong. It is the largest known cave in the world.","How did such an enormous cave form? The mountains in this area are made of limestone, a kind of rock that water can slowly dissolve. For millions of years, an underground river has been cutting through the stone, making the tunnel wider and deeper.","In two places, the roof became too weak and fell in long ago. Sunlight comes through these openings and reaches the floor of the cave. As a result, a real jungle grows inside Son Doong, with trees as tall as 30 metres. The cave is so large that clouds even form under its roof.","Tourists have been able to visit Son Doong since 2013, but the rules are strict. Only about 1,000 visitors are allowed each year, and they travel in small groups with expert guides. These limits keep the cave clean and safe for the plants and animals that live there."],"groups":[{"type":"para","range":"Questions 11–12","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","letters":"ABCDE","items":[{"n":11,"q":"an explanation of why plants can live inside the cave","a":"D","ev":[3,"Sunlight comes through these openings and reaches the floor of the cave."],"ex":"Paragraph D: sunlight comes through the openings, so a jungle can grow inside.","vi":"Đoạn D: ánh nắng chiếu qua các lỗ hở nên rừng cây mọc được trong hang."},{"n":12,"q":"a comparison between the height of the cave and a building","a":"B","ev":[1,"high enough to cover a building of forty floors"],"ex":"Paragraph B compares the roof (200 metres) with a building of forty floors.","vi":"Đoạn B so sánh trần hang (200 m) với một tòa nhà 40 tầng."}]},{"type":"summary","range":"Questions 13–14","instr":"Complete the summary b
