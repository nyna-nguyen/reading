bones strong.”","hint":"Look at paragraph D."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Six Dots","topic":"Talking about people","labeled":true,"paras":["Louis Braille lost his sight when he was a small child, after an accident in his father's workshop. At ten, he left his village to study at a school for blind children in Paris.","One day, an army captain named Charles Barbier visited the school. He showed the pupils \"night writing\". It was a code of dots that soldiers could read in the dark with their fingers.","Louis liked the idea, but the code was too difficult. It used up to twelve dots for each sound. Louis made it simpler. His system used only six dots, so a reader could feel a whole letter with one finger.","Louis finished his system when he was fifteen. Later, he became a teacher at the same school. His pupils loved the dots, but the school did not use them officially for many years.","Louis Braille died in 1852. Two years later, his school finally accepted his system. Today it is used in almost every language."],"groups":[{"type":"para","items":[{"n":11,"q":"a visitor who brought a new idea to the school","a":"B","ev":[1,"One day, an army captain named Charles Barbier visited the school."],"ex":"Paragraph B says: “One day, an army captain named Charles Barbier visited the school.”","vi":"Đoạn B viết: “One day, an army captain named Charles Barbier visited the school.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"the job Louis did as an adult","a":"D","ev":[3,"Later, he became a teacher at the same school."],"ex":"Paragraph D says: “Later, he became a teacher at the same school.”","vi":"Đoạn D viết: “Later, he became a teacher at the same school.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["twelve"],"ev":[2,"It used up to twelve dots for each sound."],"ex":"Find it in the passage: “It used up to twelve dots for each sound.”","vi":"Tìm trong bài: “It used up to twelve dots for each sound.”","hint":"Look at paragraph C."},{"n":14,"a":["finger"],"ev":[2,"His system used only six dots, so a reader could feel a whole letter with one finger."],"ex":"Find it in the passage: “His system used only six dots, so a reader could feel a whole letter with one finger.”","vi":"Tìm trong bài: “His system used only six dots, so a reader could feel a whole letter with one finger.”","hint":"Look at paragraph C."}],"text":"The captain's code used up to {13} dots for each sound. With Louis's system, a reader could feel a whole letter with one {14}.","title":"From twelve dots to six","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Who was \"night writing\" first made for?","opts":["teachers","doctors","soldiers","blind children"],"a":"C","ev":[1,"It was a code of dots that soldiers could read in the dark with their fingers."],"ex":"The passage says: “It was a code of dots that soldiers could read in the dark with their fingers.”","vi":"Trong bài: “It was a code of dots that soldiers could read in the dark with their fingers.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s2-exam","set":2,"kind":"exam","title":"Bộ 2 · Thi","minutes":20,"passages":[{"title":"The Night Shift in Your Head","topic":"Food and health","labeled":false,"paras":["You may think that nothing happens while you sleep, but your brain is busy all night. It goes through the things you saw, heard and learned during the day. It stores the important things as memories and removes the rest. Scientists have found that pupils who sleep well after studying remember more the next day.","Your body is working too. It repairs small injuries, fights germs and does a lot of its growing.","Children between six and twelve need nine to twelve hours of sleep each night, but many get less. One reason is screens. The light from a phone or tablet tells the brain that it is still daytime, so falling asleep takes longer.","Doctors give simple advice. Go to bed at the same time every night. Turn off screens an hour before bed. Keep your bedroom dark and quiet. After a week, most children notice the difference."],"groups":[{"type":"tfng","items":[{"n":1,"q":"During sleep, the brain chooses which information to keep.","a":"T","ev":[0,"It stores the important things as memories and removes the rest."],"ex":"The passage says the same thing in different words. The passage says: “It stores the important things as memories and removes the rest.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “It stores the important things as memories and removes the rest.”","hint":"Look at paragraph 1."},{"n":2,"q":"Children who sleep well get higher marks in maths.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage says they remember more. It does not talk about marks in maths.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài nói các bạn nhớ được nhiều hơn, không nói gì về điểm Toán.","hint":"Read the whole passage again. Is this information really there?"},{"n":3,"q":"Doctors say children can use screens until bedtime.","a":"F","ev":[3,"Turn off screens an hour before bed."],"ex":"The passage says something different. The passage says: “Turn off screens an hour before bed.”","vi":"Bài nói khác với câu này. Trong bài: “Turn off screens an hour before bed.”","hint":"Look at paragraph 4."}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"While you sleep, your body fights ___.","a":["germs"],"ev":[1,"It repairs small injuries, fights germs and does a lot of its growing."],"ex":"Find it in the passage: “It repairs small injuries, fights germs and does a lot of its growing.”","vi":"Tìm trong bài: “It repairs small injuries, fights germs and does a lot of its growing.”","hint":"Look at paragraph 2."},{"n":5,"q":"A good bedroom is dark and ___.","a":["quiet"],"ev":[3,"Keep your bedroom dark and quiet."],"ex":"Find it in the passage: “Keep your bedroom dark and quiet.”","vi":"Tìm trong bài: “Keep your bedroom dark and quiet.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"The Frame That Moves","topic":"Science · Skeleton and muscles","labeled":true,"paras":["Your skeleton is a frame of 206 bones. It gives your body its shape and holds it up. It also guards the soft parts inside you: the skull protects the brain, and the ribs protect the heart and lungs.","Bones come in many sizes. The longest bone is in the top part of your leg. The smallest is inside your ear, and it is smaller than a grain of rice. Even this tiny bone has a job: it helps you hear.","Bones meet at joints, such as the elbow and the knee. Muscles are fixed to the bones on both sides of a joint. A muscle can pull but cannot push, so muscles work in pairs. When you bend your arm, one muscle gets shorter and pulls. To make the arm straight again, the other muscle pulls the opposite way.","A bone can break, but it can also repair itself. A doctor puts the broken parts in the right position and covers the arm or leg with a hard cast. In a few weeks, new bone grows across the break."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"i","ev":[1,"Bones come in many sizes."],"ex":"The whole of paragraph B is about this idea: “Big bones and small bones”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Big bones and small bones”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iv","ev":[2,"Bones meet at joints, such as the elbow and the knee."],"ex":"The whole of paragraph C is about this idea: “How joints and muscles work together”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “How joints and muscles work together”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"A bone can break, but it can also repair itself."],"ex":"The whole of paragraph D is about this idea: “How a broken bone gets better”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “How a broken bone gets better”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Big bones and small bones"],["ii","Foods that make bones strong"],["iii","Why babies have more bones"],["iv","How joints and muscles work together"],["v","How a broken bone gets better"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Where is the smallest bone in the body?","opts":["in the hand","in the knee","in the ear","in the leg"],"a":"C","ev":[1,"The smallest is inside your ear, and it is smaller than a grain of rice."],"ex":"The passage says: “The smallest is inside your ear, and it is smaller than a grain of rice.”","vi":"Trong bài: “The smallest is inside your ear, and it is smaller than a grain of rice.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"A doctor covers a broken arm or leg with a hard ___.","a":["cast"],"ev":[3,"A doctor puts the broken parts in the right position and covers the arm or leg with a hard cast."],"ex":"Find it in the passage: “A doctor puts the broken parts in the right position and covers the arm or leg with a hard cast.”","vi":"Tìm trong bài: “A doctor puts the broken parts in the right position and covers the arm or leg with a hard cast.”","hint":"Look at paragraph D."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Louis Braille's Gift","topic":"Talking about people","labeled":true,"paras":["Louis Braille was born in 1809 in a small village near Paris. At the age of three, he hurt his eye with a sharp tool in his father's workshop. The eye became infected, the infection spread to the other eye, and by five he was completely blind.","His parents wanted him to learn, so he went to the village school and listened carefully to every lesson. He was one of the best pupils. At ten, he won a place at a school for blind children in Paris.","The books there had large letters pressed into thick paper. They were heavy and slow to read. Then an army captain showed the school a code of dots, made for soldiers to read at night. It was clever, but it used up to twelve dots for each sound.","Louis spent three years improving it. By fifteen, he had a system with only six dots. A reader could feel each letter with one finger, and, for the first time, blind people could write as well as read.","The world was slow to accept it. Louis died in 1852, and his school began to use braille officially only two years later. Today, you can find it in books, on lift buttons and on medicine boxes."],"groups":[{"type":"para","items":[{"n":11,"q":"a new skill that braille gave to blind people","a":"D","ev":[3,"A reader could feel each letter with one finger, and, for the first time, blind people could write as well as read."],"ex":"Paragraph D says: “A reader could feel each letter with one finger, and, for the first time, blind people could write as well as read.”","vi":"Đoạn D viết: “A reader could feel each letter with one finger, and, for the first time, blind people could write as well as read.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"examples of where braille is used now","a":"E","ev":[4,"Today, you can find it in books, on lift buttons and on medicine boxes."],"ex":"Paragraph E says: “Today, you can find it in books, on lift buttons and on medicine boxes.”","vi":"Đoạn E viết: “Today, you can find it in books, on lift buttons and on medicine boxes.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["workshop"],"ev":[0,"At the age of three, he hurt his eye with a sharp tool in his father's workshop."],"ex":"Find it in the passage: “At the age of three, he hurt his eye with a sharp tool in his father's workshop.”","vi":"Tìm trong bài: “At the age of three, he hurt his eye with a sharp tool in his father's workshop.”","hint":"Look at paragraph A."},{"n":14,"a":["blind"],"ev":[0,"The eye became infected, the infection spread to the other eye, and by five he was completely blind."],"ex":"Find it in the passage: “The eye became infected, the infection spread to the other eye, and by five he was completely blind.”","vi":"Tìm trong bài: “The eye became infected, the infection spread to the other eye, and by five he was completely blind.”","hint":"Look at paragraph A."}],"text":"Louis hurt his eye in his father's {13}. By the age of five, he was completely {14}.","title":"Louis's early life","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What was the problem with the army captain's code?","opts":["It used too many dots.","It could only be read at night.","It was a secret.","It was too heavy to carry."],"a":"A","ev":[2,"It was clever, but it used up to twelve dots for each sound."],"ex":"The passage says: “It was clever, but it used up to twelve dots for each sound.”","vi":"Trong bài: “It was clever, but it used up to twelve dots for each sound.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s3-try","set":3,"kind":"try","title":"Bộ 3 · Thử","minutes":20,"passages":[{"title":"The Moon Festival","topic":"Special occasions","labeled":false,"paras":["The Mid-Autumn Festival is a special day for children in Vietnam. It is on the fifteenth day of the eighth month of the lunar calendar. On that night, the moon is full and bright.","Before the festival, children make or buy lanterns. Many lanterns have the shape of a star. Some look like fish or rabbits.","In the evening, children carry their lanterns along the streets. They sing songs and watch the lion dance. The drums are very loud!","After that, families sit together and eat mooncakes. These cakes are round, like the full moon. Children love this night because their parents have time to play with them."],"groups":[{"type":"tfng","items":[{"n":1,"q":"The moon is full on the night of the festival.","a":"T","ev":[0,"On that night, the moon is full and bright."],"ex":"The passage says the same thing in different words. The passage says: “On that night, the moon is full and bright.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “On that night, the moon is full and bright.”","hint":"Look at paragraph 1."},{"n":2,"q":"All lanterns have the shape of a star.","a":"F","ev":[1,"Some look like fish or rabbits."],"ex":"The passage says something different. The passage says: “Some look like fish or rabbits.”","vi":"Bài nói khác với câu này. Trong bài: “Some look like fish or rabbits.”","hint":"Look at paragraph 2."},{"n":3,"q":"Children get new clothes for the festival.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage talks about lanterns, songs and cakes, but not about clothes.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài nói về đèn lồng, bài hát và bánh, không nói gì về quần áo.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"In the evening, children watch the lion ___.","a":["dance"],"ev":[2,"They sing songs and watch the lion dance."],"ex":"Find it in the passage: “They sing songs and watch the lion dance.”","vi":"Tìm trong bài: “They sing songs and watch the lion dance.”","hint":"Look at paragraph 3."},{"n":5,"q":"Mooncakes are ___, like the full moon.","a":["round"],"ev":[3,"These cakes are round, like the full moon."],"ex":"Find it in the passage: “These cakes are round, like the full moon.”","vi":"Tìm trong bài: “These cakes are round, like the full moon.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"The Journey of Water","topic":"Science · The water cycle","labeled":true,"paras":["The water on Earth is very old. It is never lost. It moves from the sea to the sky and back again. This journey is called the water cycle.","First, the Sun heats the water in seas, rivers and lakes. Some of the water changes into a gas called water vapour. The vapour rises into the air. This is called evaporation.","High in the sky, the air is cold. The water vapour cools and changes back into tiny drops of water. Millions of these drops together make a cloud.","When the drops in a cloud get big and heavy, they fall as rain. The rain runs into rivers, and the rivers carry it back to the sea. Then the journey begins again."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"ii","ev":[1,"First, the Sun heats the water in seas, rivers and lakes."],"ex":"The whole of paragraph B is about this idea: “Water goes up”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Water goes up”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"i","ev":[2,"High in the sky, the air is cold."],"ex":"The whole of paragraph C is about this idea: “How clouds are made”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “How clouds are made”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"iii","ev":[3,"When the drops in a cloud get big and heavy, they fall as rain."],"ex":"The whole of paragraph D is about this idea: “Water comes back down”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Water comes back down”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","How clouds are made"],["ii","Water goes up"],["iii","Water comes back down"],["iv","How to save water at home"],["v","Why the sea is salty"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What heats the water in seas, rivers and lakes?","opts":["the Sun","the wind","the rain","the clouds"],"a":"A","ev":[1,"First, the Sun heats the water in seas, rivers and lakes."],"ex":"The passage says: “First, the Sun heats the water in seas, rivers and lakes.”","vi":"Trong bài: “First, the Sun heats the water in seas, rivers and lakes.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Millions of tiny drops of water make a ___.","a":["cloud"],"ev":[2,"Millions of these drops together make a cloud."],"ex":"Find it in the passage: “Millions of these drops together make a cloud.”","vi":"Tìm trong bài: “Millions of these drops together make a cloud.”","hint":"Look at paragraph C."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"A City on the Water","topic":"Places","labeled":true,"paras":["Venice is a city in Italy. It is built on 118 small islands in the sea. There are no roads for cars in the old city.","Instead of streets, Venice has canals. People travel by boat. Even the buses and the ambulances are boats! A long, thin boat called a gondola carries visitors around the city.","People can also walk. There are about 400 bridges over the canals. Children walk to school over the bridges.","Venice has a problem with water. Sometimes the sea rises and covers the streets and squares. People then walk on high wooden paths so that their feet stay dry."],"groups":[{"type":"para","items":[{"n":11,"q":"how children go to school","a":"C","ev":[2,"Children walk to school over the bridges."],"ex":"Paragraph C says: “Children walk to school over the bridges.”","vi":"Đoạn C viết: “Children walk to school over the bridges.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"what people do when the sea covers the streets","a":"D","ev":[3,"People then walk on high wooden paths so that their feet stay dry."],"ex":"Paragraph D says: “People then walk on high wooden paths so that their feet stay dry.”","vi":"Đoạn D viết: “People then walk on high wooden paths so that their feet stay dry.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["canals"],"ev":[1,"Instead of streets, Venice has canals."],"ex":"Find it in the passage: “Instead of streets, Venice has canals.”","vi":"Tìm trong bài: “Instead of streets, Venice has canals.”","hint":"Look at paragraph B."},{"n":14,"a":["gondola"],"ev":[1,"A long, thin boat called a gondola carries visitors around the city."],"ex":"Find it in the passage: “A long, thin boat called a gondola carries visitors around the city.”","vi":"Tìm trong bài: “A long, thin boat called a gondola carries visitors around the city.”","hint":"Look at paragraph B."}],"text":"Venice has {13} instead of streets. Visitors can ride in a long, thin boat called a {14}.","title":"Travelling in Venice","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What is unusual about the buses in Venice?","opts":["They are very long.","They are free.","They cross the bridges.","They are boats."],"a":"D","ev":[1,"Even the buses and the ambulances are boats!"],"ex":"The passage says: “Even the buses and the ambulances are boats!”","vi":"Trong bài: “Even the buses and the ambulances are boats!”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s3-practice","set":3,"kind":"practice","title":"Bộ 3 · Luyện tập","minutes":20,"passages":[{"title":"Lan's Lantern","topic":"Special occasions","labeled":false,"paras":["Lan lives in Hoi An, a town famous for its lanterns. Every year, she waits for the Mid-Autumn Festival, on the fifteenth day of the eighth lunar month.","This year, Lan did not buy a lantern. Her grandfather taught her to make one. They used thin pieces of bamboo for the frame and covered it with red paper. It took them two evenings.","On the night of the festival, the moon was full. Lan carried her star lantern through the old streets with her friends. They followed the lion dance, and the drums were so loud that she covered her ears.","At home, her grandmother cut a mooncake into eight pieces. Lan said her lantern was not perfect, but it was the best one she had ever had."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Lan bought her lantern in a shop.","a":"F","ev":[1,"This year, Lan did not buy a lantern."],"ex":"The passage says something different. The passage says: “This year, Lan did not buy a lantern.”","vi":"Bài nói khác với câu này. Trong bài: “This year, Lan did not buy a lantern.”","hint":"Look at paragraph 2."},{"n":2,"q":"Lan and her grandfather needed more than one evening to make the lantern.","a":"T","ev":[1,"It took them two evenings."],"ex":"The passage says the same thing in different words. The passage says: “It took them two evenings.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “It took them two evenings.”","hint":"Look at paragraph 2."},{"n":3,"q":"Lan's lantern won a prize at the festival.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not mention any prize or competition.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nhắc tới giải thưởng hay cuộc thi nào.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The frame of the lantern was made of ___.","a":["bamboo"],"ev":[1,"They used thin pieces of bamboo for the frame and covered it with red paper."],"ex":"Find it in the passage: “They used thin pieces of bamboo for the frame and covered it with red paper.”","vi":"Tìm trong bài: “They used thin pieces of bamboo for the frame and covered it with red paper.”","hint":"Look at paragraph 2."},{"n":5,"q":"Lan's grandmother cut the mooncake into ___ pieces.","a":["eight"],"ev":[3,"At home, her grandmother cut a mooncake into eight pieces."],"ex":"Find it in the passage: “At home, her grandmother cut a mooncake into eight pieces.”","vi":"Tìm trong bài: “At home, her grandmother cut a mooncake into eight pieces.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Where Does the Water Go?","topic":"Science · The water cycle","labeled":true,"paras":["When you hang wet clothes outside on a sunny day, they dry. Where does the water go? It changes into water vapour, a gas that you cannot see, and goes into the air. This change is called evaporation.","The opposite change is condensation. When water vapour touches something cold, it changes back into liquid water. You can see this on a cold glass of juice: small drops appear on the outside. Clouds form in the same way, when vapour cools high in the sky.","Water falls from clouds as rain. If the air is very cold, it falls as snow or hail instead. Scientists use one word for all of these: precipitation.","Some rain runs over the ground into rivers. Some goes down into the soil, and plants drink it through their roots. In the end, most water returns to the sea."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"v","ev":[1,"The opposite change is condensation."],"ex":"The whole of paragraph B is about this idea: “From gas back to liquid”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “From gas back to liquid”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iv","ev":[2,"Water falls from clouds as rain."],"ex":"The whole of paragraph C is about this idea: “Different kinds of falling water”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Different kinds of falling water”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"ii","ev":[3,"Some rain runs over the ground into rivers."],"ex":"The whole of paragraph D is about this idea: “Where rain goes after it falls”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Where rain goes after it falls”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Why clothes dry faster in the wind"],["ii","Where rain goes after it falls"],["iii","How snow is made into ice"],["iv","Different kinds of falling water"],["v","From gas back to liquid"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Why do small drops appear on a cold glass of juice?","opts":["Rain falls on the glass.","Juice comes through the glass.","The glass is wet inside.","Water vapour in the air touches the cold glass."],"a":"D","ev":[1,"When water vapour touches something cold, it changes back into liquid water."],"ex":"The passage says: “When water vapour touches something cold, it changes back into liquid water.”","vi":"Trong bài: “When water vapour touches something cold, it changes back into liquid water.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Plants drink water from the soil through their ___.","a":["roots"],"ev":[3,"Some goes down into the soil, and plants drink it through their roots."],"ex":"Find it in the passage: “Some goes down into the soil, and plants drink it through their roots.”","vi":"Tìm trong bài: “Some goes down into the soil, and plants drink it through their roots.”","hint":"Look at paragraph D."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"How Venice Began","topic":"Places","labeled":true,"paras":["Venice was built more than 1,500 years ago by people who were escaping from enemies. They chose 118 muddy islands in a lagoon, because soldiers on horses could not reach them there.","The mud was too soft for houses. So the builders pushed thousands of long wooden posts deep into the ground and built on top of them. Under the water there is no air, so the wood has not rotted. Many posts are still strong today.","The city has about 150 canals instead of roads. The biggest is the Grand Canal. Gondolas, water buses and delivery boats use it all day.","Millions of tourists visit Venice every year. They bring money, but they also bring problems. The narrow streets are crowded, and big ships make waves that damage old buildings.","The sea is another danger. Several times a year, high water floods the lowest parts of the city."],"groups":[{"type":"para","items":[{"n":11,"q":"the reason why the wooden posts have lasted so long","a":"B","ev":[1,"Under the water there is no air, so the wood has not rotted."],"ex":"Paragraph B says: “Under the water there is no air, so the wood has not rotted.”","vi":"Đoạn B viết: “Under the water there is no air, so the wood has not rotted.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"a disadvantage of tourism","a":"D","ev":[3,"They bring money, but they also bring problems."],"ex":"Paragraph D says: “They bring money, but they also bring problems.”","vi":"Đoạn D viết: “They bring money, but they also bring problems.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["enemies"],"ev":[0,"Venice was built more than 1,500 years ago by people who were escaping from enemies."],"ex":"Find it in the passage: “Venice was built more than 1,500 years ago by people who were escaping from enemies.”","vi":"Tìm trong bài: “Venice was built more than 1,500 years ago by people who were escaping from enemies.”","hint":"Look at paragraph A."},{"n":14,"a":["posts"],"ev":[1,"So the builders pushed thousands of long wooden posts deep into the ground and built on top of them."],"ex":"Find it in the passage: “So the builders pushed thousands of long wooden posts deep into the ground and built on top of them.”","vi":"Tìm trong bài: “So the builders pushed thousands of long wooden posts deep into the ground and built on top of them.”","hint":"Look at paragraph B."}],"text":"The first people came to the islands to escape from {13}. The ground was too soft, so they built their houses on long wooden {14}.","title":"The first builders","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What is the Grand Canal?","opts":["the biggest canal in Venice","an island in the lagoon","a famous bridge","a kind of water bus"],"a":"A","ev":[2,"The biggest is the Grand Canal."],"ex":"The passage says: “The biggest is the Grand Canal.”","vi":"Trong bài: “The biggest is the Grand Canal.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s3-exam","set":3,"kind":"exam","title":"Bộ 3 · Thi","minutes":20,"passages":[{"title":"A Festival Under the Full Moon","topic":"Special occasions","labeled":false,"paras":["The Mid-Autumn Festival is celebrated in Vietnam and several other Asian countries on the fifteenth day of the eighth lunar month, when the moon is at its roundest and brightest.","Long ago, it was a festival for the end of the harvest. Farmers had worked hard all summer and had little time for their children. When the rice was finally in, parents wanted to do something special for them. This is why, in Vietnam, the festival became a day for children.","Children carry lanterns, often in the shape of a star, and follow lion dancers through the streets. People believe that the noise of the drums brings good luck.","Families also share mooncakes. A traditional mooncake is filled with sweet beans and has a salty egg yolk in the middle, which looks like the moon. The cakes are rich, so people cut them into small pieces and eat them with tea."],"groups":[{"type":"tfng","items":[{"n":1,"q":"The festival is only celebrated in Vietnam.","a":"F","ev":[0,"The Mid-Autumn Festival is celebrated in Vietnam and several other Asian countries on the fifteenth day of the eighth lunar month, when the moon is at its roundest and brightest."],"ex":"The passage says something different. The passage says: “The Mid-Autumn Festival is celebrated in Vietnam and several other Asian countries on the fifteenth day of the eighth lunar month, when the moon is at its roundest and brightest.”","vi":"Bài nói khác với câu này. Trong bài: “The Mid-Autumn Festival is celebrated in Vietnam and several other Asian countries on the fifteenth day of the eighth lunar month, when the moon is at its roundest and brightest.”","hint":"Look at paragraph 1."},{"n":2,"q":"In the past, the festival came after farmers finished collecting their rice.","a":"T","ev":[1,"Long ago, it was a festival for the end of the harvest."],"ex":"The passage says the same thing in different words. The passage says: “Long ago, it was a festival for the end of the harvest.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “Long ago, it was a festival for the end of the harvest.”","hint":"Look at paragraph 2."},{"n":3,"q":"Lion dancers are always adults.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage says children follow the lion dancers. It does not say how old the dancers are.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài nói trẻ em đi theo đoàn múa lân, không nói người múa bao nhiêu tuổi.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"People believe that the noise of the ___ brings good luck.","a":["drums"],"ev":[2,"People believe that the noise of the drums brings good luck."],"ex":"Find it in the passage: “People believe that the noise of the drums brings good luck.”","vi":"Tìm trong bài: “People believe that the noise of the drums brings good luck.”","hint":"Look at paragraph 3."},{"n":5,"q":"People eat small pieces of mooncake with ___.","a":["tea"],"ev":[3,"The cakes are rich, so people cut them into small pieces and eat them with tea."],"ex":"Find it in the passage: “The cakes are rich, so people cut them into small pieces and eat them with tea.”","vi":"Tìm trong bài: “The cakes are rich, so people cut them into small pieces and eat them with tea.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"The Oldest Water in the World","topic":"Science · The water cycle","labeled":true,"paras":["The Earth has had the same water for billions of years. The water you drink today may once have been in a river where dinosaurs drank. This is possible because water moves around the planet in a cycle that never stops.","The Sun drives the cycle. Its heat makes water evaporate from seas and lakes, and even from the leaves of plants. The water vapour rises, cools and condenses into clouds. Wind can then carry the clouds hundreds of kilometres.","Sooner or later, the water falls as rain, snow or hail. Not all of it goes straight back to the sea. Some is locked in ice on high mountains for thousands of years. Some sinks deep into the ground and stays there.","Almost all the water on Earth is salty sea water. Only about three per cent is fresh water, and most of that is frozen. This is why the clean water in our taps is so valuable, and why we should not waste it."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iii","ev":[1,"The Sun drives the cycle."],"ex":"The whole of paragraph B is about this idea: “The part the Sun plays”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “The part the Sun plays”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"ii","ev":[2,"Sooner or later, the water falls as rain, snow or hail."],"ex":"The whole of paragraph C is about this idea: “Water that waits for a long time”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Water that waits for a long time”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"i","ev":[3,"Almost all the water on Earth is salty sea water."],"ex":"The whole of paragraph D is about this idea: “Why fresh water is precious”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Why fresh water is precious”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Why fresh water is precious"],["ii","Water that waits for a long time"],["iii","The part the Sun plays"],["iv","How dinosaurs found water"],["v","Cleaning water for our taps"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What does the writer say about the water in plants?","opts":["It is always salty.","It sinks deep into the ground.","It is locked in ice.","It evaporates from their leaves."],"a":"D","ev":[1,"Its heat makes water evaporate from seas and lakes, and even from the leaves of plants."],"ex":"The passage says: “Its heat makes water evaporate from seas and lakes, and even from the leaves of plants.”","vi":"Trong bài: “Its heat makes water evaporate from seas and lakes, and even from the leaves of plants.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Clouds can be carried hundreds of kilometres by the ___.","a":["wind"],"ev":[1,"Wind can then carry the clouds hundreds of kilometres."],"ex":"Find it in the passage: “Wind can then carry the clouds hundreds of kilometres.”","vi":"Tìm trong bài: “Wind can then carry the clouds hundreds of kilometres.”","hint":"Look at paragraph B."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Saving Venice","topic":"Places","labeled":true,"paras":["From the air, Venice looks like a fish swimming in a blue lagoon. The city stands on 118 islands, joined by about 400 bridges. It has no cars and no buses. Everything, from letters to rubbish, travels by boat or by hand.","The buildings stand on millions of wooden posts that were pushed into the mud centuries ago. Because the posts are under water, away from the air, they have become almost as hard as stone.","Yet Venice is in danger. The city is slowly sinking, by one or two millimetres a year, while the level of the sea is rising. Floods that used to be rare now happen many times each winter. In November 2019, water covered more than 80 per cent of the city.","To protect the city, engineers built 78 huge yellow gates on the sea floor, at the three entrances to the lagoon. When a high tide is coming, the gates fill with air, rise and stop the sea. They were first used in October 2020, and that day the streets stayed dry.","The gates cost a great deal of money, and some scientists worry that they will not be enough if the sea keeps rising. For now, however, the people of Venice can keep their feet dry."],"groups":[{"type":"para","items":[{"n":11,"q":"a description of how the flood protection works","a":"D","ev":[3,"When a high tide is coming, the gates fill with air, rise and stop the sea."],"ex":"Paragraph D says: “When a high tide is coming, the gates fill with air, rise and stop the sea.”","vi":"Đoạn D viết: “When a high tide is coming, the gates fill with air, rise and stop the sea.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"a doubt about the future","a":"E","ev":[4,"The gates cost a great deal of money, and some scientists worry that they will not be enough if the sea keeps rising."],"ex":"Paragraph E says: “The gates cost a great deal of money, and some scientists worry that they will not be enough if the sea keeps rising.”","vi":"Đoạn E viết: “The gates cost a great deal of money, and some scientists worry that they will not be enough if the sea keeps rising.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["sinking"],"ev":[2,"The city is slowly sinking, by one or two millimetres a year, while the level of the sea is rising."],"ex":"Find it in the passage: “The city is slowly sinking, by one or two millimetres a year, while the level of the sea is rising.”","vi":"Tìm trong bài: “The city is slowly sinking, by one or two millimetres a year, while the level of the sea is rising.”","hint":"Look at paragraph C."},{"n":14,"a":["water"],"ev":[2,"In November 2019, water covered more than 80 per cent of the city."],"ex":"Find it in the passage: “In November 2019, water covered more than 80 per cent of the city.”","vi":"Tìm trong bài: “In November 2019, water covered more than 80 per cent of the city.”","hint":"Look at paragraph C."}],"text":"Venice is slowly {13}, while the level of the sea is rising. In November 2019, {14} covered most of the city.","title":"A city in danger","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What has happened to the wooden posts under Venice?","opts":["They have rotted.","They have been replaced with stone.","They have become very hard.","They have floated away."],"a":"C","ev":[1,"Because the posts are under water, away from the air, they have become almost as hard as stone."],"ex":"The passage says: “Because the posts are under water, away from the air, they have become almost as hard as stone.”","vi":"Trong bài: “Because the posts are under water, away from the air, they have become almost as hard as stone.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s4-try","set":4,"kind":"try","title":"Bộ 4 · Thử","minutes":20,"passages":[{"title":"A Dog with a Job","topic":"Animal kingdom","labeled":false,"paras":["Most dogs play all day, but a guide dog has a job. It helps a blind person to walk safely in the street.","A guide dog wears a special harness on its back. The person holds the handle of the harness and follows the dog.","The dog stops at the edge of the road. It walks around holes, bins and other things in the way. It also finds doors and stairs.","When a guide dog is wearing its harness, it is working. You must not touch it or give it food, because it needs to think about its job. At home, the harness comes off. Then the dog can run and play like any other pet."],"groups":[{"type":"tfng","items":[{"n":1,"q":"A guide dog helps a person who cannot see.","a":"T","ev":[0,"It helps a blind person to walk safely in the street."],"ex":"The passage says the same thing in different words. The passage says: “It helps a blind person to walk safely in the street.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “It helps a blind person to walk safely in the street.”","hint":"Look at paragraph 1."},{"n":2,"q":"You can give food to a guide dog when it is working.","a":"F","ev":[3,"You must not touch it or give it food, because it needs to think about its job."],"ex":"The passage says something different. The passage says: “You must not touch it or give it food, because it needs to think about its job.”","vi":"Bài nói khác với câu này. Trong bài: “You must not touch it or give it food, because it needs to think about its job.”","hint":"Look at paragraph 4."},{"n":3,"q":"A guide dog works for ten years.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not say how many years a guide dog works.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nói chó dẫn đường làm việc bao nhiêu năm.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The person holds the ___ of the harness.","a":["handle"],"ev":[1,"The person holds the handle of the harness and follows the dog."],"ex":"Find it in the passage: “The person holds the handle of the harness and follows the dog.”","vi":"Tìm trong bài: “The person holds the handle of the harness and follows the dog.”","hint":"Look at paragraph 2."},{"n":5,"q":"At home, the dog can run and ___.","a":["play"],"ev":[3,"Then the dog can run and play like any other pet."],"ex":"Find it in the passage: “Then the dog can run and play like any other pet.”","vi":"Tìm trong bài: “Then the dog can run and play like any other pet.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Who Eats What?","topic":"Science · Food chains","labeled":true,"paras":["All living things need food. Food gives them energy to grow and move. A food chain shows who eats what.","Every food chain starts with a plant. Plants do not eat. They make their own food, using light from the Sun. For this reason, plants are called producers.","Animals cannot make food. They must eat plants or other animals, so they are called consumers. A grasshopper eats grass. A frog eats the grasshopper. A snake eats the frog.","We can draw this food chain with arrows, from the grass to the grasshopper, then to the frog and the snake. Each arrow means \"is eaten by\"."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iv","ev":[1,"Every food chain starts with a plant."],"ex":"The whole of paragraph B is about this idea: “Where a food chain begins”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Where a food chain begins”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iii","ev":[2,"Animals cannot make food."],"ex":"The whole of paragraph C is about this idea: “Living things that must eat”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Living things that must eat”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"i","ev":[3,"We can draw this food chain with arrows, from the grass to the grasshopper, then to the frog and the snake."],"ex":"The whole of paragraph D is about this idea: “Drawing a food chain”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Drawing a food chain”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Drawing a food chain"],["ii","Food chains in the sea"],["iii","Living things that must eat"],["iv","Where a food chain begins"],["v","Why snakes are dangerous"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What does the frog eat in this food chain?","opts":["a plant","grass","a snake","a grasshopper"],"a":"D","ev":[2,"A frog eats the grasshopper."],"ex":"The passage says: “A frog eats the grasshopper.”","vi":"Trong bài: “A frog eats the grasshopper.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Plants make their own food, so they are called ___.","a":["producers"],"ev":[1,"For this reason, plants are called producers."],"ex":"Find it in the passage: “For this reason, plants are called producers.”","vi":"Tìm trong bài: “For this reason, plants are called producers.”","hint":"Look at paragraph B."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Penguin Fathers","topic":"Animal kingdom","labeled":true,"paras":["Emperor penguins live in Antarctica, the coldest place on Earth. They are the biggest penguins in the world. An adult is more than one metre tall.","In winter, the mother penguin lays one egg. She gives it to the father. Then she walks to the sea to find food, because she is very hungry.","The father keeps the egg on his feet, under a warm fold of skin. He stands like this for about two months. He does not eat anything.","Thousands of fathers stand close together to stay warm. When the chick comes out of the egg, the mother returns with food. Then it is the father's turn to go to the sea."],"groups":[{"type":"para","items":[{"n":11,"q":"how the fathers stay warm","a":"D","ev":[3,"Thousands of fathers stand close together to stay warm."],"ex":"Paragraph D says: “Thousands of fathers stand close together to stay warm.”","vi":"Đoạn D viết: “Thousands of fathers stand close together to stay warm.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"the size of an emperor penguin","a":"A","ev":[0,"An adult is more than one metre tall."],"ex":"Paragraph A says: “An adult is more than one metre tall.”","vi":"Đoạn A viết: “An adult is more than one metre tall.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["feet"],"ev":[2,"The father keeps the egg on his feet, under a warm fold of skin."],"ex":"Find it in the passage: “The father keeps the egg on his feet, under a warm fold of skin.”","vi":"Tìm trong bài: “The father keeps the egg on his feet, under a warm fold of skin.”","hint":"Look at paragraph C."},{"n":14,"a":["eat"],"ev":[2,"He does not eat anything."],"ex":"Find it in the passage: “He does not eat anything.”","vi":"Tìm trong bài: “He does not eat anything.”","hint":"Look at paragraph C."}],"text":"The father keeps the egg on his {13} for about two months. During this time, he does not {14} anything.","title":"Looking after the egg","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Why does the mother penguin walk to the sea?","opts":["to swim with her chick","to stay warm","to find food","to lay another egg"],"a":"C","ev":[1,"Then she walks to the sea to find food, because she is very hungry."],"ex":"The passage says: “Then she walks to the sea to find food, because she is very hungry.”","vi":"Trong bài: “Then she walks to the sea to find food, because she is very hungry.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s4-practice","set":4,"kind":"practice","title":"Bộ 4 · Luyện tập","minutes":20,"passages":[{"title":"Puppy School","topic":"Animal kingdom","labeled":false,"paras":["A guide dog's training starts when it is only eight weeks old. The puppy goes to live with a volunteer family for about a year. The family teaches it simple things: to sit, to wait and to be calm in busy places. They take it on buses, into shops and to noisy markets.","After that, the young dog goes to a special school. A trainer works with it every day for several months. The dog learns to stop at the edge of the road and to walk around things in the way.","Not every dog passes. Some are too playful or too nervous, and they become family pets instead.","At the end, the dog meets its new owner. They practise together for a few weeks before they go home."],"groups":[{"type":"tfng","items":[{"n":1,"q":"At first, the puppy lives with a family, not at the school.","a":"T","ev":[0,"The puppy goes to live with a volunteer family for about a year."],"ex":"The passage says the same thing in different words. The passage says: “The puppy goes to live with a volunteer family for about a year.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “The puppy goes to live with a volunteer family for about a year.”","hint":"Look at paragraph 1."},{"n":2,"q":"All the dogs finish the training successfully.","a":"F","ev":[2,"Not every dog passes."],"ex":"The passage says something different. The passage says: “Not every dog passes.”","vi":"Bài nói khác với câu này. Trong bài: “Not every dog passes.”","hint":"Look at paragraph 3."},{"n":3,"q":"Most guide dogs are Labradors.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not say what kind of dog is used.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nói giống chó nào được chọn.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"At the special school, a ___ works with the dog every day.","a":["trainer"],"ev":[1,"A trainer works with it every day for several months."],"ex":"Find it in the passage: “A trainer works with it every day for several months.”","vi":"Tìm trong bài: “A trainer works with it every day for several months.”","hint":"Look at paragraph 2."},{"n":5,"q":"Dogs that are too playful or nervous become family ___.","a":["pets"],"ev":[2,"Some are too playful or too nervous, and they become family pets instead."],"ex":"Find it in the passage: “Some are too playful or too nervous, and they become family pets instead.”","vi":"Tìm trong bài: “Some are too playful or too nervous, and they become family pets instead.”","hint":"Look at paragraph 3."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Links in a Chain","topic":"Science · Food chains","labeled":true,"paras":["In a food chain, energy passes from one living thing to the next. It begins with the Sun. Plants use sunlight to make food, so they are the producers.","Animals are consumers. An animal that eats only plants is a herbivore; rabbits and cows are examples. An animal that eats other animals is a carnivore. Animals such as bears, which eat both, are called omnivores.","An animal that hunts is a predator, and the animal it hunts is its prey. An owl is a predator of mice. But a mouse is not safe from other hunters either: snakes and foxes also eat mice.","Every link in a chain is important. Imagine that all the frogs in a pond die. The snakes that eat frogs will go hungry. At the same time, there will be too many insects, because no frogs are eating them."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iii","ev":[1,"Animals are consumers."],"ex":"The whole of paragraph B is about this idea: “Three kinds of eaters”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “Three kinds of eaters”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"i","ev":[2,"An animal that hunts is a predator, and the animal it hunts is its prey."],"ex":"The whole of paragraph C is about this idea: “Hunters and the hunted”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Hunters and the hunted”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"ii","ev":[3,"Every link in a chain is important."],"ex":"The whole of paragraph D is about this idea: “When one link disappears”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “When one link disappears”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Hunters and the hunted"],["ii","When one link disappears"],["iii","Three kinds of eaters"],["iv","How plants use water"],["v","The biggest predator on Earth"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Which animal is an example of an omnivore?","opts":["a rabbit","a cow","a bear","an owl"],"a":"C","ev":[1,"Animals such as bears, which eat both, are called omnivores."],"ex":"The passage says: “Animals such as bears, which eat both, are called omnivores.”","vi":"Trong bài: “Animals such as bears, which eat both, are called omnivores.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"The animal that a predator hunts is called its ___.","a":["prey"],"ev":[2,"An animal that hunts is a predator, and the animal it hunts is its prey."],"ex":"Find it in the passage: “An animal that hunts is a predator, and the animal it hunts is its prey.”","vi":"Tìm trong bài: “An animal that hunts is a predator, and the animal it hunts is its prey.”","hint":"Look at paragraph C."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"The Longest Wait","topic":"Animal kingdom","labeled":true,"paras":["Most birds lay their eggs in spring, but emperor penguins choose the Antarctic winter. At that time, the temperature can fall to minus 40 degrees, and the sun does not rise for weeks.","The female lays a single egg and passes it carefully to the male. If the egg stays on the ice for more than a minute or two, it will freeze. Then she leaves for the sea, which may be 100 kilometres away.","The male balances the egg on his feet and covers it with a fold of skin. For two months he eats nothing. He loses almost half of his weight.","To survive the wind, thousands of males stand in a tight group called a huddle. The penguins take turns. Those on the cold outside slowly move to the warm middle, and those in the middle move out.","The chick hatches just as the female returns, fat and full of fish. She feeds the chick, and the thin, tired male finally walks to the sea to eat."],"groups":[{"type":"para","items":[{"n":11,"q":"what happens to the male's body while he waits","a":"C","ev":[2,"He loses almost half of his weight."],"ex":"Paragraph C says: “He loses almost half of his weight.”","vi":"Đoạn C viết: “He loses almost half of his weight.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"a danger to the egg","a":"B","ev":[1,"If the egg stays on the ice for more than a minute or two, it will freeze."],"ex":"Paragraph B says: “If the egg stays on the ice for more than a minute or two, it will freeze.”","vi":"Đoạn B viết: “If the egg stays on the ice for more than a minute or two, it will freeze.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["huddle"],"ev":[3,"To survive the wind, thousands of males stand in a tight group called a huddle."],"ex":"Find it in the passage: “To survive the wind, thousands of males stand in a tight group called a huddle.”","vi":"Tìm trong bài: “To survive the wind, thousands of males stand in a tight group called a huddle.”","hint":"Look at paragraph D."},{"n":14,"a":["middle"],"ev":[3,"Those on the cold outside slowly move to the warm middle, and those in the middle move out."],"ex":"Find it in the passage: “Those on the cold outside slowly move to the warm middle, and those in the middle move out.”","vi":"Tìm trong bài: “Those on the cold outside slowly move to the warm middle, and those in the middle move out.”","hint":"Look at paragraph D."}],"text":"Thousands of males stand in a tight group called a {13}. They take turns to stand in the warm {14}.","title":"Keeping warm together","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What is unusual about emperor penguins?","opts":["They build nests of stones.","They lay many eggs at once.","They lay their eggs in the sea.","They lay their eggs in winter."],"a":"D","ev":[0,"Most birds lay their eggs in spring, but emperor penguins choose the Antarctic winter."],"ex":"The passage says: “Most birds lay their eggs in spring, but emperor penguins choose the Antarctic winter.”","vi":"Trong bài: “Most birds lay their eggs in spring, but emperor penguins choose the Antarctic winter.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s4-exam","set":4,"kind":"exam","title":"Bộ 4 · Thi","minutes":20,"passages":[{"title":"Smart Enough to Say No","topic":"Animal kingdom","labeled":false,"paras":["Training a guide dog takes almost two years and costs a great deal of money. For the first year, a puppy lives with a volunteer family and gets used to traffic, crowds and loud noises. Then a professional trainer teaches it to guide a person along streets, around obstacles and across roads.","The hardest lesson is to disobey. Imagine that a blind person tells the dog to go forward, but a car is coming. A good guide dog refuses to move. It must decide by itself that the command is dangerous. Trainers say this is what makes guide dogs so special.","A guide dog usually works for eight to ten years. When it becomes old and slow, it retires. Many retired dogs stay with their owner as a pet, while a new young dog takes over the job.","If you meet a guide dog in its harness, remember that it is working. Do not call it or touch it. Ask the owner first."],"groups":[{"type":"tfng","items":[{"n":1,"q":"A guide dog sometimes has to refuse a command.","a":"T","ev":[1,"A good guide dog refuses to move."],"ex":"The passage says the same thing in different words. The passage says: “A good guide dog refuses to move.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “A good guide dog refuses to move.”","hint":"Look at paragraph 2."},{"n":2,"q":"A retired guide dog always goes to live with a new family.","a":"F","ev":[2,"Many retired dogs stay with their owner as a pet, while a new young dog takes over the job."],"ex":"The passage says something different. The passage says: “Many retired dogs stay with their owner as a pet, while a new young dog takes over the job.”","vi":"Bài nói khác với câu này. Trong bài: “Many retired dogs stay with their owner as a pet, while a new young dog takes over the job.”","hint":"Look at paragraph 3."},{"n":3,"q":"Guide dogs can understand the colours of traffic lights.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage talks about cars and roads, but never about traffic lights.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài có nói về xe và đường, nhưng không nhắc tới đèn giao thông.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"In its first year, a puppy lives with a ___ family.","a":["volunteer"],"ev":[0,"For the first year, a puppy lives with a volunteer family and gets used to traffic, crowds and loud noises."],"ex":"Find it in the passage: “For the first year, a puppy lives with a volunteer family and gets used to traffic, crowds and loud noises.”","vi":"Tìm trong bài: “For the first year, a puppy lives with a volunteer family and gets used to traffic, crowds and loud noises.”","hint":"Look at paragraph 1."},{"n":5,"q":"Before you touch a guide dog, you should ask the ___.","a":["owner"],"ev":[3,"Ask the owner first."],"ex":"Find it in the passage: “Ask the owner first.”","vi":"Tìm trong bài: “Ask the owner first.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"More Than a Chain","topic":"Science · Food chains","labeled":true,"paras":["A food chain is a simple picture of how energy moves through nature. Green plants catch the energy of sunlight and store it as food. A caterpillar eats a leaf, a small bird eats the caterpillar, and a hawk eats the small bird. At each step, some of the energy is passed on.","In real life, things are more complicated. A hawk does not eat only small birds; it also catches mice and lizards. Mice eat seeds, but they eat insects too. When we join many food chains together, we get a food web.","At the end of every chain, there is one more group that people often forget: the decomposers. Worms, fungi and tiny living things called bacteria break down dead plants and animals and return their goodness to the soil. Without them, the ground would be covered with dead leaves.","People can damage food chains without meaning to. When farmers kill insects with chemicals, the birds that eat those insects lose their food. If the birds disappear, the animals that hunt them suffer too. A small change at the bottom can travel all the way to the top."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iv","ev":[1,"In real life, things are more complicated."],"ex":"The whole of paragraph B is about this idea: “From chains to webs”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “From chains to webs”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iii","ev":[2,"At the end of every chain, there is one more group that people often forget: the decomposers."],"ex":"The whole of paragraph C is about this idea: “Nature's cleaners”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Nature's cleaners”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"People can damage food chains without meaning to."],"ex":"The whole of paragraph D is about this idea: “How humans can break the chain”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “How humans can break the chain”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Why hawks hunt in the day"],["ii","How plants store water"],["iii","Nature's cleaners"],["iv","From chains to webs"],["v","How humans can break the chain"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What do decomposers do?","opts":["They catch the energy of sunlight.","They break down dead plants and animals.","They kill insects with chemicals.","They hunt small birds."],"a":"B","ev":[2,"Worms, fungi and tiny living things called bacteria break down dead plants and animals and return their goodness to the soil."],"ex":"The passage says: “Worms, fungi and tiny living things called bacteria break down dead plants and animals and return their goodness to the soil.”","vi":"Trong bài: “Worms, fungi and tiny living things called bacteria break down dead plants and animals and return their goodness to the soil.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Many food chains joined together make a food ___.","a":["web"],"ev":[1,"When we join many food chains together, we get a food web."],"ex":"Find it in the passage: “When we join many food chains together, we get a food web.”","vi":"Tìm trong bài: “When we join many food chains together, we get a food web.”","hint":"Look at paragraph B."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Emperors of the Ice","topic":"Animal kingdom","labeled":true,"paras":["The emperor penguin is a bird that cannot fly, yet it is one of the best divers in the animal world. It can dive deeper than 500 metres and stay under water for more than twenty minutes, hunting fish in the dark.","On land, life is harder. Emperors breed on the sea ice in the middle of the Antarctic winter. After the female lays her egg, she passes it to the male and returns to the sea to feed. He will not see her again for about two months.","During that time, the male stands in the freezing wind with the egg on his feet. He has no nest and no food. His only protection is his thick feathers, a layer of fat and the other males around him.","The males press together in a huddle of several thousand birds. Inside, it is much warmer than outside. Each bird moves a few centimetres at a time, so that everyone gets a turn in the middle. No penguin tries to keep the best place.","Scientists are worried about the emperors' future. The birds need solid sea ice for most of the year. As the oceans get warmer, the ice is breaking up earlier, sometimes before the chicks have grown their waterproof feathers."],"groups":[{"type":"para","items":[{"n":11,"q":"the things that protect a male from the cold","a":"C","ev":[2,"His only protection is his thick feathers, a layer of fat and the other males around him."],"ex":"Paragraph C says: “His only protection is his thick feathers, a layer of fat and the other males around him.”","vi":"Đoạn C viết: “His only protection is his thick feathers, a layer of fat and the other males around him.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"the penguin's skill in the water","a":"A","ev":[0,"The emperor penguin is a bird that cannot fly, yet it is one of the best divers in the animal world."],"ex":"Paragraph A says: “The emperor penguin is a bird that cannot fly, yet it is one of the best divers in the animal world.”","vi":"Đoạn A viết: “The emperor penguin is a bird that cannot fly, yet it is one of the best divers in the animal world.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["oceans"],"ev":[4,"As the oceans get warmer, the ice is breaking up earlier, sometimes before the chicks have grown their waterproof feathers."],"ex":"Find it in the passage: “As the oceans get warmer, the ice is breaking up earlier, sometimes before the chicks have grown their waterproof feathers.”","vi":"Tìm trong bài: “As the oceans get warmer, the ice is breaking up earlier, sometimes before the chicks have grown their waterproof feathers.”","hint":"Look at paragraph E."},{"n":14,"a":["chicks"],"ev":[4,"As the oceans get warmer, the ice is breaking up earlier, sometimes before the chicks have grown their waterproof feathers."],"ex":"Find it in the passage: “As the oceans get warmer, the ice is breaking up earlier, sometimes before the chicks have grown their waterproof feathers.”","vi":"Tìm trong bài: “As the oceans get warmer, the ice is breaking up earlier, sometimes before the chicks have grown their waterproof feathers.”","hint":"Look at paragraph E."}],"text":"Emperor penguins need solid sea ice for most of the year. Because the {13} are getting warmer, the ice breaks up early, before the {14} have their waterproof feathers.","title":"A worrying future","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"How do the penguins in a huddle behave?","opts":["They take turns to go fishing.","They share the warm places.","They fight for the middle.","They stand completely still."],"a":"B","ev":[3,"Each bird moves a few centimetres at a time, so that everyone gets a turn in the middle."],"ex":"The passage says: “Each bird moves a few centimetres at a time, so that everyone gets a turn in the middle.”","vi":"Trong bài: “Each bird moves a few centimetres at a time, so that everyone gets a turn in the middle.”","hint":"Look at paragraph D."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s5-try","set":5,"kind":"try","title":"Bộ 5 · Thử","minutes":20,"passages":[{"title":"Earthquake Practice","topic":"Places","labeled":false,"paras":["Yuki is nine years old. She lives in Japan, a country with many earthquakes. In an earthquake, the ground shakes, and things can fall down.","At Yuki's school, the children practise for earthquakes every month. When the bell rings, they stop their work. They get under their desks and hold the legs of the desk.","Then the teacher says, \"Line up!\" The children put on soft hats to protect their heads. They walk to the playground. Nobody runs, and nobody talks.","In the playground, the teacher counts the children. Yuki is not afraid of earthquakes now, because she knows what to do."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Japan has a lot of earthquakes.","a":"T","ev":[0,"She lives in Japan, a country with many earthquakes."],"ex":"The passage says the same thing in different words. The passage says: “She lives in Japan, a country with many earthquakes.”","vi":"B
