s at home, because they expected them to float.”","vi":"Tìm trong bài: “Some say they kept dropping cups at home, because they expected them to float.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"Why We Have Seasons","topic":"Science · Earth and space","labeled":true,"paras":["The Earth spins like a top, and it is tilted to one side. This tilt is the reason for the seasons. When the northern half of the Earth leans towards the Sun, it has summer, and the southern half has winter. Six months later, it is the other way round.","Many people think that summer comes when the Earth is closer to the Sun. This is wrong. In fact, the Earth is closest to the Sun in January, when the north has winter.","Near the Equator, the tilt makes little difference. The Sun is high all year, so countries there do not have four seasons. Instead, they often have a dry season and a rainy season.","Near the North and South Poles, the difference is extreme. In summer, the Sun does not set for weeks, and people can read outside at midnight. In winter, it does not rise at all, and the stars shine at midday."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"iii","ev":[1,"Many people think that summer comes when the Earth is closer to the Sun."],"ex":"The whole of paragraph B is about this idea: “A common mistake about summer”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “A common mistake about summer”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"v","ev":[2,"Near the Equator, the tilt makes little difference."],"ex":"The whole of paragraph C is about this idea: “Places without four seasons”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Places without four seasons”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"i","ev":[3,"Near the North and South Poles, the difference is extreme."],"ex":"The whole of paragraph D is about this idea: “Months of light and months of darkness”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Months of light and months of darkness”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","Months of light and months of darkness"],["ii","The hottest country in the world"],["iii","A common mistake about summer"],["iv","Why the Earth spins"],["v","Places without four seasons"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What causes the seasons?","opts":["the speed of the Earth","the distance from the Sun","the tilt of the Earth","the light of the Moon"],"a":"C","ev":[0,"This tilt is the reason for the seasons."],"ex":"The passage says: “This tilt is the reason for the seasons.”","vi":"Trong bài: “This tilt is the reason for the seasons.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Countries near the Equator often have a dry season and a ___ season.","a":["rainy"],"ev":[2,"Instead, they often have a dry season and a rainy season."],"ex":"Find it in the passage: “Instead, they often have a dry season and a rainy season.”","vi":"Tìm trong bài: “Instead, they often have a dry season and a rainy season.”","hint":"Look at paragraph C."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Footprints That Never Fade","topic":"Talking about people","labeled":true,"paras":["In 1961, the American president promised to send a person to the Moon before the end of the 1960s. At that time, no American had even flown around the Earth. Many people thought the plan was impossible.","About 400,000 people worked on the project, from engineers to the women who sewed the spacesuits by hand. The computer that guided the spacecraft was far less powerful than a phone today.","On 20 July 1969, the plan succeeded. Neil Armstrong and Buzz Aldrin landed in a flat area called the Sea of Tranquillity, which has no water at all. The dust under their boots was as fine as flour, and their footprints are still there today, because the Moon has no wind or rain to remove them.","The astronauts left mirrors on the surface. Scientists still shine lasers at them from Earth to measure the distance to the Moon exactly. They have learned that the Moon is moving away from us by almost four centimetres a year.","Twelve people walked on the Moon between 1969 and 1972. Then the visits stopped, mainly because they cost too much. Now several countries are planning to return, and this time they hope to stay longer."],"groups":[{"type":"para","items":[{"n":11,"q":"equipment that scientists still use today","a":"D","ev":[3,"The astronauts left mirrors on the surface."],"ex":"Paragraph D says: “The astronauts left mirrors on the surface.”","vi":"Đoạn D viết: “The astronauts left mirrors on the surface.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"the reason why visits to the Moon ended","a":"E","ev":[4,"Then the visits stopped, mainly because they cost too much."],"ex":"Paragraph E says: “Then the visits stopped, mainly because they cost too much.”","vi":"Đoạn E viết: “Then the visits stopped, mainly because they cost too much.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["flour"],"ev":[2,"The dust under their boots was as fine as flour, and their footprints are still there today, because the Moon has no wind or rain to remove them."],"ex":"Find it in the passage: “The dust under their boots was as fine as flour, and their footprints are still there today, because the Moon has no wind or rain to remove them.”","vi":"Tìm trong bài: “The dust under their boots was as fine as flour, and their footprints are still there today, because the Moon has no wind or rain to remove them.”","hint":"Look at paragraph C."},{"n":14,"a":["wind"],"ev":[2,"The dust under their boots was as fine as flour, and their footprints are still there today, because the Moon has no wind or rain to remove them."],"ex":"Find it in the passage: “The dust under their boots was as fine as flour, and their footprints are still there today, because the Moon has no wind or rain to remove them.”","vi":"Tìm trong bài: “The dust under their boots was as fine as flour, and their footprints are still there today, because the Moon has no wind or rain to remove them.”","hint":"Look at paragraph C."}],"text":"The dust on the Moon was as fine as {13}. The footprints are still there because the Moon has no {14} or rain to remove them.","title":"Footprints","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What does the writer say about the Sea of Tranquillity?","opts":["It contains no water.","It is the deepest place on the Moon.","It is full of big rocks.","It was named by Armstrong."],"a":"A","ev":[2,"Neil Armstrong and Buzz Aldrin landed in a flat area called the Sea of Tranquillity, which has no water at all."],"ex":"The passage says: “Neil Armstrong and Buzz Aldrin landed in a flat area called the Sea of Tranquillity, which has no water at all.”","vi":"Trong bài: “Neil Armstrong and Buzz Aldrin landed in a flat area called the Sea of Tranquillity, which has no water at all.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s10-try","set":10,"kind":"try","title":"Bộ 10 · Thử","minutes":20,"passages":[{"title":"The Lion and the Mouse","topic":"Great stories","labeled":false,"paras":["One hot afternoon, a lion was sleeping under a tree. A little mouse ran over his nose and woke him up.","The lion was angry. He caught the mouse with his big paw. \"Please let me go!\" said the mouse. \"One day I will help you.\" The lion laughed. How could a tiny mouse help the king of the animals? But he was not hungry, so he let her go.","A few days later, some hunters caught the lion in a net made of rope. The lion roared, but he could not get out.","The mouse heard him and came quickly. She bit the ropes with her sharp teeth, one by one. Soon the lion was free.","\"You were right,\" said the lion. \"Even a small friend can be a great friend.\""],"groups":[{"type":"tfng","items":[{"n":1,"q":"The lion woke the mouse up.","a":"F","ev":[0,"A little mouse ran over his nose and woke him up."],"ex":"The passage says something different. The passage says: “A little mouse ran over his nose and woke him up.”","vi":"Bài nói khác với câu này. Trong bài: “A little mouse ran over his nose and woke him up.”","hint":"Look at paragraph 1."},{"n":2,"q":"The lion did not believe that the mouse could help him.","a":"T","ev":[1,"How could a tiny mouse help the king of the animals?"],"ex":"The passage says the same thing in different words. The passage says: “How could a tiny mouse help the king of the animals?”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “How could a tiny mouse help the king of the animals?”","hint":"Look at paragraph 2."},{"n":3,"q":"The hunters came back for the lion the next morning.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage does not say when the hunters came back, or if they came back at all.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài không nói thợ săn quay lại lúc nào, hay có quay lại không.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"Some hunters caught the lion in a ___ made of rope.","a":["net"],"ev":[2,"A few days later, some hunters caught the lion in a net made of rope."],"ex":"Find it in the passage: “A few days later, some hunters caught the lion in a net made of rope.”","vi":"Tìm trong bài: “A few days later, some hunters caught the lion in a net made of rope.”","hint":"Look at paragraph 3."},{"n":5,"q":"The mouse bit the ropes with her sharp ___.","a":["teeth"],"ev":[3,"She bit the ropes with her sharp teeth, one by one."],"ex":"Find it in the passage: “She bit the ropes with her sharp teeth, one by one.”","vi":"Tìm trong bài: “She bit the ropes with her sharp teeth, one by one.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"What Is Sound?","topic":"Science · Sound","labeled":true,"paras":["Sounds are all around us. Birds sing, dogs bark and cars make noise. But what is a sound?","A sound starts when something shakes very fast. These fast movements are called vibrations. Put your fingers on your neck and say your name. You can feel the vibrations.","The vibrations travel through the air to your ears. Inside your ear, there is a thin piece of skin called the eardrum. The sound makes it shake, and then you can hear.","Some sounds are loud, and some are quiet. If you hit a drum hard, the vibrations are big and the sound is loud. If you hit it gently, the sound is quiet."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"v","ev":[1,"A sound starts when something shakes very fast."],"ex":"The whole of paragraph B is about this idea: “How a sound begins”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “How a sound begins”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"i","ev":[2,"The vibrations travel through the air to your ears."],"ex":"The whole of paragraph C is about this idea: “How sound reaches us”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “How sound reaches us”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"iv","ev":[3,"Some sounds are loud, and some are quiet."],"ex":"The whole of paragraph D is about this idea: “Loud and quiet sounds”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Loud and quiet sounds”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","How sound reaches us"],["ii","How to play the drum"],["iii","Animals with big ears"],["iv","Loud and quiet sounds"],["v","How a sound begins"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"Where is the eardrum?","opts":["inside your ear","in your neck","on your fingers","in the air"],"a":"A","ev":[2,"Inside your ear, there is a thin piece of skin called the eardrum."],"ex":"The passage says: “Inside your ear, there is a thin piece of skin called the eardrum.”","vi":"Trong bài: “Inside your ear, there is a thin piece of skin called the eardrum.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"A sound starts with fast movements called ___.","a":["vibrations"],"ev":[1,"These fast movements are called vibrations."],"ex":"Find it in the passage: “These fast movements are called vibrations.”","vi":"Tìm trong bài: “These fast movements are called vibrations.”","hint":"Look at paragraph B."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"The Great Pyramid","topic":"Ancient Egypt","labeled":true,"paras":["The pyramids are in Egypt, near the city of Cairo. They are very, very old. The biggest one is called the Great Pyramid. It is about 4,500 years old.","The Great Pyramid was built for a king. In ancient Egypt, a king was called a pharaoh. When the pharaoh died, his body was put inside the pyramid, with gold and other treasures.","The pyramid is made of more than two million blocks of stone. Each block is as heavy as a car. The workers had no machines. They pulled the blocks with ropes.","It took about twenty years to finish the pyramid. Today, millions of visitors come to see it every year."],"groups":[{"type":"para","items":[{"n":11,"q":"what was put inside the pyramid","a":"B","ev":[1,"When the pharaoh died, his body was put inside the pyramid, with gold and other treasures."],"ex":"Paragraph B says: “When the pharaoh died, his body was put inside the pyramid, with gold and other treasures.”","vi":"Đoạn B viết: “When the pharaoh died, his body was put inside the pyramid, with gold and other treasures.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"how long the building work took","a":"D","ev":[3,"It took about twenty years to finish the pyramid."],"ex":"Paragraph D says: “It took about twenty years to finish the pyramid.”","vi":"Đoạn D viết: “It took about twenty years to finish the pyramid.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCD","instr":"The passage has four paragraphs, <b>A–D<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–D<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["stone"],"ev":[2,"The pyramid is made of more than two million blocks of stone."],"ex":"Find it in the passage: “The pyramid is made of more than two million blocks of stone.”","vi":"Tìm trong bài: “The pyramid is made of more than two million blocks of stone.”","hint":"Look at paragraph C."},{"n":14,"a":["ropes"],"ev":[2,"They pulled the blocks with ropes."],"ex":"Find it in the passage: “They pulled the blocks with ropes.”","vi":"Tìm trong bài: “They pulled the blocks with ropes.”","hint":"Look at paragraph C."}],"text":"The pyramid is made of more than two million blocks of {13}. The workers pulled the blocks with {14}.","title":"Building the pyramid","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"What was a pharaoh?","opts":["a block of stone","a city","a worker","a king of ancient Egypt"],"a":"D","ev":[1,"In ancient Egypt, a king was called a pharaoh."],"ex":"The passage says: “In ancient Egypt, a king was called a pharaoh.”","vi":"Trong bài: “In ancient Egypt, a king was called a pharaoh.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s10-practice","set":10,"kind":"practice","title":"Bộ 10 · Luyện tập","minutes":20,"passages":[{"title":"The Mouse's Story","topic":"Great stories","labeled":false,"paras":["My name is Mina, and I am a mouse. Let me tell you how I saved a lion.","It began with a mistake. I was looking for seeds, and I did not see the lion in the long grass. I ran straight over his nose! He caught me by the tail and opened his enormous mouth.","I was shaking, but I spoke politely. I promised to help him one day if he let me live. He thought this was the funniest thing he had ever heard. He laughed so much that he dropped me.","A week later, I heard a terrible roar. Hunters had caught the lion in a net and had gone to fetch a cart. I did not have much time. I chewed through the thickest rope first, and the net fell open.","The lion did not laugh this time. He bowed his head and said, \"Thank you.\" Since then, nobody in the forest has called me small."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Mina ran over the lion by accident.","a":"T","ev":[1,"It began with a mistake."],"ex":"The passage says the same thing in different words. The passage says: “It began with a mistake.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “It began with a mistake.”","hint":"Look at paragraph 2."},{"n":2,"q":"The lion caught Mina by the ear.","a":"F","ev":[1,"He caught me by the tail and opened his enormous mouth."],"ex":"The passage says something different. The passage says: “He caught me by the tail and opened his enormous mouth.”","vi":"Bài nói khác với câu này. Trong bài: “He caught me by the tail and opened his enormous mouth.”","hint":"Look at paragraph 2."},{"n":3,"q":"Mina had saved other animals before.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. Mina only tells the story of the lion. We do not know about other animals.","vi":"Bài không nhắc tới điều này nên không thể biết. Mina chỉ kể chuyện cứu sư tử. Ta không biết về các con vật khác.","hint":"Read the whole passage again. Is this information really there?"}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"When she met the lion, Mina was looking for ___.","a":["seeds"],"ev":[1,"I was looking for seeds, and I did not see the lion in the long grass."],"ex":"Find it in the passage: “I was looking for seeds, and I did not see the lion in the long grass.”","vi":"Tìm trong bài: “I was looking for seeds, and I did not see the lion in the long grass.”","hint":"Look at paragraph 2."},{"n":5,"q":"The hunters had gone to fetch a ___.","a":["cart"],"ev":[3,"Hunters had caught the lion in a net and had gone to fetch a cart."],"ex":"Find it in the passage: “Hunters had caught the lion in a net and had gone to fetch a cart.”","vi":"Tìm trong bài: “Hunters had caught the lion in a net and had gone to fetch a cart.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"How Sound Travels","topic":"Science · Sound","labeled":true,"paras":["Sound needs something to travel through. Usually this is air, but sound can also travel through water and through solid things like wood and metal. In fact, it travels faster through water than through air.","In space, there is no air, so there is no sound. If a rocket exploded next to an astronaut in space, the astronaut would see it but hear nothing.","Sound is fast, but light is much faster. This is why, in a storm, you see the lightning first and hear the thunder later. If you count the seconds between them, you can tell how far away the storm is. Three seconds means about one kilometre.","When sound hits a hard wall, it bounces back, like a ball. The sound that returns is called an echo. You can hear echoes in caves, in tunnels and between tall buildings."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"ii","ev":[1,"In space, there is no air, so there is no sound."],"ex":"The whole of paragraph B is about this idea: “The silence of space”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “The silence of space”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iv","ev":[2,"Sound is fast, but light is much faster."],"ex":"The whole of paragraph C is about this idea: “Why thunder comes after lightning”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Why thunder comes after lightning”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"When sound hits a hard wall, it bounces back, like a ball."],"ex":"The whole of paragraph D is about this idea: “Sounds that come back”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Sounds that come back”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","How rockets are built"],["ii","The silence of space"],["iii","The loudest animal in the sea"],["iv","Why thunder comes after lightning"],["v","Sounds that come back"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"How fast does sound travel through water?","opts":["It cannot travel through water.","faster than through air","as fast as light","slower than through air"],"a":"B","ev":[0,"In fact, it travels faster through water than through air."],"ex":"The passage says: “In fact, it travels faster through water than through air.”","vi":"Trong bài: “In fact, it travels faster through water than through air.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"The sound that returns from a hard wall is called an ___.","a":["echo"],"ev":[3,"The sound that returns is called an echo."],"ex":"Find it in the passage: “The sound that returns is called an echo.”","vi":"Tìm trong bài: “The sound that returns is called an echo.”","hint":"Look at paragraph D."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Who Built the Pyramid?","topic":"Ancient Egypt","labeled":true,"paras":["The Great Pyramid of Giza was built about 4,500 years ago as a tomb for the pharaoh Khufu. The Egyptians believed in life after death, so they filled the tombs of their kings with food, furniture and treasure for the next world.","The pyramid contains about 2.3 million stone blocks. When it was new, it was 146 metres high. It was the tallest building in the world for almost 4,000 years.","How did people move such heavy stones without machines? A painting in an old tomb gives an answer. It shows workers pulling a statue on a wooden sledge, while a man pours water on the sand in front of it. Wet sand is harder, so the sledge slides more easily.","For a long time, people thought that slaves built the pyramids. Then, in 1990, the tombs of the workers were found near the pyramid. They showed that the builders were free Egyptians. They were paid with bread and meat and were buried with respect.","Robbers emptied the pyramid thousands of years ago. When explorers finally entered the king's room, they found only an empty stone box."],"groups":[{"type":"para","items":[{"n":11,"q":"a wrong idea about the builders","a":"D","ev":[3,"For a long time, people thought that slaves built the pyramids."],"ex":"Paragraph D says: “For a long time, people thought that slaves built the pyramids.”","vi":"Đoạn D viết: “For a long time, people thought that slaves built the pyramids.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"what explorers found in the king's room","a":"E","ev":[4,"When explorers finally entered the king's room, they found only an empty stone box."],"ex":"Paragraph E says: “When explorers finally entered the king's room, they found only an empty stone box.”","vi":"Đoạn E viết: “When explorers finally entered the king's room, they found only an empty stone box.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["sledge"],"ev":[2,"It shows workers pulling a statue on a wooden sledge, while a man pours water on the sand in front of it."],"ex":"Find it in the passage: “It shows workers pulling a statue on a wooden sledge, while a man pours water on the sand in front of it.”","vi":"Tìm trong bài: “It shows workers pulling a statue on a wooden sledge, while a man pours water on the sand in front of it.”","hint":"Look at paragraph C."},{"n":14,"a":["water"],"ev":[2,"It shows workers pulling a statue on a wooden sledge, while a man pours water on the sand in front of it."],"ex":"Find it in the passage: “It shows workers pulling a statue on a wooden sledge, while a man pours water on the sand in front of it.”","vi":"Tìm trong bài: “It shows workers pulling a statue on a wooden sledge, while a man pours water on the sand in front of it.”","hint":"Look at paragraph C."}],"text":"Workers pulled heavy things on a wooden {13}. A man poured {14} on the sand in front of it.","title":"Moving the stones","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Why did the Egyptians put food and furniture in the tombs of their kings?","opts":["They believed in life after death.","They wanted to hide them from robbers.","The workers needed them.","They had too many things."],"a":"A","ev":[0,"The Egyptians believed in life after death, so they filled the tombs of their kings with food, furniture and treasure for the next world."],"ex":"The passage says: “The Egyptians believed in life after death, so they filled the tombs of their kings with food, furniture and treasure for the next world.”","vi":"Trong bài: “The Egyptians believed in life after death, so they filled the tombs of their kings with food, furniture and treasure for the next world.”","hint":"Look at paragraph A."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]},{"id":"s10-exam","set":10,"kind":"exam","title":"Bộ 10 · Thi","minutes":20,"passages":[{"title":"Small Stories, Big Lessons","topic":"Great stories","labeled":false,"paras":["About 2,600 years ago, a storyteller called Aesop lived in ancient Greece. We know very little about his life. Many writers believed that he was a slave who won his freedom because he was so clever.","Aesop's stories are called fables. A fable is very short, and its characters are usually animals that talk and behave like people. At the end, there is a lesson, called a moral.","One of the best-known fables is \"The Lion and the Mouse\". A lion catches a mouse but lets it go. Later, hunters trap the lion in a net, and the mouse bites through the ropes to free him. The moral is that no act of kindness is ever wasted, and that the weak can help the strong.","Aesop probably never wrote his fables down. People told them to each other for hundreds of years before anyone collected them in a book. That is why there are often several versions of the same fable.","Why do we still read them today? Perhaps because it is easier to see our own mistakes when a fox or a crow makes them."],"groups":[{"type":"tfng","items":[{"n":1,"q":"Aesop was born on a Greek island.","a":"NG","ev":null,"ex":"The passage does not tell us this, so we cannot know. The passage says Aesop lived in ancient Greece, but not exactly where he was born.","vi":"Bài không nhắc tới điều này nên không thể biết. Bài nói Aesop sống ở Hy Lạp cổ đại, nhưng không nói chính xác ông sinh ra ở đâu.","hint":"Read the whole passage again. Is this information really there?"},{"n":2,"q":"The characters in fables act like humans.","a":"T","ev":[1,"A fable is very short, and its characters are usually animals that talk and behave like people."],"ex":"The passage says the same thing in different words. The passage says: “A fable is very short, and its characters are usually animals that talk and behave like people.”","vi":"Bài nói cùng ý này bằng từ ngữ khác. Trong bài: “A fable is very short, and its characters are usually animals that talk and behave like people.”","hint":"Look at paragraph 2."},{"n":3,"q":"Aesop wrote his fables in a book.","a":"F","ev":[3,"Aesop probably never wrote his fables down."],"ex":"The passage says something different. The passage says: “Aesop probably never wrote his fables down.”","vi":"Bài nói khác với câu này. Trong bài: “Aesop probably never wrote his fables down.”","hint":"Look at paragraph 4."}],"instr":"Do the following statements agree with the information in the passage? Choose<br><b>TRUE<\/b> if the statement agrees with the information,<br><b>FALSE<\/b> if the statement contradicts the information,<br><b>NOT GIVEN<\/b> if there is no information on this.","range":"Questions 1–3"},{"type":"gap","items":[{"n":4,"q":"The lesson at the end of a fable is called a ___.","a":["moral"],"ev":[1,"At the end, there is a lesson, called a moral."],"ex":"Find it in the passage: “At the end, there is a lesson, called a moral.”","vi":"Tìm trong bài: “At the end, there is a lesson, called a moral.”","hint":"Look at paragraph 2."},{"n":5,"q":"There are often several ___ of the same fable.","a":["versions"],"ev":[3,"That is why there are often several versions of the same fable."],"ex":"Find it in the passage: “That is why there are often several versions of the same fable.”","vi":"Tìm trong bài: “That is why there are often several versions of the same fable.”","hint":"Look at paragraph 4."}],"instr":"Complete the sentences below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 4–5"}]},{"title":"High Notes and Hidden Sounds","topic":"Science · Sound","labeled":true,"paras":["Stretch a rubber band and pull it: it shakes and hums. Every sound begins like this, with a vibration. The vibration pushes the air next to it, that air pushes the air beyond, and so the sound moves outwards as a wave, like the rings around a stone thrown into a pond.","How high or low a sound is, is called its pitch. Pitch depends on the speed of the vibration. A short, tight string vibrates quickly and gives a high note. A long, loose string vibrates slowly and gives a low one. This is why a violin sounds higher than a big double bass.","Some animals hear sounds that we cannot. Dogs hear notes that are too high for human ears. Elephants talk to each other with sounds too low for us to hear, and these can travel for several kilometres.","Bats and dolphins use sound to \"see\". They send out short, high sounds and listen for the echoes. From the echoes, a bat can find an insect in complete darkness. People have copied this idea: ships use echoes to measure the depth of the sea."],"groups":[{"type":"heading","items":[{"n":6,"q":"Paragraph B","a":"ii","ev":[1,"How high or low a sound is, is called its pitch."],"ex":"The whole of paragraph B is about this idea: “High notes and low notes”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn B nói về ý: “High notes and low notes”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph B again. What is the whole paragraph about?"},{"n":7,"q":"Paragraph C","a":"iii","ev":[2,"Some animals hear sounds that we cannot."],"ex":"The whole of paragraph C is about this idea: “Sounds beyond human hearing”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn C nói về ý: “Sounds beyond human hearing”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph C again. What is the whole paragraph about?"},{"n":8,"q":"Paragraph D","a":"v","ev":[3,"Bats and dolphins use sound to \"see\"."],"ex":"The whole of paragraph D is about this idea: “Finding things with echoes”. A heading must fit the whole paragraph, not just one detail.","vi":"Cả đoạn D nói về ý: “Finding things with echoes”. Tiêu đề phải đúng với cả đoạn, không chỉ một chi tiết.","hint":"Read the first sentence of paragraph D again. What is the whole paragraph about?"}],"headings":[["i","The history of the violin"],["ii","High notes and low notes"],["iii","Sounds beyond human hearing"],["iv","How rubber bands are made"],["v","Finding things with echoes"]],"instr":"The passage has four paragraphs, <b>A–D<\/b>. Choose the correct heading for paragraphs <b>B<\/b>, <b>C<\/b> and <b>D<\/b> from the list of headings below. There are more headings than paragraphs, so you will not use them all.","range":"Questions 6–8"},{"type":"mcq","items":[{"n":9,"q":"What kind of string gives a high note?","opts":["a thick, heavy one","a wet one","a long, loose one","a short, tight one"],"a":"D","ev":[1,"A short, tight string vibrates quickly and gives a high note."],"ex":"The passage says: “A short, tight string vibrates quickly and gives a high note.”","vi":"Trong bài: “A short, tight string vibrates quickly and gives a high note.”","hint":"Look at paragraph B."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 9"},{"type":"gap","items":[{"n":10,"q":"Ships use echoes to measure the ___ of the sea.","a":["depth"],"ev":[3,"People have copied this idea: ships use echoes to measure the depth of the sea."],"ex":"Find it in the passage: “People have copied this idea: ships use echoes to measure the depth of the sea.”","vi":"Tìm trong bài: “People have copied this idea: ships use echoes to measure the depth of the sea.”","hint":"Look at paragraph D."}],"instr":"Complete the sentence below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Question 10"}]},{"title":"Secrets of the Great Pyramid","topic":"Ancient Egypt","labeled":true,"paras":["The Great Pyramid is the only one of the Seven Wonders of the Ancient World that still stands. It was already more than 2,000 years old when the Romans came to Egypt as tourists and wrote their names on its stones.","Its builders were amazingly exact. The four sides at the bottom are almost exactly the same length; the difference is only a few centimetres over 230 metres. The sides also point almost perfectly north, south, east and west, although the Egyptians had no compass. They probably used the stars.","The stones came from different places. Most were cut near the pyramid, but the white stone for the outside travelled by boat along the Nile, and the hard granite for the king's room came from Aswan, 800 kilometres to the south.","In 2013, archaeologists found the diary of a man named Merer, who led a team of forty boatmen. It is the oldest papyrus with writing ever found in Egypt. Merer describes carrying white stone to Giza. Thanks to him, we can read about the work in the words of someone who was there.","The smooth white outside has gone now; later rulers took the stones to build Cairo. But in Khufu's time, the pyramid shone brightly in the sun, and people could see it from far across the desert."],"groups":[{"type":"para","items":[{"n":11,"q":"a written record by someone who worked on the pyramid","a":"D","ev":[3,"In 2013, archaeologists found the diary of a man named Merer, who led a team of forty boatmen."],"ex":"Paragraph D says: “In 2013, archaeologists found the diary of a man named Merer, who led a team of forty boatmen.”","vi":"Đoạn D viết: “In 2013, archaeologists found the diary of a man named Merer, who led a team of forty boatmen.”","hint":"This question is not in order. Check each paragraph for this idea."},{"n":12,"q":"what happened to the outside of the pyramid","a":"E","ev":[4,"The smooth white outside has gone now; later rulers took the stones to build Cairo."],"ex":"Paragraph E says: “The smooth white outside has gone now; later rulers took the stones to build Cairo.”","vi":"Đoạn E viết: “The smooth white outside has gone now; later rulers took the stones to build Cairo.”","hint":"This question is not in order. Check each paragraph for this idea."}],"letters":"ABCDE","instr":"The passage has five paragraphs, <b>A–E<\/b>. Which paragraph contains the following information? Choose the correct letter, <b>A–E<\/b>.","range":"Questions 11–12"},{"type":"summary","items":[{"n":13,"a":["compass"],"ev":[1,"The sides also point almost perfectly north, south, east and west, although the Egyptians had no compass."],"ex":"Find it in the passage: “The sides also point almost perfectly north, south, east and west, although the Egyptians had no compass.”","vi":"Tìm trong bài: “The sides also point almost perfectly north, south, east and west, although the Egyptians had no compass.”","hint":"Look at paragraph B."},{"n":14,"a":["stars"],"ev":[1,"They probably used the stars."],"ex":"Find it in the passage: “They probably used the stars.”","vi":"Tìm trong bài: “They probably used the stars.”","hint":"Look at paragraph B."}],"text":"The sides of the pyramid point almost perfectly north, south, east and west. The Egyptians had no {13}, so they probably used the {14}.","title":"Exact builders","instr":"Complete the summary below. Write <b>ONE WORD ONLY<\/b> from the passage for each answer.","range":"Questions 13–14"},{"type":"mcq","items":[{"n":15,"q":"Where did the granite for the king's room come from?","opts":["from Cairo","from Aswan, far to the south","from Rome","from near the pyramid"],"a":"B","ev":[2,"Most were cut near the pyramid, but the white stone for the outside travelled by boat along the Nile, and the hard granite for the king's room came from Aswan, 800 kilometres to the south."],"ex":"The passage says: “Most were cut near the pyramid, but the white stone for the outside travelled by boat along the Nile, and the hard granite for the king's room came from Aswan, 800 kilometres to the south.”","vi":"Trong bài: “Most were cut near the pyramid, but the white stone for the outside travelled by boat along the Nile, and the hard granite for the king's room came from Aswan, 800 kilometres to the south.”","hint":"Look at paragraph C."}],"instr":"Choose the correct letter, <b>A<\/b>, <b>B<\/b>, <b>C<\/b> or <b>D<\/b>.","range":"Question 15"}]}]}];

var PW='Easy@2026', LS='xuxu-ielts-reading-v2';

/* ===================== STATE ===================== */
var S={v:1,rewarded:0,tests:{},updatedAt:0};
function migrate(o){ if(o.tests&&o.tests.t1){ if(!o.tests['s1-exam']) o.tests['s1-exam']=o.tests.t1; delete o.tests.t1; if(o.tests['s1-exam'].first&&o.tests['s1-exam'].mode!=='done') o.tests['s1-exam'].mode='done'; } return o; }
try{var raw=localStorage.getItem(LS); if(raw){var o=JSON.parse(raw); if(o&&o.tests) S=migrate(o);}}catch(e){}
var V={view:'home',test:null,p:0,ev:null}; // view state
var ref=null, writing=false, dirty=false, dbTimer=null, lastSel=null, tick=null;

function T(id){ if(!S.tests[id]) S.tests[id]={ans:{},first:null,fixed:{},tries:0,mode:'doing',retry:[],hl:{},hint:{},elapsed:0}; var t=S.tests[id]; if(!t.hint) t.hint={}; if(!t.hl) t.hl={}; if(!t.fixed) t.fixed={}; if(!t.retry) t.retry=[]; return t; }
function saveLocal(){ try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} }
function save(now){ S.updatedAt=Date.now(); saveLocal(); if(!ref) return; clearTimeout(dbTimer); dbTimer=setTimeout(push, now?50:3000); }
function push(){ if(!ref) return; if(writing){dirty=true;return;} writing=true; dirty=false;
  ref.set(JSON.parse(JSON.stringify(S))).catch(function(){}).then(function(){writing=false; if(dirty) push();}); }
function initDb(){
  if(!window.claude||!window.claude.use) return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1]; if(!db||!user) return;
    return user.id().then(function(id){
      if(!id) return;
      var d=db.doc('data/users/'+id+'/state2');
      return d.get().then(function(snap){
        ref=d;
        if(snap.exists){ var rem=snap.data();
          if(rem&&rem.tests&&(rem.updatedAt||0)>(S.updatedAt||0)){ S=migrate(JSON.parse(JSON.stringify(rem))); saveLocal(); if(V.view!=='exam') render(); else renderTop(); }
          else if((S.updatedAt||0)>(rem&&rem.updatedAt||0)) push();
        } else if(S.updatedAt) push();
      });
    });
  }).catch(function(){});
}

/* ===================== HELPERS ===================== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/^[\s.,;:!?]+|[\s.,;:!?]+$/g,'');}
function $(s,r){return (r||document).querySelector(s);}
function getTest(id){for(var i=0;i<TESTS.length;i++) if(TESTS[i].id===id) return TESTS[i];}
var IDX={};
TESTS.forEach(function(t){var m={},list=[];t.passages.forEach(function(p,pi){p.groups.forEach(function(g){g.items.forEach(function(it){var r={n:it.n,it:it,g:g,p:pi};m[it.n]=r;list.push(r);});});});list.sort(function(a,b){return a.n-b.n;});IDX[t.id]={m:m,list:list};});
function correct(it,v){ if(v==null||v==='') return false; return Array.isArray(it.a)? it.a.map(norm).indexOf(norm(v))>=0 : v===it.a; }
function answered(v){return v!=null&&norm(v)!=='';}
function NQ(id){return IDX[id].list.length;}
function fmt(x){var r=Math.round(x*10)/10; return String(r).replace('.',',');}
function coinsOf(id){var t=S.tests[id]; if(!t||!t.first) return 0; var c=0; for(var n in t.first) c+= t.first[n]?((t.hint&&t.hint[n])?1:2):-1; c+=0.5*Object.keys(t.fixed||{}).length; return c;}
function earned(){var c=0; for(var id in S.tests) c+=coinsOf(id); return c;}
function score(id){var t=T(id),L=IDX[id].list,tot=0,per=[0,0,0]; L.forEach(function(r){ if(correct(r.it,t.ans[r.n])){tot++;per[r.p]++;} }); return {tot:tot,per:per};}
function firstScore(id){var t=T(id),c=0; for(var n in t.first) if(t.first[n]) c++; return c;}
function toast(m){var e=$('#toast'); e.textContent=m; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){e.classList.remove('on');},2600);}
function modal(html){var m=$('#modal'); m.innerHTML='<div class="dlg">'+html+'</div>'; m.classList.add('on');}
function closeModal(){var m=$('#modal'); m.classList.remove('on'); m.innerHTML='';}
function lang(en,vi){return '<div class="row"><div class="lang-stack"><div>'+en+'</div><div class="off" lang="vi">'+vi+'</div></div><button class="lt" data-act="lang" aria-label="Switch language">VI</button></div>';}
function ansLabel(r){var a=r.it.a; if(r.g.type==='tfng') return {T:'TRUE',F:'FALSE',NG:'NOT GIVEN'}[a]; if(r.g.type==='mcq') return a+'. '+r.it.opts['ABCD'.indexOf(a)]; if(Array.isArray(a)) return a[0]; return a;}

/* ===================== RENDER: TOP ===================== */
function renderTop(){
  var h='';
  if(V.view==='exam'){
    var t=getTest(V.test), st=T(V.test);
    h+='<button class="tbtn" data-act="home">←<span class="lg"> Tests</span></button><span class="brand ex">'+t.title+'</span>';
    t.passages.forEach(function(p,i){h+='<button class="tbtn '+(V.p===i?'on':'dim')+'" data-act="pass" data-p="'+i+'">P<span class="lg">assage </span>'+(i+1)+'</button>';});
    h+='<button class="tbtn only-m" data-act="flip" id="flip"></button><span class="sp"></span>';
    h+='<span class="timer" id="timer"></span>';
    if(st.mode==='doing') h+='<button class="tbtn pri" data-act="submit">Submit</button>';
    else if(st.mode==='retry') h+='<button class="tbtn pri" data-act="recheck">Check again</button>';
  } else {
    h+='<span class="brand">Xuxu IELTS Reading<small>read · find · prove</small></span><div class="tabs"><button class="tab '+(V.view==='home'?'on':'')+'" data-act="tab" data-v="home">Tests</button><button class="tab '+(V.view==='tips'?'on':'')+'" data-act="tab" data-v="tips">Tips</button></div><span class="sp"></span>';
  }
  h+='<button class="coin" data-act="coins" title="Xu"><i>●</i> '+fmt(earned()-(S.rewarded||0))+' xu</button>';
  $('#top').innerHTML=h;
  if(V.view==='exam'){ updTimer(); updFlip(); }
}
function updFlip(){var f=$('#flip'); if(f) f.textContent=document.body.classList.contains('show-p')?'Questions':'Passage';}
function updTimer(){var e=$('#timer'); if(!e) return; var t=getTest(V.test), st=T(V.test), left=t.minutes*60-(st.elapsed||0), a=Math.abs(left);
  e.textContent=(left<0?'+':'')+Math.floor(a/60)+':'+('0'+(a%60)).slice(-2); e.classList.toggle('over',left<0);}

/* ===================== RENDER: HOME / TIPS ===================== */
var KIND={try:'Thử',practice:'Luyện tập',exam:'Thi'};
function renderHome(){
  var h='<div class="wrap"><p class="note">Each set has three tests on the same topics. Start with <b>Thử</b> (you can open hints), then <b>Luyện tập</b>, then <b>Thi</b> (one submit only). Every test: 3 passages, 15 questions, 20 minutes. First try: correct +2 xu (+1 with a hint), wrong −1 xu. Fix a wrong answer later: +0,5 xu.</p>';
  SETS.forEach(function(s){
    h+='<div class="tcard"><div class="head"><h2>Bộ '+s.n+'</h2><span class="meta">'+esc(s.theme)+'</span></div><div class="trio">';
    s.tests.forEach(function(id){
      var t=getTest(id), st=S.tests[id], line='Not started', cls='';
      if(st){ var n=0; IDX[id].list.forEach(function(r){if(answered(st.ans[r.n])) n++;});
        if(st.first){ line=firstScore(id)+'/'+NQ(id)+' · '+fmt(coinsOf(id))+' xu'; cls=' fin'; }
        else if(n||st.elapsed){ line=n+'/'+NQ(id)+' answered'; cls=' prog'; } }
      h+='<button class="tbox'+cls+'" data-act="open" data-t="'+id+'"><b>'+KIND[t.kind]+'</b><span>'+line+'</span></button>';
    });
    h+='</div></div>';
  });
  $('#app').innerHTML=h+'</div>';
}
function renderTips(){
  var h='<div class="wrap">';
  TIPS.forEach(function(t){
    function ol(a){return '<ol>'+a.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>';}
    h+='<div class="tip"><div class="lang-stack"><div><h3>'+t[0]+'</h3>'+ol(t[1])+'</div><div class="off" lang="vi"><h3>'+t[0]+'</h3>'+ol(t[2])+'</div></div><button class="lt" data-act="lang">VI</button></div>';
  });
  $('#app').innerHTML=h+'</div>';
}

/* ===================== RENDER: EXAM ===================== */
function editable(st,n){return st.mode==='doing'||(st.mode==='retry'&&st.retry.indexOf(n)>=0);}
function showMark(st,n){return st.mode==='checked'||st.mode==='done'||(st.mode==='retry'&&st.retry.indexOf(n)<0);}
function paraHtml(text,hls,ev){
  var pts=[0,text.length]; hls.forEach(function(h){pts.push(h[0],h[1]);}); if(ev) pts.push(ev[0],ev[1]);
  pts=pts.filter(function(x,i,a){return x>=0&&x<=text.length&&a.indexOf(x)===i;}).sort(function(a,b){return a-b;});
  var out='';
  for(var i=0;i<pts.length-1;i++){var a=pts[i],b=pts[i+1],seg=esc(text.slice(a,b));
    var isH=hls.some(function(h){return h[0]<=a&&h[1]>=b;}), isE=ev&&ev[0]<=a&&ev[1]>=b;
    out+=(isH||isE)?'<span class="'+(isH?'hl ':'')+(isE?'ev':'')+'" data-o="'+a+'">'+seg+'</span>':seg;}
  return out;
}
function renderPassage(){
  var t=getTest(V.test), st=T(V.test), p=t.passages[V.p], hl=(st.hl[V.p]||[]);
  var h='<div class="ptools"><button class="ghost mk" data-act="hl">✎ Highlight</button><button class="ghost" data-act="hlclear">Clear</button><small>Select text, then tap Highlight</small></div>';
  h+='<h2>'+esc(p.title)+'</h2><div class="sub">Reading Passage '+(V.p+1)+' · Questions '+p.groups[0].items[0].n+'–'+p.groups[p.groups.length-1].items.slice(-1)[0].n+'</div>';
  p.paras.forEach(function(tx,i){
    var hs=hl.filter(function(x){return x[0]===i;}).map(function(x){return [x[1],x[2]];});
    var ev=(V.ev&&V.ev.p===V.p&&V.ev.para===i)?[V.ev.s,V.ev.e]:null;
    h+='<p class="para">'+(p.labeled?'<span class="lab">'+'ABCDEFGH'[i]+'</span>':'')+'<span class="ptext" data-p="'+i+'">'+paraHtml(tx,hs,ev)+'</span></p>';
  });
  var el=$('#pp'); el.innerHTML=h;
  var e=$('.ev',el); if(e) e.scrollIntoView({block:'center'});
}
function qWrap(st,r,inner){
  var n=r.n, v=st.ans[n], cls='q', extra='';
  if(st.mode==='doing') extra+=hintHtml(st,r);
  if(!editable(st,n)) cls+=' lock';
  if(st.mode!=='doing'){ var ok=correct(r.it,v);
    if(showMark(st,n)){ cls+=ok?' ok':' bad'; extra+='<div><span class="mark '+(ok?'ok':'bad')+'">'+(ok?'✓ Correct':'✗ Not correct')+'</span></div>'; }
    else extra+='<div><span class="mark bad">✗ Try again</span></div>';
    if(st.mode==='done') extra+=expHtml(r);
  }
  return '<div class="'+cls+'" id="q-'+n+'"><div class="qn">'+n+'</div><div class="qb">'+inner+extra+'</div></div>';
}
function hintHtml(st,r){ if(getTest(V.test).kind!=='try'||!r.it.hint) return ''; return st.hint[r.n]?'<div class="hint">'+esc(r.it.hint)+'</div>':'<div><button class="hb" data-act="hint" data-n="'+r.n+'">Hint (then max +1 xu)</button></div>'; }
function expHtml(r){
  return '<div class="exp"><div class="ans">Answer: '+esc(ansLabel(r))+'</div>'+lang(r.it.ex,r.it.vi)+(r.it.ev?'<button class="evb" data-act="ev" data-n="'+r.n+'">Show in passage</button>':'')+'</div>';
}
function renderQuestions(){
  var t=getTest(V.test), st=T(V.test), p=t.passages[V.p], M=IDX[V.test].m, h='';
  if(st.mode==='checked'||st.mode==='done'){
    var N=NQ(V.test), sc=score(V.test), wrong=N-sc.tot, msg=sc.tot>=N*0.8?'Great reading!':(sc.tot>=N*0.6?'Good try. Now fix the wrong ones.':'Not yet. Read the passages again, slowly.');
    h+='<div class="banner"><h3>'+sc.tot+' / '+N+' · '+msg+'</h3><div class="meta">Passage 1: '+sc.per[0]+'/5 · Passage 2: '+sc.per[1]+'/5 · Passage 3: '+sc.per[2]+'/5 · First try: '+firstScore(V.test)+'/'+N+' · Xu from this test: '+fmt(coinsOf(V.test))+'</div>';
    if(st.mode==='checked'){ h+='<div class="acts">'+(wrong?'<button class="big" data-act="retry">Try the '+wrong+' wrong question'+(wrong>1?'s':'')+' again</button>':'')+'<button class="ghost" data-act="reveal">Show answers and explanations</button></div>'; }
    h+='</div>';
  } else if(st.mode==='retry'){
    h+='<div class="banner"><h3>Second chance</h3><div class="meta">Only the red questions can be changed. Each one you fix earns 0,5 xu. Tap “Check again” when you finish.</div></div>';
  }
  p.groups.forEach(function(g){
    h+='<div class="grp"><div class="instr"><b class="r">'+g.range+'</b>'+g.instr;
    if(g.type==='heading'){h+='<ul class="hlist">'+g.headings.map(function(x){return '<li><b>'+x[0]+'</b><span>'+esc(x[1])+'</span></li>';}).join('')+'</ul>';}
    h+='</div>';
    if(g.type==='summary'){
      h+='<div class="sum"><h3>'+esc(g.title)+'</h3>'+esc(g.text).replace(/\{(\d+)\}/g,function(_,n){return gapInput(st,M[+n],true);})+'</div>';
      if(st.mode==='doing') g.items.forEach(function(it){var hh=hintHtml(st,M[it.n]); if(hh) h+='<div class="hrow"><span class="sn" style="display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700">'+it.n+'</span>'+hh+'</div>';});
      if(st.mode!=='doing') g.items.forEach(function(it){h+=qWrap(st,M[it.n],'<div class="qt">Your answer: <b>'+esc(st.ans[it.n]||'—')+'</b></div>');});
    } else g.items.forEach(function(it){
      var r=M[it.n], v=st.ans[it.n], dis=editable(st,it.n)?'':' disabled', inner='';
      var rev=st.mode==='done';
      if(g.type==='tfng'){ inner='<div class="qt">'+esc(it.q)+'</div><div class="seg">'+[['T','TRUE'],['F','FALSE'],['NG','NOT GIVEN']].map(function(o){return '<button data-act="pick" data-n="'+it.n+'" data-v="'+o[0]+'" class="'+(v===o[0]?'on':'')+(rev&&it.a===o[0]?' right':'')+'"'+dis+'>'+o[1]+'</button>';}).join('')+'</div>'; }
      else if(g.type==='mcq'){ inner='<div class="qt">'+esc(it.q)+'</div><div class="opts">'+it.opts.map(function(o,i){var L='ABCD'[i];return '<button data-act="pick" data-n="'+it.n+'" data-v="'+L+'" class="opt'+(v===L?' on':'')+(rev&&it.a===L?' right':'')+'"'+dis+'><b>'+L+'</b><span>'+esc(o)+'</span></button>';}).join('')+'</div>'; }
      else if(g.type==='gap'){ inner='<div class="qt">'+esc(it.q).replace('___',gapInput(st,r,false))+'</div>'; }
      else { var vals=g.type==='heading'?g.headings.map(function(x){return x[0];}):g.letters.split('');
        inner='<div class="qt">'+esc(it.q)+'</div><select class="sel" data-n="'+it.n+'"'+dis+'><option value="">Choose…</option>'+vals.map(function(x){return '<option'+(v===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'; }
      h+=qWrap(st,r,inner);
    });
    h+='</div>';
  });
  $('#qq').innerHTML=h;
}
function gapInput(st,r,num){
  var n=r.n, v=st.ans[n]||'', cls='gap';
  if(st.mode!=='doing'&&showMark(st,n)) cls+=correct(r.it,v)?' ok':' bad'; else if(st.mode==='retry') cls+=' bad';
  return (num?'<span class="sn">'+n+'</span>':'')+'<input class="'+cls+'" id="g-'+n+'" data-n="'+n+'" value="'+esc(v)+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Answer '+n+'"'+(editable(st,n)?'':' disabled')+'>';
}
function renderFoot(){
  var t=getTest(V.test), st=T(V.test), h='', cur=-1;
  IDX[V.test].list.forEach(function(r){
    if(r.p!==cur){cur=r.p; h+='<span class="pl">P'+(cur+1)+'</span>';}
    var c='chip'+(r.p!==V.p?' dim':'');
    if(st.mode==='doing'){ if(answered(st.ans[r.n])) c+=' a'; }
    else if(showMark(st,r.n)) c+=correct(r.it,st.ans[r.n])?' ok':' bad'; else c+=' bad';
    h+='<button class="'+c+'" data-act="goto" data-n="'+r.n+'">'+r.n+'</button>';
  });
  $('#foot').innerHTML=h;
}
function renderExam(){
  $('#app').innerHTML='<div class="exam"><div class="split"><div class="pane pp" id="pp"></div><div class="pane qq" id="qq"></div></div><div class="foot" id="foot"></div></div>';
  renderPassage(); renderQuestions(); renderFoot();
}
function render(){
  renderTop(); clearInterval(tick); tick=null;
  if(V.view==='home') renderHome(); else if(V.view==='tips') renderTips();
  else { renderExam(); tick=setInterval(function(){ var st=T(V.test); if(st.mode!=='doing'||document.hidden) return; st.elapsed=(st.elapsed||0)+1; updTimer(); if(st.elapsed%20===0) saveLocal(); },1000); }
}
function gotoQ(n){
  var r=IDX[V.test].m[n]; if(r.p!==V.p){V.p=r.p; V.ev=null; renderTop(); renderPassage(); renderQuestions(); renderFoot();}
  document.body.classList.remove('show-p'); document.body.classList.add('show-q'); updFlip();
  var e=$('#q-'+n)||$('#g-'+n); if(e) e.scrollIntoView({block:'center'});
}

/* ===================== ACTIONS ===================== */
function doSubmit(){
  var st=T(V.test), L=IDX[V.test].list, miss=L.filter(function(r){return !answered(st.ans[r.n]);});
  if(miss.length){ toast('Answer every question first. '+miss.length+' left.'); gotoQ(miss[0].n); return; }
  var ex=getTest(V.test).kind==='exam';
  modal('<h3>Submit '+getTest(V.test).title+'?</h3><p>'+(ex?'This is the exam. You submit once, then you see the answers. Correct +2 xu, wrong −1 xu.':'Your first answers decide most of your xu: correct +2, wrong −1. After this you can still fix wrong answers for +0,5 xu each.')+'</p><div class="acts"><button class="ghost" data-act="close">Keep working</button><button class="big" data-act="submit2">Submit</button></div>');
}
function doSubmit2(){
  var st=T(V.test); st.first={}; IDX[V.test].list.forEach(function(r){st.first[r.n]=correct(r.it,st.ans[r.n]);});
  st.tries=1; st.mode=getTest(V.test).kind==='exam'?'done':'checked'; closeModal(); save(true); render(); $('#qq').scrollTop=0;
  document.body.classList.remove('show-p'); document.body.classList.add('show-q'); updFlip();
}
function doRetry(){ var st=T(V.test); st.retry=IDX[V.test].list.filter(function(r){return !correct(r.it,st.ans[r.n]);}).map(function(r){return r.n;}); st.mode='retry'; save(); render(); if(st.retry.length) gotoQ(st.retry[0]); }
function doRecheck(){
  var st=T(V.test), M=IDX[V.test].m, miss=st.retry.filter(function(n){return !answered(st.ans[n]);});
  if(miss.length){ toast('Answer every red question first.'); gotoQ(miss[0]); return; }
  var fixed=0; st.retry.forEach(function(n){ if(correct(M[n].it,st.ans[n])&&st.first[n]===false&&!st.fixed[n]){st.fixed[n]=1;fixed++;} });
  st.tries++; st.retry=[]; st.mode='checked'; save(true); render(); $('#qq').scrollTop=0;
  toast(fixed?('Fixed '+fixed+' · +'+fmt(fixed*0.5)+' xu'):'No new correct answers this time.');
}
function coinDlg(msg){
  var e=earned(), r=S.rewarded||0;
  var h='<h3>Xu</h3><table><tr><td>Xu earned</td><td>'+fmt(e)+'</td></tr><tr><td>Xu đã thưởng</td><td>'+fmt(r)+'</td></tr><tr><td>Xu còn lại</td><td>'+fmt(e-r)+'</td></tr></table>';
  h+='<label>Ba mẹ: mật khẩu</label><input type="password" id="pw" autocomplete="off"><label>Tổng xu đã thưởng</label><input type="number" id="rw" inputmode="decimal" step="0.5" value="'+r+'"><label>Làm lại một đề (xóa kết quả và xu của đề đó)</label><select id="rt">'+TESTS.map(function(t){return '<option value="'+t.id+'">'+t.title+(S.tests[t.id]&&S.tests[t.id].first?' ✓':'')+'</option>';}).join('')+'</select><div class="err" id="perr">'+(msg||'')+'</div>';
  h+='<div class="acts"><button class="ghost" data-act="close">Close</button><button class="ghost" data-act="reset">Reset đề đã chọn</button><button class="big" data-act="saverw">Lưu</button></div>';
  modal(h);
}
function pwOk(){ if($('#pw').value===PW) return true; $('#perr').textContent='Sai mật khẩu.'; return false; }

document.addEventListener('click',function(ev){
  var hlSpan=ev.target.closest&&ev.target.closest('.hl');
  if(hlSpan&&V.view==='exam'){ var st0=T(V.test), pi=+hlSpan.parentElement.dataset.p, o=+hlSpan.dataset.o;
    st0.hl[V.p]=(st0.hl[V.p]||[]).filter(function(x){return !(x[0]===pi&&x[1]<=o&&x[2]>o);}); save(); var sc0=$('#pp').scrollTop; renderPassage(); $('#pp').scrollTop=sc0; return; }
  var b=ev.target.closest&&ev.target.closest('[data-act]'); if(!b) { if(ev.target.id==='modal') closeModal(); return; }
  var act=b.dataset.act, st=V.test?T(V.test):null;
  if(act==='tab'){V.view=b.dataset.v; render();}
  else if(act==='home'){saveLocal(); V.view='home'; V.test=null; V.ev=null; render();}
  else if(act==='open'){V.view='exam'; V.test=b.dataset.t; V.p=0; V.ev=null; T(V.test); document.body.className='show-p'; render();}
  else if(act==='pass'){V.p=+b.dataset.p; V.ev=null; renderTop(); renderPassage(); renderQuestions(); renderFoot(); $('#pp').scrollTop=0; $('#qq').scrollTop=0;}
  else if(act==='flip'){document.body.classList.toggle('show-p'); document.body.classList.toggle('show-q'); updFlip();}
  else if(act==='pick'){ var n=+b.dataset.n; if(!editable(st,n)) return; st.ans[n]=(st.ans[n]===b.dataset.v)?'':b.dataset.v;
    [].forEach.call(b.parentElement.children,function(c){c.classList.toggle('on',c.dataset.v===st.ans[n]);}); save(); renderFoot(); }
  else if(act==='goto'){gotoQ(+b.dataset.n);}
  else if(act==='hint'){ st.hint[+b.dataset.n]=1; save(); var qs=$('#qq').scrollTop; renderQuestions(); $('#qq').scrollTop=qs; }
  else if(act==='submit'){doSubmit();}
  else if(act==='submit2'){doSubmit2();}
  else if(act==='retry'){doRetry();}
  else if(act==='recheck'){doRecheck();}
  else if(act==='reveal'){ modal('<h3>Show the answers?</h3><p>After you see the answers, you cannot earn more xu from this test.</p><div class="acts"><button class="ghost" data-act="close">Not yet</button><button class="big" data-act="reveal2">Show answers</button></div>'); }
  else if(act==='reveal2'){ st.mode='done'; closeModal(); save(true); render(); }
  else if(act==='close'){closeModal();}
  else if(act==='lang'){ var stack=b.parentElement.querySelector('.lang-stack'); [].forEach.call(stack.children,function(c){c.classList.toggle('off');}); b.textContent=b.textContent==='VI'?'EN':'VI'; }
  else if(act==='ev'){ var r=IDX[V.test].m[+b.dataset.n], p=getTest(V.test).passages[r.p], s=p.paras[r.it.ev[0]].indexOf(r.it.ev[1]);
    V.ev={p:r.p,para:r.it.ev[0],s:s,e:s+r.it.ev[1].length}; document.body.classList.remove('show-q'); document.body.classList.add('show-p'); updFlip(); renderPassage(); }
  else if(act==='hl'){ if(!lastSel){toast('Select some words in the passage first.');return;} st.hl[V.p]=st.hl[V.p]||[]; st.hl[V.p].push([lastSel.p,lastSel.s,lastSel.e]); lastSel=null; try{getSelection().removeAllRanges();}catch(e){} save(); var sc=$('#pp').scrollTop; renderPassage(); $('#pp').scrollTop=sc; }
  else if(act==='hlclear'){ st.hl[V.p]=[]; save(); var sc2=$('#pp').scrollTop; renderPassage(); $('#pp').scrollTop=sc2; }
  else if(act==='coins'){coinDlg();}
  else if(act==='saverw'){ if(!pwOk()) return; var x=parseFloat($('#rw').value); if(isNaN(x)||x<0){$('#perr').textContent='Số xu không hợp lệ.';return;} S.rewarded=x; save(true); closeModal(); renderTop(); toast('Đã lưu.'); }
  else if(act==='reset'){ if(!pwOk()) return; delete S.tests[$('#rt').value]; save(true); closeModal(); V.view='home'; V.test=null; render(); toast('Test reset.'); }
});
document.addEventListener('input',function(ev){
  var e=ev.target; if(!V.test||!e.dataset||!e.dataset.n) return; var st=T(V.test), n=+e.dataset.n; if(!editable(st,n)) return;
  if(e.classList.contains('gap')||e.classList.contains('sel')){ st.ans[n]=e.value; save(); renderFoot(); }
});
document.addEventListener('selectionchange',function(){
  var sel=window.getSelection&&getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return;
  var r=sel.getRangeAt(0);
  function host(n){var x=n.nodeType===1?n:n.parentElement; return x&&x.closest?x.closest('.ptext'):null;}
  var a=host(r.startContainer); if(!a) return;
  var pre=document.createRange(); pre.selectNodeContents(a); pre.setEnd(r.startContainer,r.startOffset);
  var s=pre.toString().length, e;
  if(host(r.endContainer)===a){ var p2=document.createRange(); p2.selectNodeContents(a); p2.setEnd(r.endContainer,r.endOffset); e=p2.toString().length; } else e=a.textContent.length;
  if(e>s) lastSel={p:+a.dataset.p,s:s,e:e};
});
window.addEventListener('pagehide',saveLocal);
window.__T__={S:function(){return S;},V:V,TESTS:TESTS,IDX:IDX};
render(); initDb();
})();
